<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#1f3b34" />
  <title>Roam — trip planner</title>
  <link rel="icon" id="favicon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2216%22%20fill%3D%22%231f3b34%22%2F%3E%3Ctext%20x%3D%2213%22%20y%3D%2247%22%20font-family%3D%22Georgia%2Cserif%22%20font-size%3D%2244%22%20font-weight%3D%22700%22%20fill%3D%22%23f6f4ef%22%3Er%3C%2Ftext%3E%3Ccircle%20cx%3D%2244%22%20cy%3D%2243%22%20r%3D%226%22%20fill%3D%22%23e2673f%22%2F%3E%3C%2Fsvg%3E" />
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2216%22%20fill%3D%22%231f3b34%22%2F%3E%3Ctext%20x%3D%2213%22%20y%3D%2247%22%20font-family%3D%22Georgia%2Cserif%22%20font-size%3D%2244%22%20font-weight%3D%22700%22%20fill%3D%22%23f6f4ef%22%3Er%3C%2Ftext%3E%3Ccircle%20cx%3D%2244%22%20cy%3D%2243%22%20r%3D%226%22%20fill%3D%22%23e2673f%22%2F%3E%3C%2Fsvg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..700;1,400..600&family=Suez+One&display=swap" rel="stylesheet">
  <style>
    :root{
      --ink:#15231f; --muted:#6a746e; --paper:#f6f4ef; --cream:#ebe8df; --line:#dcdcd2;
      --moss:#1f3b34; --orange:#e2673f; --sun:#f0c04b; --radius:20px;
      --display:'Suez One',Georgia,serif; --ui:'Rubik',system-ui,sans-serif;
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--ui);font-weight:400;-webkit-text-size-adjust:100%}
    button,input,select,textarea{font:inherit;color:inherit}
    input[type="date"]{cursor:pointer}
    input[type="date"]::-webkit-calendar-picker-indicator{cursor:pointer;opacity:.55;padding:4px;border-radius:7px;transition:opacity .15s,background .15s}
    input[type="date"]::-webkit-calendar-picker-indicator:hover{opacity:1;background:var(--cream)}
    button{cursor:pointer}
    h1,h2,h3,.brand,.stat b{font-family:var(--display);font-weight:400;letter-spacing:-.01em}
    :focus-visible{outline:2px solid var(--moss);outline-offset:2px}
    .shell{max-width:1400px;margin:auto;padding:0 40px 48px}
    header{height:84px;display:flex;align-items:center;justify-content:space-between;gap:12px}
    .brand{font-size:27px;direction:ltr}.brand span{color:var(--orange)}
    .head-tools{display:flex;gap:8px;flex-wrap:wrap}
    .trip-hero{background-size:cover;background-position:center;background-repeat:no-repeat}
    .hero{min-height:260px;background:linear-gradient(90deg,rgba(15,30,25,.38),rgba(15,30,25,.05)),url('https://images.unsplash.com/photo-1500835556837-99ac94a94552?auto=format&fit=crop&w=1800&q=85') center/cover;border-radius:var(--radius);padding:36px 40px;color:#fff;position:relative;overflow:hidden}
    html[dir="rtl"] .hero{background:linear-gradient(270deg,rgba(15,30,25,.38),rgba(15,30,25,.05)),url('https://images.unsplash.com/photo-1500835556837-99ac94a94552?auto=format&fit=crop&w=1800&q=85') center/cover}
    .eyebrow{font-size:12px;opacity:.85;letter-spacing:.04em;text-shadow:0 1px 8px rgba(0,0,0,.45)}
    .hero h1{font-size:44px;line-height:1.08;margin:14px 0 10px;text-shadow:0 2px 14px rgba(0,0,0,.5)}
    .hero p{margin:0;opacity:.88;font-size:15px;max-width:52ch;line-height:1.5;text-shadow:0 1px 8px rgba(0,0,0,.45)}
    .hero-side{position:absolute;inset-inline-end:40px;bottom:34px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
    .datefield{display:flex;align-items:center;gap:8px;padding:10px 14px;background:rgba(255,255,255,.14);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.28);border-radius:99px;font-size:13px}
    .datefield input{background:none;border:0;color:#fff;font-size:13px;width:140px}
    .datefield input::-webkit-calendar-picker-indicator{filter:invert(1);opacity:.8}
    .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin:22px 0 32px}
    .stat{background:var(--paper);padding:16px 18px}.stat b{display:block;font-size:22px}.stat span{color:var(--muted);font-size:12px}
    .section-head{display:flex;align-items:end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin:0 0 16px}
    .section-head h2{font-size:26px;margin:0}.section-head p{margin:0;color:var(--muted);font-size:13px}
    .btn{border:0;border-radius:10px;padding:11px 15px;font-weight:500;font-size:13px;background:var(--ink);color:#fff}
    .btn.light{background:#fff;color:var(--ink);border:1px solid var(--line)}.btn.light:hover{background:var(--cream)}
    .btn.orange{background:var(--orange);color:#fff}.btn.danger{color:#b23b2f}
    .sort-toggle{display:flex;gap:2px;background:#f1f5ee;border:1px solid var(--line);border-radius:10px;padding:2px}
    .sort-toggle .sort-btn{border:0;background:transparent;border-radius:8px;padding:7px 12px;font-size:12.5px;font-weight:500;color:var(--muted);cursor:pointer}
    .sort-toggle .sort-btn.active{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
    .destinations{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px;margin:0 0 40px}
    .dest-card{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;cursor:pointer;min-width:0}
    .dest-card-media{height:145px;background:linear-gradient(135deg,#d9e0d6,#bfc9c0) center/cover no-repeat;position:relative}
    .dest-card-media.no-image::after{content:'🌍';position:absolute;inset:0;display:grid;place-items:center;font-size:42px;opacity:.35;pointer-events:none;z-index:1}
    .dest-swap{position:absolute;top:8px;inset-inline-end:8px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(21,35,31,.55);backdrop-filter:blur(4px);color:#fff;font-size:12px;display:grid;place-items:center;padding:0;line-height:1;cursor:pointer;z-index:2}
    .dest-swap:hover{background:rgba(21,35,31,.75)}
    .dest-card-body{padding:16px;display:flex;flex-direction:column;gap:7px;min-height:155px}
    .dest-card h3{margin:0;font-size:20px}.dest-card small{color:var(--muted)}
    .en-name{color:var(--muted);font-weight:400;font-size:.62em;white-space:nowrap;font-family:var(--ui);letter-spacing:0}
    .city-alt-name{margin-top:6px;font-size:12.5px;color:var(--muted)}
    .hero .en-name{color:rgba(255,255,255,.75)}
    .dest-meta{display:flex;gap:14px;color:var(--muted);font-size:12px}.dest-actions{display:flex;gap:8px;margin-top:auto;flex-wrap:wrap}
    .days-stepper{display:flex;align-items:center;justify-content:center;gap:18px;background:var(--cream);border:1px solid var(--line);border-radius:14px;padding:10px 14px}
    .days-step-btn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:19px;font-weight:600;color:var(--ink);display:grid;place-items:center;line-height:1}
    .days-step-btn:hover{background:var(--moss);border-color:var(--moss);color:#fff}
    .days-step-btn:active{transform:scale(.94)}
    .days-step-btn:disabled{opacity:.35;pointer-events:none}
    .days-value{min-width:88px;text-align:center;font-size:18px;font-weight:600;white-space:nowrap}
    .empty-state{border:1px dashed var(--line);border-radius:16px;padding:40px;text-align:center;color:var(--muted)}
    .mapwrap{border-radius:var(--radius);overflow:hidden;border:1px solid var(--line);background:#d9e0d6;height:410px;position:relative;z-index:0;transition:height .2s,position .2s}.mapwrap.expanded{position:fixed;inset:14px;z-index:50;height:auto;border-radius:18px;box-shadow:0 20px 60px #15231f55}.mapwrap.expanded .map{height:100%}
    .map{width:100%;height:100%}
    .map-label{position:absolute;bottom:16px;inset-inline-start:18px;background:#fffdf9ee;padding:10px 13px;border-radius:9px;font-size:12px;box-shadow:0 5px 20px #17201c15;z-index:1;max-width:70%;line-height:1.45}
    .map-toolbar{position:absolute;z-index:7;top:13px;inset-inline-start:13px;display:flex;gap:6px;flex-wrap:wrap;max-width:calc(100% - 26px)}
    .map-toolbar button{border:0;background:#fff;border-radius:9px;padding:9px 11px;font-size:12px;font-weight:500;box-shadow:0 2px 8px #17201c1f}.map-expand{margin-inline-start:auto}
    .map-toolbar button.active{background:var(--moss);color:#fff}
    .mode-switch{display:inline-flex;border:1px solid var(--line);border-radius:99px;padding:3px;gap:2px;background:#fff}
    .mode-opt{border:0;background:transparent;border-radius:99px;padding:8px 13px;font-size:13px;font-weight:500;cursor:pointer;color:var(--muted)}
    .mode-opt.active{background:var(--moss);color:#fff}
    .map-search{position:relative}
    .map-search input{border:0;border-radius:9px;padding:9px 11px;font-size:12px;font-weight:500;box-shadow:0 2px 8px #17201c1f;min-width:160px;font-family:inherit}
    .map-search .suggest{top:calc(100% + 4px)}
    .layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:26px;margin-top:38px}
    .days{display:grid;gap:15px}.day{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff}
    .daytop{display:flex;align-items:center;gap:10px;padding:13px 15px;border-bottom:1px solid var(--line);flex-wrap:wrap}
    .daynum{display:grid;place-items:center;width:30px;height:30px;border-radius:9px;font-size:12px;font-weight:600}
    .daytop strong{font-size:14px;font-weight:600}.daytop .dd{color:var(--muted);font-size:12px}
    .day-tools{margin-inline-start:auto;display:flex;gap:6px;flex-wrap:wrap}
    .icon-btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 10px;font-size:12px;color:var(--muted)}.icon-btn:hover{background:var(--cream);color:var(--ink)}
    .stops{padding:10px;min-height:52px}
    .stop{display:grid;grid-template-columns:auto auto 1fr auto;gap:10px;align-items:center;border-radius:11px;padding:10px;cursor:grab}
    .stop-return{cursor:pointer;opacity:.85}
    .stop:hover{background:var(--cream)}.handle{color:#b3b9b3;font-size:17px}
    .stop-num{flex:0 0 20px;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:10.5px;font-weight:700;color:#fff}
    .stop-main{display:flex;align-items:center;gap:12px;min-width:0;cursor:pointer}.stop-thumb{width:72px;height:72px;object-fit:cover;border-radius:11px;flex:0 0 72px;background:var(--cream)}.stop-thumb-empty{display:grid;place-items:center;background:#f1efe8;color:#8a938b;font-size:24px}.stop-copy{min-width:0}.stop b{font-size:13.5px;font-weight:500;display:block}.stop small{color:var(--muted);font-size:11.5px}
    .thumb-wrap{position:relative}
    .thumb-swap{position:absolute;bottom:-6px;inset-inline-end:-6px;width:20px;height:20px;border-radius:50%;border:1px solid var(--line);background:#fff;color:var(--ink);font-size:11px;display:grid;place-items:center;padding:0;line-height:1;box-shadow:0 2px 6px #17201c2a;z-index:2}
    .thumb-swap:hover{background:var(--cream)}
    .hero-swap{position:absolute;top:18px;inset-inline-end:18px;z-index:3;border:0;background:rgba(255,255,255,.16);backdrop-filter:blur(6px);color:#fff;border-radius:99px;padding:8px 13px;font-size:12.5px;cursor:pointer}
    .hero-swap:hover{background:rgba(255,255,255,.28)}
    .stop-tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
    a.icon-btn{text-decoration:none;display:inline-flex;align-items:center;line-height:1.2}
    .stop-edit{margin:6px 0 10px;padding:12px;border:1px solid var(--line);border-radius:14px;background:#fbfaf6;display:grid;gap:8px}
    .stop-edit input,.stop-edit textarea{width:100%;font:inherit;font-size:13.5px;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:#fff;resize:vertical}
    .stop-edit input{font-weight:500}
    .stop-edit-actions{display:flex;gap:8px}
    .stop-edit .save{border:0;background:var(--moss);color:#fff;border-radius:9px;padding:8px 16px;font-size:12.5px}
    .stop-tools select{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 7px;font-size:11.5px;color:var(--muted)}
    .tag{font-size:10.5px;padding:5px 8px;border-radius:99px;background:#f1efe8;color:#626b64}
    .travel{margin:0 0 0 38px;color:var(--muted);font-size:11.5px;padding-inline-start:12px;border-inline-start:1px dashed #bcc3bc;min-height:18px;line-height:18px;display:flex;align-items:center;gap:6px}
    .transit-toggle{border:0;background:none;padding:0;font-size:12px;cursor:pointer;opacity:.4;line-height:1}
    .transit-toggle:hover{opacity:1}
    .travel.transit{color:#3f7ad9}
    .travel.transit .transit-toggle{opacity:1}
    html[dir="rtl"] .travel{margin:0 38px 0 0}
    .day-empty{color:var(--muted);font-size:12px;padding:12px 10px}
    .sidebar{display:grid;gap:16px;align-content:start}
    .card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px}.card h3{font-size:17px;margin:0 0 12px}
    .wx-row{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--cream);font-size:12.5px}
    .wx-row:last-child{border-bottom:0}.wx-row .ic{font-size:20px}.wx-row .d{color:var(--muted);flex:1}.wx-row b{font-weight:600}
    .wx-note{color:var(--muted);font-size:11.5px;margin-top:8px;line-height:1.45}
    .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
    .chip{border:1px dashed #c3ccbf;background:#f1f5ee;color:#33513f;border-radius:99px;padding:6px 10px;font-size:11.5px}
    .chip:hover{background:#e6eee2}
    .check{display:grid;gap:8px}
    .check label{display:flex;gap:9px;align-items:center;color:var(--muted);font-size:12.5px}
    .check input[type=checkbox]{accent-color:var(--moss);width:16px;height:16px}
    .check .del{margin-inline-start:auto;border:0;background:none;color:#b0b6b0;font-size:13px}.check .del:hover{color:#b23b2f}
    .add{width:100%;background:none;border:1px dashed #bfc4ba;padding:10px;border-radius:9px;color:var(--moss);font-size:12px;margin-top:12px}
    #tripNote{width:100%;min-height:104px;resize:vertical;border:1px solid var(--line);border-radius:10px;padding:11px;font-size:13px;line-height:1.5;background:var(--paper)}
    .filters{display:flex;gap:7px;flex-wrap:wrap}
    .filter{border:1px solid var(--line);background:#fff;border-radius:99px;padding:7px 12px;color:var(--muted);font-size:12px}
    .filter.active{color:#fff;background:var(--moss);border-color:var(--moss)}
    .fab{position:fixed;inset-inline-end:22px;bottom:22px;width:56px;height:56px;border:0;background:var(--orange);color:#fff;border-radius:50%;font-size:26px;box-shadow:0 8px 22px #c2523560;z-index:6}
    .modal{position:fixed;inset:0;background:#15231fb0;display:none;z-index:10;align-items:center;justify-content:center;padding:18px}
    .modal.open{display:flex}
    .modal-box{background:var(--paper);width:min(620px,100%);border-radius:18px;padding:24px;max-height:90vh;overflow:auto}
    .modal h2{font-size:25px;margin:0 0 6px}.modal p{color:var(--muted);font-size:13px;line-height:1.5}
    .modal input,.modal select{width:100%;border:1px solid var(--line);background:#fff;border-radius:10px;padding:11px 12px}
    .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px;flex-wrap:wrap}
    .field{display:grid;gap:6px;margin-bottom:14px;position:relative}.field label{font-size:12px;color:var(--muted)}
    .wheel-wrap{display:flex;align-items:center;gap:10px}
    .wheel-step{width:38px;height:38px;border:1px solid var(--line);background:#fff;border-radius:11px;font-size:18px;line-height:1;color:var(--muted);flex:none}
    .wheel-step:hover{background:var(--cream);color:var(--ink)}
    .wheel{position:relative;flex:1;height:132px;border:1px solid var(--line);background:#fff;border-radius:13px;overflow:hidden}
    .wheel-band{position:absolute;inset-inline:6px;top:44px;height:44px;border-radius:9px;background:#eaf0e6;border:1px solid #c5d2bd;pointer-events:none}
    .wheel-fade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(#fff 0%,#fff0 34%,#fff0 66%,#fff 100%)}
    .wheel-scroll{position:relative;height:100%;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none;padding:44px 0;text-align:center}
    .wheel-scroll::-webkit-scrollbar{display:none}
    .wheel-opt{height:44px;line-height:44px;scroll-snap-align:start;font-size:14px;color:var(--muted);cursor:pointer;transition:color .15s,font-weight .15s}
    .wheel-opt.on{color:var(--moss);font-weight:600;font-size:15px}
    .suggest{position:absolute;top:100%;inset-inline-start:0;width:100%;background:#fff;border:1px solid var(--line);border-radius:12px;margin-top:4px;z-index:3;overflow:hidden;box-shadow:0 10px 30px #15231f22}
    .suggest button{display:block;width:100%;text-align:start;border:0;background:none;padding:10px 12px;font-size:13px}
    .suggest button:hover{background:var(--cream)}.suggest small{color:var(--muted);display:block;font-size:11.5px}
    .mini-form{display:grid;grid-template-columns:1fr auto;gap:8px;margin:12px 0}.mini-form input{min-width:0}
    .hint{background:#eef3ea;color:#3d5a45;padding:10px 12px;border-radius:9px;font-size:12px;line-height:1.45;margin-top:11px}
    .warn{background:#fdf0e9;color:#94432a;padding:10px 12px;border-radius:9px;font-size:12px;line-height:1.45;margin:12px 0}
        .search-place-result{display:flex;align-items:center;gap:10px;width:100%}.search-place-result img{width:42px;height:42px;border-radius:8px;object-fit:cover;flex:0 0 auto;background:var(--cream)}
.nearby-list{max-height:180px;overflow:auto;margin-top:10px;padding-top:8px;border-top:1px solid var(--line)}
    .nearby-list button{display:block;width:100%;text-align:start;border:0;background:none;padding:6px 0;color:var(--moss);font-size:12px}
    .idea-card{font-family:var(--ui);width:min(420px,72vw);max-height:60vh;overflow-y:auto;overscroll-behavior:contain;padding-inline-end:6px;line-height:1.5;color:var(--ink);font-size:14px}
    .gm-style-iw-c:has(.idea-card){max-height:none!important}
    .gm-style-iw-d:has(.idea-card){max-height:none!important;overflow:visible!important}
    .idea-card img{display:block;width:100%;height:190px;object-fit:cover;border-radius:12px;margin-bottom:10px;background:var(--cream)}
    .idea-card h4{margin:0 0 3px;font-family:var(--display);font-weight:400;font-size:21px;line-height:1.25}
    .idea-card .meta{font-size:13px;color:var(--muted)}
    .idea-card .row{font-size:13.5px;margin-top:8px}
    .idea-card .sum{font-size:13.5px;margin-top:8px;color:#3a463f}
    .idea-card .ok{color:#2f7a4d}.idea-card .no{color:#a24a2a}
    .idea-card .hours{margin-top:8px;font-size:12.5px;color:#3a463f}.idea-card .hours summary{cursor:pointer;color:var(--moss)}.idea-card .hours div{padding:2px 0}
    .idea-card .links{display:flex;flex-wrap:wrap;gap:16px;margin-top:10px;font-size:13.5px}
    .idea-card .links a{color:var(--moss);font-weight:500}
    .idea-card .idea-edit{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);display:grid;gap:8px}
    .idea-card .idea-edit input,.idea-card .idea-edit textarea{width:100%;font:inherit;font-size:13.5px;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:#fff;resize:vertical}
    .idea-card .idea-edit input{font-weight:500}
    .idea-card .add-row{display:flex;gap:8px;margin-top:12px}
    .idea-card select{flex:1;min-width:0;font-size:13.5px;padding:9px;border:1px solid var(--line);border-radius:9px;background:#fff}
    .idea-card .add-idea-btn{border:0;background:var(--moss);color:#fff;border-radius:9px;padding:9px 16px;font-size:13.5px;white-space:nowrap}
    .idea-card .add-idea-btn.ghost{background:#fff;color:var(--moss);border:1px solid var(--line)}
    .stop .stop-note{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-line;margin-top:2px;color:#4c5a52}
    .map-resizer{height:24px;margin-top:4px;display:flex;align-items:center;justify-content:center;gap:10px;cursor:ns-resize;touch-action:none;user-select:none;font-size:11px;color:var(--muted);border-radius:8px}
    .map-resizer::before,.map-resizer::after{content:"";width:34px;height:4px;border-radius:3px;background:var(--line)}
    .map-resizer:hover,.map-resizer:focus-visible{background:var(--cream)}
    .mapwrap.resizing{transition:none}
    .mapwrap.expanded{height:auto!important}
    .mapwrap.expanded + .map-resizer{display:none}
    .day-legend{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
    .day-chip{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border:1px solid var(--line);background:#fff;border-radius:99px;font-size:11.5px;color:var(--muted);cursor:pointer}
    .day-chip i{width:9px;height:9px;border-radius:50%;display:block}
    .day-chip.active{color:var(--ink);border-color:currentColor;font-weight:600}
    .city-legend{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:0 0 10px}
    .city-chip{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border:1px solid var(--line);background:#fff;border-radius:99px;font-size:11.5px;color:var(--muted);cursor:pointer}
    .city-chip.active{background:var(--moss);border-color:var(--moss);color:#fff;font-weight:600}
    .city-chip.add{border-style:dashed;color:var(--moss)}
    .city-add-input{border:1px solid var(--line);border-radius:99px;padding:5px 12px;font-size:11.5px;width:150px;background:#fff;color:var(--ink)}
    .icon-btn.active{background:var(--ink);color:var(--paper);border-color:var(--ink)}
    .stop-hours{display:block;margin-top:2px;font-size:11.5px;font-weight:600;color:#c1432a}
    .stop-hours.closed{color:#8a938b;font-weight:500}
    .toast{position:fixed;inset-inline:0;bottom:26px;margin:auto;width:max-content;max-width:90vw;background:var(--ink);color:#fff;padding:11px 16px;border-radius:99px;font-size:13px;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none}
    .toast.show{opacity:1}
    .sync-pill{display:inline-flex;align-items:center;gap:6px;padding:8px 11px;border:1px solid var(--line);background:#fff;border-radius:99px;color:var(--muted);font-size:11.5px}
    .sync-dot{width:7px;height:7px;border-radius:50%;background:#b7beb8}.sync-dot.online{background:#4f8b62}.sync-dot.pending{background:var(--orange)}
    .member-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--cream);font-size:12px}.member-row:last-child{border-bottom:0}
    .user-menu-wrap{position:relative;display:inline-flex;align-items:center}.user-avatar{width:38px;height:38px;border:1px solid var(--line);border-radius:50%;background:#fff;display:grid;place-items:center;padding:0;overflow:hidden;color:var(--moss);font-size:17px;font-weight:600}.user-avatar img{width:100%;height:100%;object-fit:cover;display:block}.user-menu{position:absolute;top:calc(100% + 8px);inset-inline-end:0;width:240px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:0 12px 35px #15231f22;z-index:15;display:none;text-align:start}.user-menu.open{display:block}.user-menu-name{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.user-menu-email{font-size:11px;color:var(--muted);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.user-menu-status{margin:12px 0;padding:9px 10px;border-radius:9px;background:var(--cream);font-size:11.5px;color:var(--muted)}.user-menu .btn{width:100%;margin-top:7px}

    @media(max-width:750px){
      .shell{padding:0 15px 34px}header{height:66px}.hero{padding:26px 22px}.hero h1{font-size:32px}
      .hero-side{position:static;margin-top:16px}.stats{grid-template-columns:repeat(2,1fr)}.stat{padding:12px}.stat b{font-size:18px}
      .mapwrap{height:340px}.layout{grid-template-columns:1fr;gap:22px}.sidebar{grid-template-columns:1fr}
      .section-head p{display:none}.stop{cursor:default}.handle{display:none}
      .stop{grid-template-columns:auto 1fr auto}.travel{margin-inline-start:12px}
      .btn,.icon-btn{padding:11px 13px}
      html[dir="rtl"] body{direction:rtl} html[dir="rtl"] .head-tools{direction:rtl} html[dir="rtl"] .section-head,html[dir="rtl"] .daytop,html[dir="rtl"] .wx-row,html[dir="rtl"] .dest-meta,html[dir="rtl"] .dest-actions{direction:rtl} html[dir="rtl"] .modal-box,html[dir="rtl"] input,html[dir="rtl"] textarea,html[dir="rtl"] select{direction:rtl} html[dir="rtl"] .modal-actions{justify-content:flex-start}
    }
    @media(max-width:420px){.hero h1{font-size:28px}}
    @media print{
      .stop-edit,.transit-btn,.edit-stop{display:none!important}
      .map-resizer{display:none!important}
      .map-toolbar,.fab,.filters,.day-tools,.stop-tools,.head-tools,.section-head .btn,#backHomeBtn,.add,.chips,.transit-toggle{display:none!important}
      .hero-swap,.hero-side,.thumb-wrap,.dest-swap,.sync-pill,.user-menu-wrap{display:none!important}
      .map-label,.day-legend,.mode-switch{display:none!important}
      :root{ --ink:#15231f!important; --muted:#6a746e!important; --paper:#f6f4ef!important; --cream:#ebe8df!important; --line:#dcdcd2!important }
      body{background:#fff!important;color:#000!important}
      .shell{max-width:none!important;padding:0 16px!important}
      .hero{background:none!important;min-height:auto!important;padding:0 0 8px!important;border-radius:0!important}
      .hero h1{text-shadow:none!important;color:var(--ink)!important;font-size:24px!important;margin:4px 0!important}
      .hero p,.hero .eyebrow{text-shadow:none!important;color:var(--muted)!important;opacity:1!important}
      .stats{margin:12px 0 16px!important}
      .mapwrap{width:100%!important;height:280px!important}
      .map{width:100%!important}
      .layout{grid-template-columns:1fr!important}
      .sidebar{display:none!important}
      .days{column-count:2;column-gap:24px}
      .stop-main{gap:8px!important}
      .stop-thumb{width:44px!important;height:44px!important;flex:0 0 44px!important}
      .hero,.stats,.mapwrap{break-inside:avoid;page-break-inside:avoid}
      .day{break-inside:avoid;page-break-inside:avoid;margin-bottom:10px}
      .stop{break-inside:avoid;page-break-inside:avoid}
    }

    /* ---------- Night mode ---------- */
    :root[data-theme="dark"]{
      --ink:#e9ece9; --muted:#93a098; --paper:#12201b; --cream:#1c2925; --line:#2b3a34; --moss:#4c8a71;
    }
    [data-theme="dark"] .btn.light,[data-theme="dark"] .sort-toggle .sort-btn.active,[data-theme="dark"] .dest-card,
    [data-theme="dark"] .days-step-btn,[data-theme="dark"] .map-toolbar button,[data-theme="dark"] .day,
    [data-theme="dark"] .icon-btn,[data-theme="dark"] .thumb-swap,[data-theme="dark"] .stop-edit input,
    [data-theme="dark"] .stop-edit textarea,[data-theme="dark"] .stop-tools select,[data-theme="dark"] .card,
    [data-theme="dark"] .filter,[data-theme="dark"] .modal input,[data-theme="dark"] .modal select,
    [data-theme="dark"] .wheel-step,[data-theme="dark"] .wheel,[data-theme="dark"] .suggest,
    [data-theme="dark"] .idea-card .idea-edit input,[data-theme="dark"] .idea-card .idea-edit textarea,
    [data-theme="dark"] .idea-card select,[data-theme="dark"] .add-idea-btn.ghost,[data-theme="dark"] .day-chip,
    [data-theme="dark"] .sync-pill,[data-theme="dark"] .user-avatar,[data-theme="dark"] .user-menu,
    [data-theme="dark"] .sort-toggle,[data-theme="dark"] .chip,[data-theme="dark"] .map-search input,
    [data-theme="dark"] .mode-switch{ background:#1a2622; }
    [data-theme="dark"] .stop-edit{ background:#152019; }
    [data-theme="dark"] .stop-thumb-empty,[data-theme="dark"] .tag{ background:#22322c; color:#a9b3ac; }
    [data-theme="dark"] .chip{ color:#bcd6c6; border-color:#33513f; }
    [data-theme="dark"] .handle{ color:#5c6b63; }
    [data-theme="dark"] .add{ border-color:#3a4a43; }
    [data-theme="dark"] .stop .stop-note{ color:#a7b3ac; }
    [data-theme="dark"] .sync-dot{ background:#3a4a43; }
    [data-theme="dark"] .mapwrap,[data-theme="dark"] .dest-card-media.no-image{ background:linear-gradient(135deg,#22322c,#1a2622); }
    [data-theme="dark"] .map-label{ background:#1a2622ee; }
    [data-theme="dark"] .wheel-fade{ background:linear-gradient(#1a2622 0%,#1a262200 34%,#1a262200 66%,#1a2622 100%); }
    [data-theme="dark"] .empty-state{ border-color:#3a4a43; }
    [data-theme="dark"] input[type="date"]{ color-scheme:dark; }
    [data-theme="dark"] .idea-card .ok{ color:#7fce9c; } [data-theme="dark"] .idea-card .no{ color:#e2673f; }
    [data-theme="dark"] .idea-card .sum,[data-theme="dark"] .idea-card .hours{ color:var(--muted); }
    [data-theme="dark"] .gm-style-iw-c{ background:#1a2622!important; }
    [data-theme="dark"] .gm-style-iw-d{ background:transparent!important; }
    [data-theme="dark"] .gm-style-iw-t::after,[data-theme="dark"] .gm-style-iw-tc::after{ background:#1a2622!important; box-shadow:none!important; }
    [data-theme="dark"] .gm-ui-hover-effect{ filter:invert(1); opacity:.8; }
    /* .btn's fill normally tracks --ink, which flips to a near-white tone at
       night — leaving white text on a white button. Give it its own fixed dark
       fill instead so it stays legible without affecting .btn.light/.orange. */
    [data-theme="dark"] .btn:not(.light):not(.orange){ background:#2f3f38; color:#e9ece9; }
    [data-theme="dark"] .hint{ background:#1c2b22; color:#a9d3b4; }
    [data-theme="dark"] .warn{ background:#2c211b; color:#e2a186; }
    [data-theme="dark"] .wheel-band{ background:#22322c; border-color:#3a4a43; }
    [data-theme="dark"] .day-chip.active{ color:var(--ink); }
    [data-theme="dark"] .city-chip{ background:#1a2622; }
    [data-theme="dark"] .city-add-input{ background:#1a2622; color:var(--ink); }
    [data-theme="dark"] .stop-hours{ color:#ff9169; }
    [data-theme="dark"] .stop-hours.closed{ color:#8a978f; }
    /* Photos (place thumbnails, POI cards, city covers) read as too bright and
       edge-less against the dark palette at night. A colour filter made them
       look off compared to daytime, so give them a quiet border instead and
       leave the photo itself untouched. */
    [data-theme="dark"] .stop-thumb,[data-theme="dark"] .idea-card img,
    [data-theme="dark"] .dest-card-media,[data-theme="dark"] .search-place-result img{
      box-shadow:0 0 0 1px #3a4a43 inset;
    }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div class="brand">roam<span>.</span></div>
      <div class="head-tools">
        <button class="btn light" id="exportBtn"></button>
        <button class="btn light" id="importFileBtn"></button>

            <div class="user-menu-status" id="userMenuStatus"></div>
            <button class="btn light" id="userMenuAction" type="button"></button>
          </div>
        </div>
      </div>
    </header>

    <section id="homeView">
      <section class="hero">
        <div class="eyebrow" data-i18n="home.eyebrow"></div>
        <h1 data-i18n="home.title"></h1>
        <p data-i18n="home.sub"></p>
        <div class="hero-side"><button class="btn light" id="worldMapBtn" data-i18n="home.mapView"></button><button class="btn orange" id="newTripHeroBtn" data-i18n="home.new"></button></div>
      </section>
      <div class="section-head" style="margin-top:32px">
        <div><h2 data-i18n="home.listTitle"></h2><p data-i18n="home.listSub"></p></div>
        <div class="sort-toggle" id="sortToggle" role="group">
          <button type="button" class="sort-btn" data-sort="date" data-i18n="sort.date"></button>
          <button type="button" class="sort-btn" data-sort="az" data-i18n="sort.az"></button>
        </div>
      </div>
      <div class="destinations" id="destinations"></div>
    </section>

    <section id="worldMapView" style="display:none">
      <button class="btn light" id="backHomeFromWorldBtn" style="margin-bottom:18px" data-i18n="trip.back"></button>

    </section>

    <section id="tripView" style="display:none">

        <h1 id="tripName"></h1>
        <p data-i18n="trip.heroSub"></p>
        <button type="button" class="hero-swap" id="tripHeroSwapBtn" data-i18n="image.swap" onclick="swapCityImage()"></button>
        <div class="hero-side">
          <label class="datefield"><span data-i18n="trip.start"></span><input type="date" id="tripStart"></label>
          <button class="btn light" id="shareBtn" data-i18n="trip.share"></button>

      <div class="stats">

        <div class="stat"><b id="statDays">1</b><span data-i18n="stat.days"></span></div>
        <div class="stat"><b id="statTime">—</b><span id="statTimeLabel" data-i18n="stat.time"></span></div>
        <div class="stat"><b id="statDistance">—</b><span id="statDistanceLabel" data-i18n="stat.distance"></span></div>
      </div>
      <div class="section-head">
        <div><h2 data-i18n="map.title"></h2><p data-i18n="map.sub"></p></div>
        <div class="filters">
          <button class="filter active" data-filter="all" data-i18n="filter.all"></button>
          <button class="filter" data-filter="sight" data-i18n="filter.sight"></button>
          <button class="filter" data-filter="food" data-i18n="filter.food"></button>

  <div class="modal" id="modal"><div class="modal-box">

    <div class="mini-form"><input id="placeSearch" data-i18n-ph="add.searchPh"><button class="btn" id="searchBtn" data-i18n="add.search"></button></div>
    <div id="searchResults"></div>
    <div class="hint" data-i18n="add.hint"></div>
    <div class="modal-actions"><button class="btn light" id="closeBtn" data-i18n="close"></button></div>
  </div></div>

  <script>
  /* ============================================================
     CONFIG — the only place with keys/endpoints.
     Two supported setups:
     1) Direct (quick): put a BROWSER key in googleKey and restrict it in
        Google Cloud Console: Application restrictions → HTTP referrers →
        your domain only; API restrictions → Maps JavaScript API + Places API
        only; then set a daily quota cap on both APIs.
     2) Proxy (recommended for production): deploy a tiny server that holds the
        key and forwards /places/* to Google, then set proxyBase below and leave
        googleKey empty for the REST calls. The Maps JS script still needs a
        referrer-restricted browser key — that one is public by design.
     ============================================================ */
  // Reminder: this key is public by design (it ships in the browser), so it
  // is only safe as long as it's locked down in the Google Cloud console —
  // HTTP referrer restriction to this site's domain(s) + a daily quota cap.
  // Same idea for FIREBASE_CONFIG below: protect it with Firestore security
  // rules, not by trying to hide the key.

      { elementType:'labels.text.stroke', stylers:[{ color:'#1a2622' }] },
      { elementType:'labels.text.fill', stylers:[{ color:'#8f9c95' }] },
      { featureType:'administrative', elementType:'geometry', stylers:[{ color:'#2b3a34' }] },
      { featureType:'poi', elementType:'geometry', stylers:[{ color:'#22322c' }] },
      { featureType:'poi.park', elementType:'geometry', stylers:[{ color:'#213028' }] },
      { featureType:'road', elementType:'geometry', stylers:[{ color:'#2b3a34' }] },
      { featureType:'road', elementType:'geometry.stroke', stylers:[{ color:'#1a2622' }] },
      { featureType:'road.highway', elementType:'geometry', stylers:[{ color:'#33453e' }] },
      { featureType:'transit', elementType:'geometry', stylers:[{ color:'#22322c' }] },
      { featureType:'water', elementType:'geometry', stylers:[{ color:'#12201b' }] }
    ];
    function applyMapTheme(){
      const styles = theme === 'dark' ? MAP_DARK_STYLE : [];
      if(freeMap) freeMap.setOptions({ styles });
      if(worldMap) worldMap.setOptions({ styles });
    }

    /* ---------- Image lookup throttling ---------- */
    // Commons/Wikipedia respond with 429 (Too Many Requests) once too many
    // lookups fire close together — easy to trigger since a trip can have
    // many places without an image. Only one lookup runs at a time, and
    // wikiFetch below also enforces a minimum gap between the individual
    // HTTP requests inside a lookup (a single lookup can issue several).
    const MAX_CONCURRENT_IMAGE_LOOKUPS = 1;
    const IMAGE_RETRY_COOLDOWN = 5*60*1000; // don't hammer the same failed place/city more than once per 5 min
    let activeImageLookups = 0;
    const imageLookupQueue = [];
    // Guards keyed by trip id, not by a property on the trip object itself.
    // The `trips` array gets swapped for fresh objects on every cloud sync
    // merge, so a flag like `trip.cityImageLoading` living on one object
    // instance doesn't reliably stop a *different* (freshly-synced) object
    // for the same trip id from starting a duplicate, concurrent lookup.
    // That was producing a growing pile-up of redundant Commons searches —
    // this Set survives the object churn because it's keyed by id.
    const cityImageLookupsInFlight = new Set();
    const cityMetaLookupsInFlight = new Set();
    function queueImageLookup(fn, priority=false){
      return new Promise((resolve,reject)=>{
        const job=()=>fn().then(resolve,reject);
        // Manual "try another photo" clicks are user-initiated, in-the-moment
        // actions — they shouldn't sit behind a big backlog of background
        // auto-fill lookups for places/cities the user isn't even looking at.
        // Priority jobs go to the front of the line instead of the back.
        if(priority) imageLookupQueue.unshift(job); else imageLookupQueue.push(job);
        pumpImageLookupQueue();
      });
    }
    function pumpImageLookupQueue(){
      while(activeImageLookups < MAX_CONCURRENT_IMAGE_LOOKUPS && imageLookupQueue.length){
        const job = imageLookupQueue.shift();
        activeImageLookups++;
        job().finally(()=>{ activeImageLookups--; pumpImageLookupQueue(); });
      }
    }
    // Every fetch to commons.wikimedia.org / en.wikipedia.org goes through
    // here: enforces a minimum gap between requests, and if the server
    // answers 429 it backs off for several seconds before the next one
    // instead of continuing to hammer it (which just prolongs the 429s).
    const WIKI_MIN_GAP = 1200;
    let wikiLastRequestAt = 0;
    let wikiCooldownUntil = 0;
    async function wikiFetch(url){
      const wait = Math.max(0, wikiCooldownUntil-Date.now(), wikiLastRequestAt+WIKI_MIN_GAP-Date.now());
      if(wait>0) await new Promise(r=>setTimeout(r,wait));
      wikiLastRequestAt=Date.now();
      const res = await fetch(url);
      if(res.status===429) wikiCooldownUntil=Date.now()+15000;
      return res;
    }

    function esc(v){ return String(v==null?'':v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])) }
    function currentTrip(){ return trips.find(x=>x.id===currentTripId) }
    function saveTrips(){
      if(currentTripId){ const tr = currentTrip(); if(tr) tr.updatedAt = Date.now() }
      try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(trips)) }catch(e){ console.info('save failed', e) }
      if(!suppressCloudSave){ queueCloudTripSave(); queueUserTripsSave(); }
    }
    function sharedTrip(){ const t=currentTrip(); return t && t.sharedId ? t : null }
    function queueCloudTripSave(){
      const trip = sharedTrip();
      if(!firebaseReady || !firebaseUser || !firestore || !trip || trip.sharedRole === 'viewer' || suppressCloudSave) return;
      clearTimeout(cloudSaveTimer);
      cloudSaveTimer=setTimeout(()=>saveSharedTrip(trip),350);
    }
    async function saveSharedTrip(trip){
      if(!firebaseReady || !firebaseUser || !firestore || !trip?.sharedId || trip.sharedRole === 'viewer' || suppressCloudSave) return;
      try{
        await firestore.setDoc(firestore.doc(firestore.db,'sharedTrips',trip.sharedId), {
          name:trip.name, cityNameHe:trip.cityNameHe||'', cityNameEn:trip.cityNameEn||'', cityImage:trip.cityImage||'', startDate:trip.startDate||'', note:trip.note||'', places:trip.places||{}, 
          schedule: prepareScheduleForCloud(trip.schedule), center:trip.center||null, viewport:trip.viewport||null, cityLabel:trip.cityLabel||'', cities:trip.cities||[], packing:trip.packing||[], travelMode:trip.travelMode||'foot', updatedAt:firestore.serverTimestamp(), updatedBy:firebaseUser.uid
        }, {merge:true});
        setSyncState('synced');
      }catch(e){ console.info('cloud save queued/failed',e); setSyncState(navigator.onLine?'pending':'offline') }
    }
    /* ---------- Account-wide sync (all trips, across devices on the same login) ---------- */
    let userSaveTimer=null, userTripsUnsub=null;
    // Deletions need a tombstone. Without one, device B can re-upload its old
    // copy after device A deletes a trip, effectively bringing the trip back.
    let deletedTripIds = {};
    function loadDeletedTripIds(){
      try{ deletedTripIds = JSON.parse(localStorage.getItem('roam-deleted-trips-v1')||'{}') || {}; }catch(e){ deletedTripIds={}; }
    }
    function saveDeletedTripIds(){
      try{ localStorage.setItem('roam-deleted-trips-v1', JSON.stringify(deletedTripIds)); }catch(e){}
    }
    function markTripDeleted(id){ deletedTripIds[id]=Date.now(); saveDeletedTripIds(); }
    function clearTripDeleted(id){ if(deletedTripIds[id]){ delete deletedTripIds[id]; saveDeletedTripIds(); } }
    function filterDeletedTrips(list, cloudDeleted={}){
      const mergedDeleted={...cloudDeleted,...deletedTripIds};
      return list.filter(tr=>!mergedDeleted[tr.id]);
    }
    function queueUserTripsSave(){
      if(!firebaseReady || !firebaseUser || !firestore || suppressCloudSave) return;
      clearTimeout(userSaveTimer);
      userSaveTimer=setTimeout(saveUserTrips, 500);
    }
    async function saveUserTrips(){
      if(!firebaseReady || !firebaseUser || !firestore || suppressCloudSave) return;
      try{
        const ref=firestore.doc(firestore.db,'users',firebaseUser.uid);
        const localSnapshot=trips.map(normaliseTrip);
        const localDeleted={...deletedTripIds};
        let merged=[];
        let finalDeleted={...localDeleted};
        await firestore.runTransaction(firestore.db, async tx=>{
          const snap=await tx.get(ref);
          const data=snap.exists() ? snap.data() : {};
          const cloudTrips=(data.trips||[]).map(normaliseTrip);
          const cloudDeleted=data.deletedTripIds||{};
          finalDeleted={...cloudDeleted,...localDeleted};
          merged=mergeTripLists(filterDeletedTrips(localSnapshot,finalDeleted),filterDeletedTrips(cloudTrips,finalDeleted));
          const safeTrips=merged.map(t=>({...t,schedule:prepareScheduleForCloud(t.schedule)}));
          tx.set(ref,{trips:safeTrips,deletedTripIds:finalDeleted,updatedAt:firestore.serverTimestamp()},{merge:true});
        });
        trips=merged;
        deletedTripIds=finalDeleted;
        saveDeletedTripIds();
        suppressCloudSave=true;
        try{ localStorage.setItem(STORAGE_KEY,JSON.stringify(merged)) }catch(e){}
        suppressCloudSave=false;
        setSyncState('synced');
        refreshOpenTripUI();
      }catch(e){
        console.info('account sync save failed',e);
        setSyncState(navigator.onLine?'pending':'offline');
      }
    }
    function mergeTripLists(localList, cloudList){
      const map=new Map();
      localList.forEach(tr=> map.set(tr.id, tr));
      cloudList.forEach(tr=>{
        const existing=map.get(tr.id);
        if(!existing || (tr.updatedAt||0) >= (existing.updatedAt||0)) map.set(tr.id, tr);
      });
      return Array.from(map.values());
    }
    // Every background cloud-sync echo used to call render()/redrawMap()
    // unconditionally, even when the echo carried no actual change for the
    // trip currently open — that's what was causing the map markers (and
    // the rest of the trip view) to visibly flicker every few seconds while
    // sync was quietly running. This compares a snapshot of what actually
    // affects the trip view/map before doing the (expensive, visible) full
    // re-render, and skips it when nothing really changed.
    let lastRenderedTripKey = null;
    // Plain JSON.stringify is sensitive to object key order, so two objects
    // with identical content but keys inserted in a different order (e.g.
    // one rebuilt fresh from a cloud snapshot) produced different strings —
    // that false "changed" reading is what caused the constant flicker.
    // Sorting keys recursively before stringifying makes the comparison
    // depend only on actual content.
    function stableStringify(value){
      if(Array.isArray(value)) return '['+value.map(stableStringify).join(',')+']';
      if(value && typeof value==='object'){
        return '{'+Object.keys(value).sort().map(k=>JSON.stringify(k)+':'+stableStringify(value[k])).join(',')+'}';
      }
      return JSON.stringify(value);
    }
    function tripRenderKey(tr){
      return stableStringify({
        places:tr.places, schedule:tr.schedule, cityImage:tr.cityImage,
        cityNameHe:tr.cityNameHe, cityNameEn:tr.cityNameEn, travelMode:tr.travelMode,
        startDate:tr.startDate, note:tr.note, packing:tr.packing
      });
    }
    function renderOpenTripIfChanged(tr){
      const key = tripRenderKey(tr);
      if(key === lastRenderedTripKey) return false;
      lastRenderedTripKey = key;
      renderTripHeader(); render(); renderPacking();
      return true;
    }
    function refreshOpenTripUI(){
      renderHome();
      if(!currentTripId) return;
      const tr=currentTrip();
      if(!tr){ backToHome(); return }
      places=tr.places; schedule=tr.schedule;
      renderOpenTripIfChanged(tr);
      document.getElementById('tripStart').value=tr.startDate||'';
      document.getElementById('tripNote').value=tr.note||'';
    }
    async function syncAccountTrips(){
      if(!firebaseReady || !firebaseUser || !firestore) return;
      try{
        const ref=firestore.doc(firestore.db,'users',firebaseUser.uid);
        const snap=await firestore.getDoc(ref);
        if(snap.exists()){
          const data=snap.data();
          const cloudDeleted=data.deletedTripIds||{};
          deletedTripIds={...cloudDeleted,...deletedTripIds};
          saveDeletedTripIds();
          const cloudTrips=(data.trips||[]).map(normaliseTrip);
          trips=mergeTripLists(
            filterDeletedTrips(trips.map(normaliseTrip), deletedTripIds),
            filterDeletedTrips(cloudTrips, deletedTripIds)
          );
        }
        suppressCloudSave=true;
        try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(trips)) }catch(e){}
        suppressCloudSave=false;
        refreshOpenTripUI();
        queueUserTripsSave();
      }catch(e){ console.info('account sync failed', e) }
      subscribeAccountTrips();
    }
    function subscribeAccountTrips(){
      if(!firebaseReady || !firebaseUser || !firestore) return;
      if(userTripsUnsub) userTripsUnsub();
      const ref=firestore.doc(firestore.db,'users',firebaseUser.uid);
      userTripsUnsub=firestore.onSnapshot(ref,(snap)=>{
        if(!snap.exists()) return;
        const active=document.activeElement;
        const typing=active && (active.id==='tripNote' || active.tagName==='INPUT' || active.tagName==='TEXTAREA');
        if(typing) return; // don't clobber what the user is mid-typing; the next debounced save reconciles it
        const data=snap.data();
        const cloudDeleted=data.deletedTripIds||{};
        deletedTripIds={...deletedTripIds,...cloudDeleted};
        saveDeletedTripIds();
        const cloudTrips=(data.trips||[]).map(normaliseTrip);
        suppressCloudSave=true;
        trips=mergeTripLists(
          filterDeletedTrips(trips, deletedTripIds),
          filterDeletedTrips(cloudTrips, deletedTripIds)
        );
        try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(trips)) }catch(e){}
        suppressCloudSave=false;
        refreshOpenTripUI();
        setSyncState(snap.metadata.hasPendingWrites?'pending':'synced');
      },(err)=>{ console.info('account sync listener error', err); setSyncState(navigator.onLine?'pending':'offline') });
    }
    function unsubscribeAccountTrips(){ if(userTripsUnsub){ userTripsUnsub(); userTripsUnsub=null } }

    function setSyncState(mode){
      // Sync status is intentionally kept out of the main header.
      // It is shown only inside the account menu.
      const label=document.getElementById('userMenuStatus');
      if(!label) return;
      if(!firebaseUser){ label.textContent=t('auth.profileLocal'); return; }
      label.textContent = mode==='offline' ? t('share.offline') : mode==='pending' ? t('share.syncing') : t('auth.profileSynced');
    }
    function toast(msg){ const el = document.getElementById('toast'); el.textContent = msg; el.classList.add('show'); clearTimeout(el._t); el._t = setTimeout(()=>el.classList.remove('show'), 2600) }

    function prepareScheduleForCloud(schedule) {
      return (schedule || []).map(d => ({
        date: d.date || '',
        loop: !!d.loop,
        travelMode: d.travelMode==='driving' ? 'driving' : d.travelMode==='foot' ? 'foot' : null,
        transitLegs: Array.isArray(d.transitLegs) ? d.transitLegs.filter(n=>Number.isInteger(n)) : [],
        stops: (d.stops || []).map(s => ({ p: s[0], n: s[1] || '' }))
      }));
    }

    function normaliseTrip(trip){
      // Firestore returns Timestamp objects for server timestamps. Convert them
      // to milliseconds so local/cloud version comparison actually works.
      if(trip && trip.updatedAt && typeof trip.updatedAt.toMillis === 'function') trip.updatedAt = trip.updatedAt.toMillis();
      else if(trip && typeof trip.updatedAt === 'string'){
        const n=Date.parse(trip.updatedAt); if(Number.isFinite(n)) trip.updatedAt=n;
      }
      trip.places = trip.places || {};
      // Extra cities beyond the trip's primary city (cityNameHe/En/center/etc,
      // unchanged), used for the map's "focus this city" picker on multi-city
      // trips. Each entry: { label, nameHe, nameEn, center:[lat,lng], viewport }.
      if(!Array.isArray(trip.cities)) trip.cities = [];
      trip.cities = trip.cities.filter(c=>c && c.center).map(c=>({
        label:c.label||c.nameEn||c.nameHe||'', nameHe:c.nameHe||'', nameEn:c.nameEn||'',
        center:c.center, viewport:c.viewport||null
      }));
      trip.schedule = (trip.schedule||[]).map(d=>({
        date:d.date||'',
        loop: !!d.loop,
        travelMode: d.travelMode==='driving' ? 'driving' : d.travelMode==='foot' ? 'foot' : null,
        transitLegs: Array.isArray(d.transitLegs) ? d.transitLegs.filter(n=>Number.isInteger(n)) : [],
        stops:(d.stops||[]).map(s => {
          if (Array.isArray(s)) return s;
          // המרה חזרה לאופן שבו האפליקציה מצפה לזה
          if (s && typeof s === 'object' && s.p) return [s.p, s.n || ''];
          return [s, ''];
        })
      }));
      if(!trip.schedule.length) trip.schedule.push({ date:'', stops:[] });
      if(!Array.isArray(trip.packing)) trip.packing = [1,2,3].map(i=>({ text:t('pack.d'+i), done:false }));
      if(typeof trip.note !== 'string') trip.note = '';
      if(!trip.travelMode) trip.travelMode = 'foot';
      if(!trip.startDate) trip.startDate = '';
      if(!trip.updatedAt) trip.updatedAt = Date.now();
      // These are runtime-only "fetch in progress" flags. If a tab was closed
      // (or the app reloaded) mid-fetch, a stray `true` could get saved to
      // storage and then permanently block every future attempt, since the
      // enrich functions treat "loading" as "already being handled". Clear
      // them on load so a genuinely stuck city/place always gets retried.
      trip.cityImageLoading = false;
      Object.values(trip.places||{}).forEach(p=>{ if(p){ p.imageLoading=false; p.namesLoading=false; } });
      return trip;
    }
    function loadTrips(){
      let raw = localStorage.getItem(STORAGE_KEY) || localStorage.getItem('roam-trips-v1') || '[]';
      try { trips = JSON.parse(raw) } catch(e){ trips = [] }
      trips.forEach(normaliseTrip);
      // A stuck imageLoading:true saved before this fix would otherwise make
      // the swap button a permanent no-op for that place/trip forever.
      trips.forEach(tr=>{
        tr.cityImageLoading=false;
        Object.values(tr.places||{}).forEach(p=>{ if(p) p.imageLoading=false; });
      });
    }

    /* ---------- Dates ---------- */
    function dayDate(i){
      const trip = currentTrip();
      if(!trip || !trip.startDate) return '';
      const d = new Date(trip.startDate + 'T00:00:00');
      if(isNaN(d)) return '';
      d.setDate(d.getDate() + i);
      return d.toLocaleDateString(locale(), { weekday:'short', day:'numeric', month:'short' });
    }
    function dateForDay(i){
      const trip = currentTrip();
      if(!trip || !trip.startDate) return null;
      const d = new Date(trip.startDate + 'T00:00:00');
      if(isNaN(d)) return null;
      d.setDate(d.getDate() + i);
      return d;
    }
    // weekdayDescriptions comes back as seven localized "Day: hours" lines, but
    // Google doesn't document a fixed starting weekday for them — so instead of
    // assuming an index order, match each line by its own leading day name.
    function hoursLineForDate(weekdayDescriptions, dateObj){
      if(!weekdayDescriptions || !weekdayDescriptions.length || !dateObj) return '';
      const ref = new Date(Date.UTC(2023, 0, 1 + dateObj.getDay())); // 2023-01-01 was a Sunday
      const long = ref.toLocaleDateString(langCode(), { weekday:'long' }).toLowerCase();
      const short = ref.toLocaleDateString(langCode(), { weekday:'short' }).toLowerCase().replace(/\.$/, '');
      const hit = weekdayDescriptions.find(s=>{
        const head = (s.split(':')[0] || '').trim().toLowerCase();
        return head === long || head === short || head.includes(long) || long.includes(head) || head.includes(short);
      });
      if(!hit) return '';
      const ci = hit.indexOf(':');
      return (ci >= 0 ? hit.slice(ci + 1) : hit).trim();
    }
    function isoForDay(i, startDate){
      if(!startDate) return null;
      const d = new Date(startDate + 'T00:00:00');
      if(isNaN(d)) return null;
      d.setDate(d.getDate() + i);
      return d.toISOString().slice(0,10);
    }

    /* ---------- Places API (direct or via proxy) ---------- */
    // Cost-safe mode: Google Places is used for text/location search only; photo fields are not requested.
    function placesUrl(path){ return CONFIG.proxyBase ? CONFIG.proxyBase.replace(/\/$/,'') + '/places/' + path : 'https://places.googleapis.com/v1/places' + (path.startsWith(':') ? path : '/' + path) }
    function placesHeaders(mask){
      const h = { 'Content-Type':'application/json', 'X-Goog-FieldMask':mask };
      if(!CONFIG.proxyBase && CONFIG.googleKey) h['X-Goog-Api-Key'] = CONFIG.googleKey;
      return h;
    }
    function googleAvailable(){ return !!(CONFIG.proxyBase || CONFIG.googleKey) }
    function langCode(){ return lang === 'he' ? 'he' : 'en' }

    async function googleTextSearch(query, bias){
      if(!googleAvailable()) throw new Error('no key');
      const body = { textQuery:query, languageCode:langCode() };
      if(bias) body.locationBias = { circle:{ center:{ latitude:bias[0], longitude:bias[1] }, radius:30000 } };
      const res = await fetch(placesUrl(':searchText'), { method:'POST', headers:placesHeaders('places.id,places.displayName,places.location,places.formattedAddress,places.primaryType,places.viewport'), body:JSON.stringify(body) });
      if(!res.ok) throw new Error('searchText ' + res.status);
      return (await res.json()).places || [];
    }
    async function googleTextSearchLang(query, language, bias){
      if(!googleAvailable()) throw new Error('no key');
      const body = { textQuery:query, languageCode:language };
      if(bias) body.locationBias = { circle:{ center:{ latitude:bias[0], longitude:bias[1] }, radius:30000 } };
      const res = await fetch(placesUrl(':searchText'), { method:'POST', headers:placesHeaders('places.id,places.displayName,places.location,places.formattedAddress,places.primaryType,places.viewport'), body:JSON.stringify(body) });
      if(!res.ok) throw new Error('searchText ' + res.status);
      return (await res.json()).places || [];
    }
    // Google Place Photos are intentionally disabled.
    // Images come from Wikimedia Commons instead, so adding a place does not
    // trigger a Google photo request. We keep the image URL + attribution
    // with the place so it can be shown again inside the itinerary.
    function photoUrl(){ return ''; }

    function imageLoads(url){
      return new Promise(resolve=>{
        if(!url){ resolve(false); return; }
        const img = new Image();
        let done=false;
        const finish = ok => { if(done) return; done=true; resolve(ok); };
        img.onload = ()=>finish(true);
        img.onerror = ()=>finish(false);
        img.src = url;
        setTimeout(()=>finish(false), 6000);
      });
    }
    async function wikipediaFallbackImage(query, exclude){
      try{
        const api='https://en.wikipedia.org/w/api.php';
        const params={action:'query',format:'json',origin:'*',generator:'search',gsrsearch:query,gsrlimit:3,prop:'pageimages|info',piprop:'original',inprop:'url'};
        const data=await wikiFetch(api+'?'+new URLSearchParams(params).toString()).then(r=>r.json());
        for(const page of Object.values(data.query?.pages||{})){
          const src=page.original?.source;
          if(!src) continue;
          const pageUrl=page.fullurl||('https://en.wikipedia.org/wiki/'+encodeURIComponent(page.title||''));
          if(exclude && exclude.has(pageUrl)) continue;
          if(!(await imageLoads(src))) continue;
          return { url:src, pageUrl, author:'', license:'', licenseUrl:'' };
        }
      }catch(e){}
      return null;
    }
    async function wikimediaImage(query, lat, lng, options={}){
      const cityMode=!!options.city;
      const exclude=options.exclude||null;
      const imgWidth = cityMode ? 1800 : 1000;
      const clean=v=>{ const x=v?.value; return typeof x==='string' ? x.replace(/<[^>]*>/g,' ').replace(/&[^;]+;/g,' ').replace(/\s+/g,' ').trim() : ''; };
      const api='https://commons.wikimedia.org/w/api.php';

      // Deliberately no scoring, no keyword requirements (skyline/landmark/
      // etc.), no filetype filtering: just ask Commons for this name and take
      // the first result that (a) hasn't already been shown for this place/
      // trip (via `exclude`, tracked across 🔄 clicks) and (b) actually loads.
      // Picking "the best" photo automatically was unreliable and, combined
      // with required keywords, often returned nothing at all. The manual
      // swap button is the mechanism for getting a different photo now — this
      // just needs to reliably return *a* photo.
      try{
        const base={action:'query',format:'json',origin:'*',generator:'search',gsrsearch:query,gsrnamespace:6,gsrlimit:20,prop:'imageinfo',iiprop:'url|extmetadata',iiurlwidth:imgWidth};
        const data=await wikiFetch(api+'?'+new URLSearchParams(base).toString()).then(r=>r.json());
        for(const page of Object.values(data.query?.pages||{})){
          const info=page.imageinfo?.[0]; if(!info) continue;
          const rawUrl=info.thumburl||info.url||''; if(!rawUrl) continue;
          const pageUrl=info.descriptionurl||('https://commons.wikimedia.org/wiki/'+encodeURIComponent(page.title||''));
          if(exclude && exclude.has(pageUrl)) continue;
          const url = rawUrl + (rawUrl.includes('?')?'&':'?')+'roam='+Date.now();
          if(!(await imageLoads(url))) continue;
          const meta=info.extmetadata||{};
          return {
            url,
            pageUrl,
            author:clean(meta.Artist)||clean(meta.Credit)||'',
            license:clean(meta.LicenseShortName)||'',
            licenseUrl:meta.LicenseUrl?.value||''
          };
        }
      }catch(e){ /* fall through to the Wikipedia fallback below regardless */ }

      // Commons search found nothing usable (or failed outright) — Wikipedia's
      // own lead image is a solid, almost-always-available last resort, and it
      // now always gets a chance to run instead of being skipped on any error.
      return await wikipediaFallbackImage(query, exclude);
    }

    function stopThumbHtml(id, p){
      const swapBtn = `<button type="button" class="thumb-swap" data-place="${esc(id)}" title="${esc(t('image.swap'))}" aria-label="${esc(t('image.swap'))}" onclick="event.stopPropagation(); swapPlaceImage('${esc(id)}')">🔄</button>`;
      return p.image
        ? `<div class="thumb-wrap">${swapBtn}<img class="stop-thumb" src="${esc(p.image)}" alt="" loading="lazy" title="${esc(p.imageAuthor||'Wikimedia Commons')}" onerror="this.onerror=null; this.style.display='none'; retryPlaceImage('${esc(id)}')"></div>`
        : `<div class="thumb-wrap stop-thumb stop-thumb-empty">${swapBtn}⌖</div>`;
    }
    // Updates a single stop's thumbnail in place, without rebuilding the whole
    // itinerary or the map markers/routes — avoids the flicker that a full
    // render()/redrawMap() would cause every time one place's image arrives.
    function updateStopThumb(id){
      const p = places[id]; if(!p) return;
      document.querySelectorAll(`.stop[data-place="${id}"] .stop-main`).forEach(el=>{
        el.querySelector(':scope > div:first-child, :scope > .stop-thumb-empty')?.remove();
        el.insertAdjacentHTML('afterbegin', stopThumbHtml(id, p));
      });
    }
    async function enrichPlaceImage(id, place, force=false, excludePages=null){
      if(!place || place.imageLoading || (!force && place.image)) return;
      if(!force && place.imageFailedAt && Date.now()-place.imageFailedAt < IMAGE_RETRY_COOLDOWN) return;
      place.imageLoading=true;
      let image=null;
      try{
        const tr=currentTrip();
        const cityHint=tr?.cityNameEn||tr?.cityLabel||tr?.name||'';
        const imageQuery=[place.nameEn||place.name,cityHint].filter(Boolean).join(' ');
        image=await queueImageLookup(()=>wikimediaImage(imageQuery, place.lat, place.lng, {city:false, exclude:excludePages}), force);
      }catch(e){ image=null; }
      finally{ place.imageLoading=false; }
      if(image?.url){
        place.image=image.url;
        place.imagePage=image.pageUrl||'';
        place.imageAuthor=image.author||'';
        place.imageLicense=image.license||'';
        place.imageLicenseUrl=image.licenseUrl||'';
        delete place.imageFailedAt;
        if(image.pageUrl){
          place.imageTriedPages=place.imageTriedPages||[];
          if(!place.imageTriedPages.includes(image.pageUrl)) place.imageTriedPages.push(image.pageUrl);
        }
        persist();
        if(currentTrip()) updateStopThumb(id);
      } else {
        place.imageFailedAt=Date.now();
        if(currentTrip()) updateStopThumb(id);
      }
    }

    // Manual "try another photo" button: remembers every photo already shown
    // for this place so it never repeats one, and only searches on request —
    // the automatic side stays cheap (one query) and this covers the rest.
    async function swapPlaceImage(id){
      const p=places[id]; if(!p || p.imageLoading) return;
      p.imageTriedPages=p.imageTriedPages||[];
      if(p.imagePage && !p.imageTriedPages.includes(p.imagePage)) p.imageTriedPages.push(p.imagePage);
      p.image=''; p.imagePage=''; p.imageAuthor=''; p.imageLicense=''; p.imageLicenseUrl=''; delete p.imageFailedAt;
      updateStopThumb(id);
      await enrichPlaceImage(id, p, true, new Set(p.imageTriedPages));
    }

    async function enrichCityImage(tripRef, force=false, excludePages=null){
      if(!tripRef) return;
      const id = tripRef.id;
      if(cityImageLookupsInFlight.has(id)) return;
      if(!force && tripRef.cityImage) return;
      if(!force && tripRef.cityImageFailedAt && Date.now()-tripRef.cityImageFailedAt < IMAGE_RETRY_COOLDOWN) return;
      cityImageLookupsInFlight.add(id);
      tripRef.cityImageLoading=true; // best-effort, for any UI reading it off this instance directly
      let image=null;
      try{
        image=await queueImageLookup(()=>wikimediaImage(tripRef.cityNameEn||tripRef.name, tripRef.center?.[0], tripRef.center?.[1], {city:true, exclude:excludePages}), force);
      }catch(e){ image=null; }
      finally{ cityImageLookupsInFlight.delete(id); }
      // The `trips` array can be swapped out from under us while the lookup
      // above was in flight (a cloud sync merge replaces trip objects with
      // freshly-decoded ones, even on a tie). Re-resolve the *current* trip
      // object by id and write the result there — writing to the stale
      // `tripRef` we started with would silently vanish, since nothing in
      // the UI reads from it anymore.
      const trip = trips.find(x=>x.id===id);
      tripRef.cityImageLoading=false;
      if(!trip) return; // trip was deleted while the lookup was running
      trip.cityImageLoading=false;
      if(image?.url){
        trip.cityImage=image.url;
        trip.cityImagePage=image.pageUrl||'';
        trip.cityImageAuthor=image.author||'';
        trip.cityImageLicense=image.license||'';
        trip.cityImageLicenseUrl=image.licenseUrl||'';
        trip.updatedAt=Date.now();
        delete trip.cityImageFailedAt;
        if(image.pageUrl){
          trip.cityImageTriedPages=trip.cityImageTriedPages||[];
          if(!trip.cityImageTriedPages.includes(image.pageUrl)) trip.cityImageTriedPages.push(image.pageUrl);
        }
        saveTrips();
        if(currentTripId===trip.id) renderTripHeader();
        renderHome();
      } else {
        trip.cityImageFailedAt=Date.now();
        if(currentTripId===trip.id) renderTripHeader();
        renderHome();
      }
    }

    async function swapCityImageForTrip(id){
      const trip=trips.find(x=>x.id===id); if(!trip || cityImageLookupsInFlight.has(id)) return;
      trip.cityImageTriedPages=trip.cityImageTriedPages||[];
      if(trip.cityImagePage && !trip.cityImageTriedPages.includes(trip.cityImagePage)) trip.cityImageTriedPages.push(trip.cityImagePage);
      // Don't clear the current image before searching — keep it showing
      // (avoids a flash to blank/default) and only replace it once a new
      // one is actually found; enrichCityImage(force=true) already bypasses
      // the "already have an image" early-return, so this works untouched.
      await enrichCityImage(trip, true, new Set(trip.cityImageTriedPages));
    }
    async function swapCityImage(){
      const trip=currentTrip(); if(!trip) return;
      await swapCityImageForTrip(trip.id);
    }
    async function bilingualNames(name, bias){
      const result={he:'',en:''};
      try{ const a=await googleTextSearchLang(name,'he',bias); result.he=a[0]?.displayName?.text||''; result.hePhoto=photoUrl(a[0]?.photos?.[0]); }catch(e){}
      try{ const a=await googleTextSearchLang(name,'en',bias); result.en=a[0]?.displayName?.text||''; result.enPhoto=photoUrl(a[0]?.photos?.[0]); }catch(e){}
      return result;
    }
    async function googleCitySearch(query){
      if(!googleAvailable()) throw new Error('no key');
      const res = await fetch(placesUrl(':searchText'), { method:'POST', headers:placesHeaders('places.id,places.displayName,places.formattedAddress,places.location,places.viewport'), body:JSON.stringify({ textQuery:query, languageCode:langCode(), includedType:'locality', maxResultCount:5 }) });
      if(!res.ok) throw new Error('city ' + res.status);
      return (await res.json()).places || [];
    }
    async function googleNearby(lat,lng,radius=1500){
      if(!googleAvailable()) throw new Error('no key');
      const res = await fetch(placesUrl(':searchNearby'), { method:'POST', headers:placesHeaders('places.id,places.displayName,places.location,places.primaryType,places.primaryTypeDisplayName,places.formattedAddress'), body:JSON.stringify({ includedTypes:['tourist_attraction','restaurant','cafe','bar','park','museum'], maxResultCount:20, languageCode:langCode(), locationRestriction:{ circle:{ center:{ latitude:lat, longitude:lng }, radius } } }) });
      if(!res.ok) throw new Error('nearby ' + res.status);
      return (await res.json()).places || [];
    }
    // Loaded only when a suggestion pin is clicked (rating/hours/website are a pricier Places tier).
    async function googlePlaceDetails(id){
      if(!googleAvailable()) throw new Error('no key');
      const mask = 'rating,userRatingCount,formattedAddress,regularOpeningHours.openNow,regularOpeningHours.weekdayDescriptions,websiteUri,googleMapsUri,editorialSummary';
      const res = await fetch(placesUrl(encodeURIComponent(id)) + '?languageCode=' + langCode(), { headers:placesHeaders(mask) });
      if(!res.ok) throw new Error('details ' + res.status);
      return await res.json();
    }

    /* ---------- City lookup (Google first, OSM fallback) ---------- */
    async function findCities(query){
      try {
        const found = await googleCitySearch(query);
        if(found.length) return found.map(p=>({
          name:p.displayName?.text || query,
          detail:p.formattedAddress || '',
          lat:p.location.latitude, lng:p.location.longitude,
          viewport: p.viewport ? { north:p.viewport.high.latitude, south:p.viewport.low.latitude, east:p.viewport.high.longitude, west:p.viewport.low.longitude } : null,
          image:photoUrl(p.photos?.[0])
        }));
      } catch(e){ /* fall through */ }
      try {
        const r = await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=5&featuretype=city&accept-language=' + langCode() + '&q=' + encodeURIComponent(query)).then(r=>r.json());
        return r.map(x=>({
          name:(x.display_name||'').split(',')[0],
          detail:(x.display_name||'').split(',').slice(1,3).join(',').trim(),
          lat:+x.lat, lng:+x.lon,
          viewport: x.boundingbox ? { south:+x.boundingbox[0], north:+x.boundingbox[1], west:+x.boundingbox[2], east:+x.boundingbox[3] } : null,
          image:''
        }));
      } catch(e){ return [] }
    }

    async function enrichTripCity(tripRef){
      if(!tripRef) return;
      const id = tripRef.id;
      if(!tripRef.cityEnriched){
        if(cityMetaLookupsInFlight.has(id)) return;
        cityMetaLookupsInFlight.add(id);
        try{
          const q = tripRef.cityLabel || tripRef.name;
          if(googleAvailable()){
            const [he,en] = await Promise.all([googleTextSearchLang(q,'he',tripRef.center), googleTextSearchLang(q,'en',tripRef.center)]);
            // `trips` may have been swapped out (cloud sync merge) while the
            // lookup above was running — re-resolve the live object by id
            // before writing anything, same reason as in enrichCityImage.
            const trip = trips.find(x=>x.id===id);
            if(!trip) return; // trip was deleted while the lookup was running
            const gotHe = he[0]?.displayName?.text || '', gotEn = en[0]?.displayName?.text || '';
            trip.cityNameHe = gotHe || trip.cityNameHe || (lang==='he'?trip.name:'');
            trip.cityNameEn = gotEn || trip.cityNameEn || (lang==='en'?trip.name:'');
            // Only lock this in once we actually got real data back — a network
            // hiccup or empty result should not permanently block retrying.
            if(gotHe || gotEn) trip.cityEnriched = true;
            saveTrips();
            enrichCityImage(trip);
            return;
          } else {
            tripRef.cityEnriched = true; // nothing more to fetch without a key
            saveTrips();
          }
        }catch(e){ /* leave cityEnriched unset so this retries next time */ }
        finally{ cityMetaLookupsInFlight.delete(id); }
      }
      enrichCityImage(trips.find(x=>x.id===id) || tripRef);
    }

    /* ---------- Home ---------- */

      trips.filter(tr=>tr.cityEnriched && !tr.cityImage && !cityImageLookupsInFlight.has(tr.id)).slice(0,5).forEach(tr=>enrichCityImage(tr));
    }


    async function deleteTrip(id){
      if(!confirm(t('confirm.deleteTrip'))) return;
      const trip=trips.find(x=>x.id===id);
      markTripDeleted(id);
      trips=trips.filter(x=>x.id!==id);
      if(currentTripId===id){
        currentTripId=null;
        document.getElementById('homeView').style.display='block';
        document.getElementById('tripView').style.display='none';
        document.getElementById('fabBtn').style.display='none';
        if(firebaseUnsub){ firebaseUnsub(); firebaseUnsub=null; }
      }
      renderHome();
      if(firebaseReady && firebaseUser && firestore){
        try{
          const ref=firestore.doc(firestore.db,'users',firebaseUser.uid);
          await firestore.runTransaction(firestore.db,async tx=>{
            const snap=await tx.get(ref);
            const data=snap.exists()?snap.data():{};
            const deleted={...(data.deletedTripIds||{}),[id]:Date.now()};
            const cloudTrips=(data.trips||[]).map(normaliseTrip).filter(x=>x.id!==id&&!deleted[x.id]);
            tx.set(ref,{trips:cloudTrips.map(x=>({...x,schedule:prepareScheduleForCloud(x.schedule)})),deletedTripIds:deleted,updatedAt:firestore.serverTimestamp()},{merge:true});
          });
          if(trip?.sharedId && trip.sharedRole==='owner'){
            try{await firestore.deleteDoc(firestore.doc(firestore.db,'sharedTrips',trip.sharedId));}catch(e){console.info('shared delete failed',e)}
          }
          setSyncState('synced');
        }catch(e){
          console.info('trip delete sync failed',e);
          setSyncState(navigator.onLine?'pending':'offline');
          queueUserTripsSave();
        }
      }else{ saveTrips(); }
    }

    function persist(){ const trip = currentTrip(); if(trip){ trip.places = places; trip.schedule = schedule } saveTrips() }

    async function locateTripCity(id, name){
      const trip = trips.find(x=>x.id===id); if(!trip) return;
      const hits = await findCities(name);
      if(!hits.length) return;
      trip.center = [hits[0].lat, hits[0].lng];
