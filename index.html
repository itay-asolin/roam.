    /* ---------- Map ---------- */
    function coords(id){ const p = places[id]; return p && Number.isFinite(+p.lat) ? [+p.lat, +p.lng] : null }
    function dayForPlace(id){ return schedule.findIndex(d=>d.stops.some(s=>s[0]===id)) }
    function bucketOf(p){
      const c = (p.category||'').toLowerCase();
      if(/restaurant|cafe|coffee|bar|bakery|food|meal|pub|ice_cream|dessert|winery/.test(c)) return 'food';
      if(/museum|tourist|attraction|church|synagogue|mosque|temple|monument|historic|landmark|gallery|castle|viewpoint|square|memorial/.test(c)) return 'sight';
      return 'activity';
    }
    function passesFilter(p){ return activeFilter === 'all' || bucketOf(p) === activeFilter }

    window.mapLoadFailed = function(kind){
      const msg = t(kind === 'auth' ? 'map.authFailed' : kind === 'nokey' ? 'map.noKey' : 'map.failed');
      const label = document.getElementById('mapLabel');
      if(label) label.textContent = msg;
      const worldLabel = document.getElementById('worldMapLabel');
      if(worldLabel) worldLabel.textContent = msg;
    };

    function centerOnCity(){
      const trip = currentTrip();
      if(!freeMap || !trip) return;
      const { center, viewport } = focusCityCoords();
      if(!center) return;
      if(viewport){
        // City viewports from Nominatim/Places are often the whole
        // administrative area (suburbs, countryside and all), which makes
        // fitBounds zoom out far past what "the city" actually looks like.
        // Fit the bounds, then pull back in to a sane city-level zoom if it
        // landed too wide.
        freeMap.fitBounds(new google.maps.LatLngBounds({lat:viewport.south,lng:viewport.west},{lat:viewport.north,lng:viewport.east}), 40);
        google.maps.event.addListenerOnce(freeMap, 'idle', ()=>{ if(freeMap.getZoom() < 12) freeMap.setZoom(12) });
      } else { freeMap.setCenter({lat:center[0],lng:center[1]}); freeMap.setZoom(12) }
    }
    function fitAllPlaces(){
      if(!freeMap) return;
      const b = new google.maps.LatLngBounds(); let n = 0;
      Object.keys(places).forEach(id=>{ const c = coords(id); if(c && passesFilter(places[id])){ b.extend({lat:c[0],lng:c[1]}); n++ } });
      if(!n) return centerOnCity();
      if(n===1){ freeMap.setCenter(b.getCenter()); freeMap.setZoom(15) } else freeMap.fitBounds(b, 70);
    }

    /* ---------- Ruler: click a point, then move the mouse to measure ---------- */
    let rulerActive=false, rulerOrigin=null, rulerLine=null, rulerLabel=null, rulerClickListener=null, rulerMoveListener=null, rulerRightClickListener=null;
    function toggleRuler(){
      if(!freeMap) return;
      rulerActive = !rulerActive;
      document.getElementById('rulerBtn').classList.toggle('active', rulerActive);
      rulerActive ? startRuler() : stopRuler();
    }
    function startRuler(){
      freeMap.setOptions({ draggableCursor:'crosshair' });
      rulerClickListener = freeMap.addListener('click', e=>{
        rulerOrigin = { lat:e.latLng.lat(), lng:e.latLng.lng() };
        if(!rulerLine) rulerLine = new google.maps.Polyline({ map:freeMap, strokeColor:'#e2673f', strokeWeight:3, strokeOpacity:.9, geodesic:true, path:[rulerOrigin, rulerOrigin] });
        else rulerLine.setPath([rulerOrigin, rulerOrigin]);
      });
      rulerMoveListener = freeMap.addListener('mousemove', e=>{
        if(!rulerOrigin || !rulerLine) return;
        const cur = { lat:e.latLng.lat(), lng:e.latLng.lng() };
        rulerLine.setPath([rulerOrigin, cur]);
        if(!rulerLabel) rulerLabel = new google.maps.InfoWindow({ disableAutoPan:true });
        const rulerDark = theme === 'dark';
        rulerLabel.setContent(`<div style="font:600 12.5px Rubik,sans-serif;padding:3px 7px;white-space:nowrap;border-radius:6px;background:${rulerDark?'#1a2622':'#fff'};color:${rulerDark?'#e9ece9':'#15231f'}">${esc(fmtDistance(distM(rulerOrigin.lat, rulerOrigin.lng, cur.lat, cur.lng)))}</div>`);
        rulerLabel.setPosition(cur);
        if(!rulerLabel.get('map')) rulerLabel.open(freeMap);
      });
      // Right-click also exits ruler mode — a mouse-based way out that works
      // even if the map has keyboard focus and swallows the Escape key.
      rulerRightClickListener = freeMap.addListener('rightclick', ()=> toggleRuler());
    }
    function stopRuler(){
      if(rulerClickListener) google.maps.event.removeListener(rulerClickListener);
      if(rulerMoveListener) google.maps.event.removeListener(rulerMoveListener);
      if(rulerRightClickListener) google.maps.event.removeListener(rulerRightClickListener);
      rulerClickListener = rulerMoveListener = rulerRightClickListener = null;
      if(rulerLine){ rulerLine.setMap(null); rulerLine = null }
      if(rulerLabel){ rulerLabel.close(); rulerLabel = null }
      rulerOrigin = null;
      freeMap.setOptions({ draggableCursor:null });
    }

    /* ---------- Map search: find any place and open the same details bubble used everywhere else ---------- */
    let mapSearchFound = [];
    async function runMapSearch(q){
      const box = document.getElementById('mapSearchResults');
      if(!q){ box.style.display='none'; box.innerHTML=''; return }
      const trip = currentTrip();
      const focusCenter = focusCityCoords().center || (trip && trip.center);
      try{
        let found;
        try{
          const g = await googleTextSearch(q, focusCenter);
          if(!g.length) throw new Error('none');
          found = g.map(x=>({ id:x.id||'', name:x.displayName?.text||q, address:x.formattedAddress||'', lat:x.location.latitude, lng:x.location.longitude, category:(x.primaryType||'place').replace(/_/g,' ') }));
        }catch(e){
          const near = focusCenter ? `&viewbox=${focusCenter[1]-0.35},${focusCenter[0]+0.35},${focusCenter[1]+0.35},${focusCenter[0]-0.35}&bounded=1` : '';
          const osm = await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=6&accept-language=' + langCode() + near + '&q=' + encodeURIComponent(q)).then(r=>r.json());
          found = osm.map(x=>({ id:'', name:(x.display_name||'').split(',')[0], address:x.display_name||'', lat:+x.lat, lng:+x.lon, category:x.type||'place' }));
        }
        mapSearchFound = found;
        box.innerHTML = found.length
          ? found.map((x,i)=>`<button type="button" class="add search-place-result" data-i="${i}" style="text-align:start"><span>📍 ${esc(x.name)} <small>${esc(x.address||x.category||'')}</small></span></button>`).join('')
          : `<div class="hint" style="padding:10px 12px;margin:0">${esc(t('add.none'))}</div>`;
        box.style.display = 'block';
      }catch(e){ box.innerHTML = `<div class="hint" style="padding:10px 12px;margin:0">${esc(t('add.error'))}</div>`; box.style.display = 'block' }
    }

    // Clicking a real place already drawn on the base Google map (a "POI" —
    // a restaurant, landmark, city label, etc.) used to do nothing, because

    // via the Places JS library (already loaded) so it can be turned into

    function fetchPlaceDetails(map, placeId){

          resolve(status === google.maps.places.PlacesServiceStatus.OK && place ? place : null);
        });
      });

    function openCityAddInput(){
      const box = document.getElementById('cityLegend');

      wrap.innerHTML = `<input class="city-add-input" id="cityAddInput" placeholder="${esc(t('city.addPh'))}"><div class="suggest" id="cityAddSuggest" style="display:none;position:absolute;top:100%;inset-inline-start:0;min-width:220px;z-index:5"></div>`;
      document.getElementById('cityAddChip').replaceWith(wrap);
      const input = document.getElementById('cityAddInput'), suggest = document.getElementById('cityAddSuggest');

      let timer;
      input.addEventListener('input', ()=>{
        clearTimeout(timer);
        const q = input.value.trim();
        if(!q){ suggest.style.display = 'none'; return }
        timer = setTimeout(async ()=>{
          suggest.style.display = 'block';
          suggest.innerHTML = `<button disabled>${esc(t('new.searching'))}</button>`;

            trip.cities = trip.cities || [];

    function renderDayLegend(){
      document.getElementById('dayLegend').innerHTML = schedule.map((d,i)=>`<span class="day-chip${!mapOverlayDays && i===mapFocusDay?' active':''}" data-day="${i}" style="${!mapOverlayDays && i===mapFocusDay?`color:${DAY_COLORS[i%DAY_COLORS.length]}`:''}"><i style="background:${DAY_COLORS[i%DAY_COLORS.length]}"></i>${esc(t('day',{n:i+1}))}${dayDate(i)?' · '+esc(dayDate(i)):''}</span>`).join('');

    function redrawMap(){
      if(!freeMap) return;
      liveMarkers.forEach(m=>m.setMap(null)); liveMarkers = [];
      const placeNumbers = computePlaceNumbers();
      Object.entries(places).forEach(([id,p])=>{
        if(!passesFilter(p)) return;
        const c = coords(id); if(!c) return;
        const di = dayForPlace(id);
        if(!mapOverlayDays && di>=0 && di!==mapFocusDay) return;
        const color = di>=0 ? DAY_COLORS[di%DAY_COLORS.length] : '#6a746e';
        // The stop that starts (and, on a loop day, also ends) the route gets a
        // heavier black ring so it reads as the loop point at a glance.
        const day = di>=0 ? schedule[di] : null;
        const isLoopStart = day && day.loop && day.stops[0] && day.stops[0][0] === id;
        const m = new google.maps.Marker({
          position:{lat:c[0],lng:c[1]}, map:freeMap, title:p.title||p.name,
          label:{ text:String(placeNumbers.get(id)||'•'), color:'#15231f', fontSize:'11px', fontWeight:'700' },
          icon:{ path:google.maps.SymbolPath.CIRCLE, scale:isLoopStart ? 14 : 13, fillColor:color, fillOpacity:.95, strokeColor:isLoopStart ? '#111' : '#fff', strokeWeight:isLoopStart ? 4 : 2 }
        });
        m.addListener('click', ()=>openIdea(ideaFromTrip(id), m));
        m._pid = id;
        liveMarkers.push(m);
      });
      renderDayLegend();
      renderCityLegend();
      computeRoutes();
    }

    function redrawWorldMap(){
      if(!worldMap) return;
      worldMarkers.forEach(m=>m.setMap(null)); worldMarkers = [];
      const bounds = new google.maps.LatLngBounds();
      let n = 0;
      trips.forEach(tr=>{
        if(!tr.center) return;
        const pos = {lat:tr.center[0], lng:tr.center[1]};
        const m = new google.maps.Marker({
          position:pos, map:worldMap, title: lang==='he' ? (tr.cityNameHe||tr.name) : (tr.cityNameEn||tr.name),
          icon:{ path:google.maps.SymbolPath.CIRCLE, scale:11, fillColor:'#e2673f', fillOpacity:.95, strokeColor:'#fff', strokeWeight:2 }
        });

          worldInfoWindow.open({map:worldMap, anchor:m});

      else if(n>1){ worldMap.fitBounds(bounds, 60) }

    /* ---------- Routes + real travel times ---------- */
    function fmtDuration(sec){
      const m = Math.round(sec/60);
      if(m < 60) return lang === 'he' ? m + ' דק׳' : m + ' min';
      const h = Math.floor(m/60), r = m%60;
      return lang === 'he' ? (h + ' ש׳' + (r? ' ' + r + ' דק׳':'')) : (h + ' h' + (r? ' ' + r + ' min':''));
    }
    function fmtDistance(m){
      if(m < 1000) return Math.round(m) + (lang==='he'?' מ׳':' m');
      return (m/1000).toFixed(1) + (lang==='he'?' ק״מ':' km');
    }

    async function fetchDayRoute(di, profile){
      const day = schedule[di];
      const stops = day.stops;
      let usable = stops.map(s=>coords(s[0])).filter(Boolean);
      if(usable.length < 2) return { di, usable, data:null };
      if(day.loop) usable = usable.concat([usable[0]]);

      // router.project-osrm.org only actually serves the driving/car profile —
      // it silently accepts "foot" in the URL but returns car routes anyway.
      // Real pedestrian routing needs the separate routed-foot instance on
      // routing.openstreetmap.de. Still fall back to driving if that's down.
      const endpoints = profile === 'foot'
        ? [
            { p:'foot', base:'https://routing.openstreetmap.de/routed-foot/route/v1/foot/' },
            { p:'driving', base:'https://router.project-osrm.org/route/v1/driving/' }
          ]
        : [
            { p:'driving', base:'https://router.project-osrm.org/route/v1/driving/' }
          ];

      let data = null;
      for(const {p, base} of endpoints){
        try {
          const url = base + usable.map(c=>c[1]+','+c[0]).join(';') + '?overview=full&geometries=geojson';
          const json = await fetch(url).then(r=>r.json());
          if(json.code === 'Ok' && json.routes?.[0]){ data = { route:json.routes[0], profile:p }; break }
        } catch(e){ /* try next */ }
      }
      return { di, usable, data };
    }

    async function computeRoutes(){
      routeLines.forEach(l=>l.setMap(null)); routeLines = [];
      const trip = currentTrip();
      const tripProfile = trip && trip.travelMode === 'driving' ? 'driving' : 'foot';
      let totalSeconds = 0, totalMeters = 0;

      // All days are independent, so fetch every day's route in parallel
      // instead of waiting for each one to finish before starting the next —
      // this was previously the slowest part of opening a multi-day trip.
      const results = await Promise.all(schedule.map((day,di)=>fetchDayRoute(di, day.travelMode === 'driving' ? 'driving' : day.travelMode === 'foot' ? 'foot' : tripProfile)));

      results.forEach(({di, usable, data})=>{
        if(usable.length < 2){ setTravelTexts(di, null); return }
        const color = DAY_COLORS[di%DAY_COLORS.length];
        const showOnMap = mapOverlayDays || di === mapFocusDay;
        const transitLegs = schedule[di] && Array.isArray(schedule[di].transitLegs) ? schedule[di].transitLegs : [];
        if(data){
          const path = data.route.geometry.coordinates.map(([lng,lat])=>({lat,lng}));
          if(freeMap && showOnMap) routeLines.push(new google.maps.Polyline({ path, geodesic:true, strokeColor:color, strokeWeight:4, strokeOpacity:.8, map:freeMap }));
          const legs = data.route.legs.map(l=>({ sec:l.duration, m:l.distance, profile:data.profile }));
          legs.forEach((l,li)=>{ if(!transitLegs.includes(li)){ totalSeconds += l.sec; totalMeters += l.m } });
          setTravelTexts(di, legs);
        } else {
          if(freeMap && showOnMap) routeLines.push(new google.maps.Polyline({ path:usable.map(c=>({lat:c[0],lng:c[1]})), geodesic:true, strokeColor:color, strokeWeight:3, strokeOpacity:.5, map:freeMap }));
          setTravelTexts(di, null);
        }
      });
      document.getElementById('statTime').textContent = totalSeconds ? fmtDuration(totalSeconds) : '—';
      document.getElementById('statDistance').textContent = totalMeters ? fmtDistance(totalMeters) : '—';
    }

    function setTravelTexts(di, legs){
      const day = schedule[di];
      document.querySelectorAll(`.travel[data-day="${di}"]`).forEach(el=>{
        const li = +el.dataset.leg;
        const textEl = el.querySelector('.travel-text') || el;
        const isTransit = day && Array.isArray(day.transitLegs) && day.transitLegs.includes(li);
        el.classList.toggle('transit', !!isTransit);
        if(isTransit){
          const a = day && coords(day.stops[li]?.[0]);
          const bId = (day && day.loop && li === day.stops.length-1) ? day.stops[0]?.[0] : day?.stops[li+1]?.[0];
          const b = coords(bId);
          textEl.textContent = a && b ? t('travel.transit', { dist:fmtDistance(distM(a[0],a[1],b[0],b[1])) }) : t('travel.transitNoDist');
          return;
        }
        if(!legs || !legs[li]){ textEl.textContent = ''; return }
        const leg = legs[li];
        textEl.textContent = t(leg.profile === 'foot' ? 'travel.walk' : 'travel.drive', { time:fmtDuration(leg.sec), dist:fmtDistance(leg.m) });
      });
    }

    /* ---------- Itinerary ---------- */
    // A leg between two stops (or, on a loop day, the return leg back to the
    // first stop) can be marked as public transit instead of walking/driving
    // — there's no free transit-routing API, so it just shows the straight-
    // line distance with no time, rather than a real (and wrong) walk/drive
    // estimate for a leg you're actually taking a bus for.
    function travelDivHtml(di, leg){
      return `<div class="travel" data-day="${di}" data-leg="${leg}"><button type="button" class="transit-toggle" data-day="${di}" data-leg="${leg}" title="${esc(t('travel.transitToggle'))}" aria-label="${esc(t('travel.transitToggle'))}">🚌</button><span class="travel-text">${esc(t('travel.pending'))}</span></div>`;
    }
    // Sequential number for each stop across the whole trip (day 1's stops,
    // then day 2's, etc.) — shared by the map pins and the itinerary list so
    // the same number identifies the same stop in both places.
    function computePlaceNumbers(){
      const map = new Map(); let n = 1;
      schedule.forEach(d=>d.stops.forEach(s=>{ if(places[s[0]]) map.set(s[0], n++) }));
      return map;
    }
    const daysBox = document.getElementById('days');
    function render(){
      const placeNumbers = computePlaceNumbers();
      const trip = currentTrip();
      const tripMode = trip && trip.travelMode === 'driving' ? 'driving' : 'foot';
      daysBox.innerHTML = schedule.map((d,di)=>{
        const color = DAY_COLORS[di%DAY_COLORS.length];
        const stopsHtml = d.stops.length ? d.stops.map((s,i)=>{
          const p = places[s[0]]; if(!p) return '';
          const daySel = schedule.length > 1 ? `<select class="move-day" data-place="${s[0]}">${schedule.map((_,j)=>`<option value="${j}" ${j===di?'selected':''}>${esc(t('day.moveTo',{n:j+1}))}</option>`).join('')}</select>` : '';
          return `<div class="stop" draggable="true" data-place="${s[0]}">
            <span class="handle">⠿</span>
            <span class="stop-num" style="background:${color}">${placeNumbers.get(s[0])||''}</span>
            <div class="stop-main">${stopThumbHtml(s[0], p)}<div class="stop-copy">${stopCopyHtml(p, s[0], di)}</div></div>
            <span class="stop-tools">${daySel}<button class="icon-btn edit-stop" data-place="${s[0]}" title="${esc(t('stop.edit'))}" aria-label="${esc(t('stop.edit'))}">✎</button><button class="icon-btn del-stop" data-place="${s[0]}" title="${esc(t('day.removeStop'))}">✕</button></span>
          </div>${editingStop===s[0] ? stopEditorHtml(s[0]) : ''}${i < d.stops.length-1 ? travelDivHtml(di, i) : ''}`;
        }).join('') + (d.loop && d.stops.length>1 && places[d.stops[0][0]] ? travelDivHtml(di, d.stops.length-1) + `<div class="stop stop-return" data-place="${d.stops[0][0]}"><span class="handle" style="visibility:hidden">⠿</span><span class="stop-num" style="background:${color}">↩</span><div class="stop-main"><div class="stop-thumb stop-thumb-empty">↩️</div><div class="stop-copy"><strong>${esc(t('day.returnTo',{name:places[d.stops[0][0]].name}))}</strong></div></div></div>` : '') : `<div class="day-empty">${esc(t('day.empty'))}</div>`;

        const effMode = d.travelMode || tripMode;
        const modeAuto = !d.travelMode;
        const modeTitle = t(effMode==='driving'?'mode.drive':'mode.walk') + (modeAuto ? ' · ' + t('day.modeAuto') : '');
        return `<article class="day">
          <div class="daytop">
            <span class="daynum" style="background:${color}22;border:1px solid ${color};color:${color}">${String(di+1).padStart(2,'0')}</span>
            <strong>${esc(t('day',{n:di+1}))}</strong>
            <span class="dd">${esc(dayDate(di))}</span>

    // Free deep link: Google Maps directions in public-transit mode (no extra API billing).
    function transitUrl(lat, lng, gid, from){
      let u = 'https://www.google.com/maps/dir/?api=1&travelmode=transit&destination=' + lat + ',' + lng;
      if(gid) u += '&destination_place_id=' + encodeURIComponent(gid);
      if(from){ u += '&origin=' + from.lat + ',' + from.lng; if(from.gid) u += '&origin_place_id=' + encodeURIComponent(from.gid) }
      return u;
    }
    function prevStopId(id){
      for(const d of schedule){ const i = d.stops.findIndex(x=>x[0]===id); if(i === 0) return ''; if(i > 0) return d.stops[i-1][0] }
      return '';
    }
    function transitUrlForPlace(id){
      const p = places[id], pid = prevStopId(id), pp = pid && coords(pid);
      return transitUrl(+p.lat, +p.lng, p.gid, pp ? { lat:pp[0], lng:pp[1], gid:places[pid].gid } : null);
    }

    function moveStop(id, toDay){
      const from = schedule.findIndex(d=>d.stops.some(s=>s[0]===id));
      if(from < 0 || from === toDay) return;
      const stop = schedule[from].stops.find(s=>s[0]===id);
      schedule[from].stops = schedule[from].stops.filter(s=>s[0]!==id);
      schedule[toDay].stops.push(stop);
      render();
    }
    // Drag-and-drop reorder: drops onto a specific stop insert the dragged
    // stop right before it (same day or a different one), instead of only
    // being able to move a stop across days like moveStop() does.
    function moveStopTo(id, toDay, beforeId){
      if(id === beforeId) return;
      const from = schedule.findIndex(d=>d.stops.some(s=>s[0]===id));
      const target = schedule[toDay];
      if(from < 0 || !target) return;
      const stop = schedule[from].stops.find(s=>s[0]===id);
      schedule[from].stops = schedule[from].stops.filter(s=>s[0]!==id);
      let idx = beforeId ? target.stops.findIndex(s=>s[0]===beforeId) : -1;
      if(idx < 0) idx = target.stops.length;
      target.stops.splice(idx, 0, stop);
      render();
    }
    function removePlace(id){
      schedule.forEach(d=> d.stops = d.stops.filter(s=>s[0]!==id));
      delete places[id]; if(editingStop===id) editingStop = null;
      render();
    }
    function bindDrag(){
      let dragged;
      document.querySelectorAll('.stop').forEach(el=>{
        el.addEventListener('dragstart',()=>{ dragged = el; el.style.opacity='.4' });
        el.addEventListener('dragend',()=>{ el.style.opacity='1' });
        // Dropping directly on another stop reorders within (or into) that
        // stop's day, placing the dragged stop right before it. Without
        // this, dropping back into the same day's list did nothing.
        el.addEventListener('dragover', e=>{ e.preventDefault(); e.stopPropagation() });
        el.addEventListener('drop', e=>{
          e.preventDefault(); e.stopPropagation();
          if(!dragged || dragged === el) return;
          const box = el.closest('.stops'); if(!box) return;
          moveStopTo(dragged.dataset.place, +box.dataset.day, el.dataset.place);
        });
      });
      document.querySelectorAll('.stops').forEach(box=>{
        box.addEventListener('dragover', e=>e.preventDefault());
        box.addEventListener('drop', ()=>{ if(dragged) moveStop(dragged.dataset.place, +box.dataset.day) });
      });
    }
    function optimiseDay(di){
      const day = schedule[di];
      if(!day || day.stops.length < 3) return;
      const rest = [...day.stops], ordered = [rest.shift()];
      let last = coords(ordered[0][0]);
      while(rest.length){
        let best = 0, bestD = Infinity;
        rest.forEach((s,i)=>{ const p = coords(s[0]); if(!p||!last) return; const d = (p[0]-last[0])**2+(p[1]-last[1])**2; if(d<bestD){bestD=d;best=i} });
        const next = rest.splice(best,1)[0];
        ordered.push(next); last = coords(next[0]) || last;
      }
      day.stops = ordered; render();
    }

    // Drag the bar under a map to stretch it (mouse, touch, or ArrowUp/ArrowDown); double-click resets.
    function setupMapResizer(bar, wrap, key, onResize){
      if(!bar || !wrap) return;
      const clamp = h => Math.max(240, Math.min(Math.round(h), Math.round(window.innerHeight*2.5)));
      const set = h => { wrap.style.height = clamp(h)+'px'; onResize() };
      const save = ()=>{ try{ localStorage.setItem(key, String(Math.round(wrap.getBoundingClientRect().height))) }catch(e){} };
      try{ const saved = +localStorage.getItem(key); if(saved) wrap.style.height = clamp(saved)+'px' }catch(e){}
      let drag = false, y0 = 0, h0 = 0, raf = 0;
      bar.addEventListener('pointerdown', e=>{ drag = true; y0 = e.clientY; h0 = wrap.getBoundingClientRect().height; try{ bar.setPointerCapture(e.pointerId) }catch(_){} wrap.classList.add('resizing'); e.preventDefault() });
      bar.addEventListener('pointermove', e=>{ if(!drag) return; const h = h0 + (e.clientY - y0); cancelAnimationFrame(raf); raf = requestAnimationFrame(()=>set(h)) });
      const end = ()=>{ if(!drag) return; drag = false; wrap.classList.remove('resizing'); save() };
      bar.addEventListener('pointerup', end); bar.addEventListener('pointercancel', end);
      bar.addEventListener('dblclick', ()=>{ wrap.style.height = ''; try{ localStorage.removeItem(key) }catch(e){} onResize() });
      bar.addEventListener('keydown', e=>{ if(e.key!=='ArrowDown' && e.key!=='ArrowUp') return; e.preventDefault(); set(wrap.getBoundingClientRect().height + (e.key==='ArrowDown' ? 60 : -60)); save() });
    }

    /* ---------- Weather + weather-aware packing ---------- */
    const WX = {
      0:['☀️','Clear','שמיים בהירים'],1:['🌤️','Mostly clear','בהיר בעיקר'],2:['⛅','Partly cloudy','מעונן חלקית'],3:['☁️','Cloudy','מעונן'],
      45:['🌫️','Fog','ערפל'],48:['🌫️','Fog','ערפל'],
      51:['🌦️','Light drizzle','טפטוף קל'],53:['🌦️','Drizzle','טפטוף'],55:['🌦️','Drizzle','טפטוף'],
      61:['🌧️','Light rain','גשם קל'],63:['🌧️','Rain','גשם'],65:['🌧️','Heavy rain','גשם חזק'],
      71:['🌨️','Light snow','שלג קל'],73:['🌨️','Snow','שלג'],75:['❄️','Heavy snow','שלג כבד'],
      80:['🌦️','Showers','ממטרים'],81:['🌦️','Showers','ממטרים'],82:['⛈️','Heavy showers','ממטרים עזים'],
      95:['⛈️','Thunderstorm','סופת רעמים'],96:['⛈️','Thunderstorm','סופת רעמים'],99:['⛈️','Thunderstorm','סופת רעמים']
    };
    function wxInfo(code){ const e = WX[code] || ['🌡️','—','—']; return { icon:e[0], text: lang==='he'?e[2]:e[1] } }
    let wxSuggestions = [];

    async function loadWeather(){
      const trip = currentTrip();
      const body = document.getElementById('wxBody');
      document.getElementById('packSuggest').innerHTML = '';
      if(!trip) return;
      if(!trip.startDate || !trip.center){ body.innerHTML = `<p style="color:var(--muted);font-size:12.5px;margin:0">${esc(t('wx.needDate'))}</p>`; return }
      body.innerHTML = `<p style="color:var(--muted);font-size:12.5px;margin:0">${esc(t('wx.loading'))}</p>`;

      const start = isoForDay(0, trip.startDate), end = isoForDay(schedule.length-1, trip.startDate);
      const daysAhead = (new Date(start+'T00:00:00') - new Date(new Date().toDateString())) / 86400000;
      const useForecast = daysAhead <= 15;
      const [lat,lng] = trip.center;

      try {
        let url, typical = false;
        if(useForecast){
          url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lng}&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,wind_speed_10m_max&timezone=auto&start_date=${start}&end_date=${end}`;
        } else {
          typical = true;
          const shift = iso=> (new Date(iso+'T00:00:00').getFullYear()-1) + iso.slice(4);
          url = `https://archive-api.open-meteo.com/v1/archive?latitude=${lat}&longitude=${lng}&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum,wind_speed_10m_max&timezone=auto&start_date=${shift(start)}&end_date=${shift(end)}`;
        }
        const data = await fetch(url).then(r=>r.json());
        const d = data.daily;
        if(!d || !d.time?.length) throw new Error('no data');

        body.innerHTML = d.time.map((_,i)=>{
          const info = wxInfo(d.weather_code[i]);
          const rain = useForecast ? (d.precipitation_probability_max?.[i] ?? null) : null;
          return `<div class="wx-row"><span class="ic">${info.icon}</span>
            <span class="d">${esc(t('day',{n:i+1}))} · ${esc(dayDate(i))}</span>
            <b>${Math.round(d.temperature_2m_max[i])}° / ${Math.round(d.temperature_2m_min[i])}°</b>
            ${rain!==null?`<span style="color:var(--muted)">${rain}%</span>`:''}</div>`;
        }).join('') + `<div class="wx-note">${esc(t(typical ? 'wx.typical' : 'wx.forecast'))}</div>`;

        buildPackingSuggestions(d, useForecast);
      } catch(e){
        body.innerHTML = `<p style="color:var(--muted);font-size:12.5px;margin:0">${esc(t('wx.error'))}</p>`;
      }
    }

    function buildPackingSuggestions(d, isForecast){
      const maxT = Math.max(...d.temperature_2m_max), minT = Math.min(...d.temperature_2m_min);
      const spread = Math.max(...d.temperature_2m_max.map((v,i)=>v - d.temperature_2m_min[i]));
      const wetDay = isForecast
        ? Math.max(...(d.precipitation_probability_max||[0])) >= 40
        : Math.max(...(d.precipitation_sum||[0])) >= 2;
      const heavyRain = (d.weather_code||[]).some(c=>[63,65,80,81,82,95,96,99].includes(c));
      const wind = Math.max(...(d.wind_speed_10m_max||[0]));

      const keys = [];
      if(wetDay) keys.push('pack.rain');
      if(heavyRain) keys.push('pack.rainCoat');
      if(maxT >= 26){ keys.push('pack.sun','pack.hat','pack.water') }
      if(maxT >= 30) keys.push('pack.sandals');
      if(minT <= 8) keys.push('pack.warm');
      if(minT <= 2) keys.push('pack.beanie');
      if(spread >= 11) keys.push('pack.layers');
      if(wind >= 35) keys.push('pack.wind');

      const trip = currentTrip();
      const have = new Set((trip?.packing||[]).map(x=>x.text));
      wxSuggestions = [...new Set(keys)].map(k=>t(k)).filter(x=>!have.has(x));
      renderSuggestions();
    }

    function renderSuggestions(){
      const box = document.getElementById('packSuggest');
      if(!wxSuggestions.length){ box.innerHTML = ''; return }
      box.innerHTML = `<div style="width:100%;color:var(--muted);font-size:11.5px">${esc(t('pack.suggested'))}</div>` +
        wxSuggestions.map((s,i)=>`<button class="chip" data-i="${i}">+ ${esc(s)}</button>`).join('');
      box.querySelectorAll('.chip').forEach(b=> b.onclick = ()=>{
        const trip = currentTrip(); if(!trip) return;
        trip.packing.push({ text:wxSuggestions[+b.dataset.i], done:false });
        wxSuggestions.splice(+b.dataset.i,1);
        saveTrips(); renderPacking(); renderSuggestions();
      });
    }

    /* ---------- Packing + note ---------- */
    function renderPacking(){
      const trip = currentTrip(); if(!trip) return;
      const box = document.getElementById('packList');
      box.innerHTML = trip.packing.map((item,i)=>`<label><input type="checkbox" data-i="${i}" ${item.done?'checked':''}><span>${esc(item.text)}</span><button class="del" data-i="${i}" aria-label="remove">✕</button></label>`).join('');
      box.querySelectorAll('input').forEach(inp=> inp.onchange = ()=>{ trip.packing[+inp.dataset.i].done = inp.checked; saveTrips() });
      box.querySelectorAll('.del').forEach(b=> b.onclick = ()=>{ trip.packing.splice(+b.dataset.i,1); saveTrips(); renderPacking() });
    }
    document.getElementById('addPackBtn').onclick = ()=>{

    /* ---------- New destination with city suggestions ---------- */
    const newTripModal = document.getElementById('newTripModal');
    let selectedTripDays = 3, chosenCity = null, suggestTimer;

    /* Trip length stepper: 1–30 days */
    const MAX_DAYS = 30;
    const daysDecBtn = document.getElementById('daysDecBtn');
    const daysIncBtn = document.getElementById('daysIncBtn');
    const daysValue = document.getElementById('daysValue');
    function setDays(n){
      selectedTripDays = Math.min(MAX_DAYS, Math.max(1, n));

    const cityInput = document.getElementById('newTripName'), citySuggest = document.getElementById('citySuggest'), cityAltName = document.getElementById('cityAltName');
    async function showCityAltName(city){
      if(!city){ cityAltName.style.display='none'; return }

      if(!googleAvailable()) return;
      try{
        const names = await bilingualNames(city.name, [city.lat, city.lng]);
        city.cityNames = names;
        const alt = lang==='he' ? names.en : names.he;
        if(alt && chosenCity===city){ cityAltName.textContent = '· '+alt; cityAltName.style.display='block'; }
      }catch(e){}
    }
    cityInput.addEventListener('input', ()=>{

      clearTimeout(suggestTimer);

        citySuggest.style.display = 'block';
        citySuggest.innerHTML = `<button disabled>${esc(t('new.searching'))}</button>`;

        if(!hits.length){ citySuggest.innerHTML = `<button disabled>${esc(t('new.noCity'))}</button>`; return }

    document.getElementById('newTripCancelBtn').onclick = ()=>newTripModal.classList.remove('open');
    function openNewTripModalForPlace(place){
      document.getElementById('newTripDate').value = '';

        places:{}, schedule: Array.from({length:selectedTripDays}, ()=>({date:'',stops:[]})),
        center: city ? [city.lat, city.lng] : null,

    /* ---------- Add places ---------- */
    const modal = document.getElementById('modal');
    // `changePlaceId` set = this same modal is repurposed to swap an existing
    // stop's place instead of adding a new one (see replacePlace below).
    function openImporter(replaceId){
      changePlaceId = replaceId || null;
      document.getElementById('modalTitle').textContent = t(changePlaceId ? 'change.title' : 'add.title');
      document.getElementById('modalSub').textContent = t(changePlaceId ? 'change.sub' : 'add.sub');

    function fillDaySelect(){
      const sel = document.getElementById('targetDay'); if(!sel) return;
      const keep = sel.value;
      sel.innerHTML = schedule.map((d,i)=>`<option value="${i}">${esc(t('day',{n:i+1}))}${dayDate(i)?' · '+esc(dayDate(i)):''}</option>`).join('');
      if(keep && +keep < schedule.length) sel.value = keep;
    }
    function targetDayIndex(){ const v = +document.getElementById('targetDay').value; return Number.isFinite(v) && schedule[v] ? v : 0 }

    async function searchPlaces(){
      const q = document.getElementById('placeSearch').value.trim(), box = document.getElementById('searchResults');
      if(!q) return;
      box.textContent = t('add.searching');
      const trip = currentTrip();
      const focusCenter = focusCityCoords().center || (trip && trip.center);
      try {
        let found;
        try {
          const g = await googleTextSearch(q, focusCenter);
          if(!g.length) throw new Error('none');
          found = g.map(x=>({ gid:x.id||'', name:x.displayName?.text||q, nameEn:'', nameHe:'', image:photoUrl(x.photos?.[0]), lat:x.location.latitude, lng:x.location.longitude, category:(x.primaryType||'place').replace(/_/g,' ') }));
        } catch(e){
          const near = focusCenter ? `&viewbox=${focusCenter[1]-0.35},${focusCenter[0]+0.35},${focusCenter[1]+0.35},${focusCenter[0]-0.35}&bounded=1` : '';
          const osm = await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=6&accept-language=' + langCode() + near + '&q=' + encodeURIComponent(q)).then(r=>r.json());
          found = osm.map(x=>({ name:(x.display_name||'').split(',')[0], nameEn:'', nameHe:'', image:'', lat:+x.lat, lng:+x.lon, category:x.type||'place' }));
        }
        if(!found.length){ box.textContent = t('add.none'); return }
        box.innerHTML = found.map((x,i)=>`<button class="add search-place-result" style="margin-top:6px;text-align:start" data-i="${i}">${x.image?`<img src="${esc(x.image)}" alt="" loading="lazy">`:''}<span>+ ${esc(x.name)} <small>(${esc(x.category)})</small></span></button>`).join('');
        box.querySelectorAll('[data-i]').forEach(b=> b.onclick = ()=>{
          if(changePlaceId) replacePlace(changePlaceId, found[+b.dataset.i]);
          else addPlace(found[+b.dataset.i], targetDayIndex(), t('place.added'));
          modal.classList.remove('open');
        });
      } catch(e){ box.textContent = t('add.error') }
    }
    // Swaps an existing stop onto a different place entirely (new location,
    // name, category, photo) while keeping its title, note and day/position —
    // the only way to do this before was delete the stop and add a new one.
    function replacePlace(id, x){
      const p = places[id]; if(!p) return;
      Object.assign(p, {
        gid:x.gid||'', name:x.name, nameEn:'', nameHe:'', category:x.category,
        lat:x.lat, lng:x.lng, image:x.image||'', imagePage:'', imageAuthor:'',
        imageLicense:'', imageLicenseUrl:'', imageTriedPages:[]
      });
      delete p.imageFailedAt;
      changePlaceId = null;
      render();
      if(freeMap) freeMap.panTo({lat:x.lat,lng:x.lng});
      enrichPlaceNames(id, p);
      enrichPlaceImage(id, p);
    }

    async function retryPlaceImage(id){
      const p=places[id]; if(!p || p.imageLoading) return;
      p.imageTriedPages=p.imageTriedPages||[];
      if(p.imagePage && !p.imageTriedPages.includes(p.imagePage)) p.imageTriedPages.push(p.imagePage);
      p.image=''; p.imagePage=''; p.imageAuthor=''; p.imageLicense=''; p.imageLicenseUrl='';
      await enrichPlaceImage(id,p,true,new Set(p.imageTriedPages));
    }

    async function enrichMissingPlaceImages(){
      const list=Object.entries(places).filter(([id,p])=>p && !p.image && !p.imageLoading).slice(0,8);
      for(const [id,p] of list) await enrichPlaceImage(id,p);
    }
    async function refreshAllImages(){
      const tr=currentTrip(); if(!tr) return;
      // Once a place/city has an image, leave it alone — never re-search
      // just because the trip was reopened. (This used to force one re-check
      // per place/city "in case an older version picked a bad photo" — but
      // that meant every trip paid for a full re-search on next open even
      // when the existing photo was perfectly good. A found image is now
      // treated as final; the only way to change it is the manual 🔄 swap.)
      const placesList=Object.entries(places).filter(([,p])=>p && !p.image && !p.imageLoading);
      for(const [id,p] of placesList.slice(0,8)){
        await enrichPlaceImage(id,p);
      }
      if(!tr.cityImage){
        await enrichCityImage(tr);
      }
      persist();
    }

    function stopCopyHtml(p, id, di){
      const own = lang==='he' ? (p.nameHe||p.name) : (p.nameEn||p.name);
      const other = lang==='he' ? p.nameEn : p.nameHe;
      const main = p.title || own, sub = p.title ? own : other;
      const note = p.notes && !isAutoNote(p.notes) ? p.notes : '';
      const det = p.gid ? ideaDetailsCache[p.gid] : undefined;
      const list = (det && det.regularOpeningHours && det.regularOpeningHours.weekdayDescriptions) || [];
      const hoursLine = list.length && Number.isFinite(di) ? hoursLineForDate(list, dateForDay(di)) : '';
      const closed = /closed|סגור/i.test(hoursLine);
      return `<b>${esc(main)}</b>${sub?`<small>${esc(sub)}</small>`:''}<small class="stop-type" title="${esc(t('filter.'+bucketOf(p)))}">${IDEA_ICON[bucketOf(p)]}</small>${note?`<small class="stop-note">${esc(note)}</small>`:''}${hoursLine?`<small class="stop-hours${closed?' closed':''}">🕐 ${esc(hoursLine)}</small>`:''}`;
    }
    function updateStopName(id){
      const p = places[id]; if(!p) return;
      const di = dayForPlace(id);
      document.querySelectorAll(`.stop[data-place="${id}"] .stop-copy`).forEach(el=>{ el.innerHTML = stopCopyHtml(p, id, di); });
    }
    async function enrichPlaceNames(id, place){
      if(!place || place.namesLoading || (place.nameHe && place.nameEn)) return;
      place.namesLoading=true;
      try{
        const n=await bilingualNames(place.name,[place.lat,place.lng]);
        if(n.he) place.nameHe=n.he;
        if(n.en) place.nameEn=n.en;
        if(!place.nameHe && lang==='he') place.nameHe=place.name;
        if(!place.nameEn && lang==='en') place.nameEn=place.name;
        persist();
        if(currentTrip()) updateStopName(id);
      }catch(e){}
      place.namesLoading=false;
    }
    async function enrichMissingPlaceNames(){
      const list=Object.entries(places).filter(([,p])=>p && !(p.nameHe&&p.nameEn) && !p.namesLoading).slice(0,5);
      for(const [id,p] of list) await enrichPlaceNames(id,p);
    }

    function addPlace(x, dayIndex, note){
      const id='p'+Date.now()+Math.floor(Math.random()*1000);
      places[id]={gid:x.gid||'',title:x.title||'',name:x.name,nameHe:x.nameHe||'',nameEn:x.nameEn||'',image:x.image||'',imagePage:x.imagePage||'',imageAuthor:x.imageAuthor||'',imageLicense:x.imageLicense||'',imageLicenseUrl:x.imageLicenseUrl||'',lat:x.lat,lng:x.lng,category:x.category,notes:note||''};
      schedule[dayIndex].stops.push([id,'']);
      render();
      if(freeMap) freeMap.panTo({lat:x.lat,lng:x.lng});
      enrichPlaceNames(id, places[id]);
      enrichPlaceImage(id, places[id]);
    }

    /* ---------- Suggestions: pins on the map, details on click ---------- */
    const IDEA_ICON = { food:'🍽️', sight:'🏛️', activity:'🌿' };
    function distM(la1,lo1,la2,lo2){
      const r=x=>x*Math.PI/180, dl=r(la2-la1), dn=r(lo2-lo1);
      const h=Math.sin(dl/2)**2+Math.cos(r(la1))*Math.cos(r(la2))*Math.sin(dn/2)**2;
      return 12742000*Math.asin(Math.sqrt(h));
    }
    function viewRadius(){
      const b = freeMap && freeMap.getBounds(); if(!b) return 1500;
      const c = b.getCenter(), ne = b.getNorthEast();
      return Math.round(Math.min(5000, Math.max(600, distM(c.lat(),c.lng(),ne.lat(),ne.lng())*0.7)));
    }
    function clearIdeas(){
      ideaMarkers.forEach(m=>m.setMap(null)); ideaMarkers = []; ideas = []; ideaCurrent = null;
      if(ideaWindow) ideaWindow.close();
      const btn = document.getElementById('clearIdeasBtn'); if(btn) btn.style.display = 'none';
    }
    function drawIdeas(){
      ideaMarkers.forEach(m=>m.setMap(null)); ideaMarkers = [];
      if(!freeMap) return;
      ideas.forEach(s=>{
        if(!passesFilter(s)) return;
        const m = new google.maps.Marker({
          position:{lat:s.lat,lng:s.lng}, map:freeMap, title:s.name, zIndex:1,
          label:{ text:IDEA_ICON[bucketOf(s)], fontSize:'13px' },
          icon:{ path:google.maps.SymbolPath.CIRCLE, scale:15, fillColor:'#fff', fillOpacity:1, strokeColor:'#e2673f', strokeWeight:2.5 }
        });
        m.addListener('click', ()=>openIdea(s, m));
        ideaMarkers.push(m);
      });
    }
    const ideaDetailsCache = {};
    const hoursLoading = new Set();
    // Same details endpoint/cache used by the map-pin popup, but fetched eagerly
    // per stop so the day list can show that day's hours inline. Only runs once
    // per place (gid) per session — results stay in ideaDetailsCache.
    async function enrichPlaceHours(id, p){
      if(!p.gid || ideaDetailsCache[p.gid] !== undefined || hoursLoading.has(p.gid)) return;
      hoursLoading.add(p.gid);
      try{ ideaDetailsCache[p.gid] = await googlePlaceDetails(p.gid) }
      catch(e){ ideaDetailsCache[p.gid] = null }
      hoursLoading.delete(p.gid);
      if(currentTrip()) updateStopName(id);
    }
    function isAutoNote(n){ if(!n) return true; return ['en','he'].some(l=>['place.added','place.addedNearby'].some(k=>I18N[l] && I18N[l][k]===n)) }
    function ideaFromTrip(id){
      const p = places[id];
      return { tripId:id, id:p.gid||'', name:lang==='he' ? (p.nameHe||p.name) : (p.nameEn||p.name), nameEn:p.nameEn||p.name, title:p.title||'', note:isAutoNote(p.notes) ? '' : p.notes, lat:+p.lat, lng:+p.lng, category:p.category||'place', typeLabel:t('filter.'+bucketOf(p)), image:p.image||'', imagePage:p.imagePage||'', imageAuthor:p.imageAuthor||'', imageLicense:p.imageLicense||'', imageLicenseUrl:p.imageLicenseUrl||'' };
    }
    function closeIdea(){ ideaCurrent = null; if(ideaWindow) ideaWindow.close() }
    // Opens the same details bubble (rating/hours/website) used for map pins,
    // but from a click on the stop itself in the day list — no need to find
    // and click its pin on the map first.
    function showStopHours(id){
      const p = places[id]; if(!p || !coords(id)) return;
      openIdea(ideaFromTrip(id));
      if(freeMap) freeMap.panTo({ lat:+p.lat, lng:+p.lng });
      document.getElementById('map')?.scrollIntoView({ behavior:'smooth', block:'center' });
    }
    // The card fits its content; it only scrolls once it would be taller than the map, so stretching the map gives it more room.
    function sizeIdeaCard(){
      const el = ideaCurrent && ideaCurrent._el, m = document.getElementById('map'); if(!el || !m) return;
      el.style.width = Math.max(240, Math.min(440, m.clientWidth - 80)) + 'px';
      el.style.maxHeight = Math.max(200, m.clientHeight - 110) + 'px';
    }
    let ideaGrowRaf = 0;
    function growIdea(s){
      cancelAnimationFrame(ideaGrowRaf);
      ideaGrowRaf = requestAnimationFrame(()=>{
        if(ideaCurrent !== s || !ideaWindow) return;
        if(s._anchor) ideaWindow.open({map:freeMap, anchor:s._anchor}); else ideaWindow.open({map:freeMap});
      });
    }
    function fillIdeaTop(s){
      const el = s._el; if(!el) return;
      const d = s.details || {};
      const bits = [];
      if(d.rating) bits.push(`★ ${(+d.rating).toFixed(1)}${d.userRatingCount ? ` (${(+d.userRatingCount).toLocaleString(locale())})` : ''}`);
      const open = d.regularOpeningHours && d.regularOpeningHours.openNow;
      if(open === true) bits.push(`<span class="ok">${esc(t('nearby.openNow'))}</span>`);
      else if(open === false) bits.push(`<span class="no">${esc(t('nearby.closedNow'))}</span>`);
      const addr = s.address || d.formattedAddress || '';
      const web = /^https?:\/\//i.test(d.websiteUri||'') ? d.websiteUri : '';
      const hours = (d.regularOpeningHours && d.regularOpeningHours.weekdayDescriptions) || [];
      const gmaps = d.googleMapsUri || `https://www.google.com/maps/search/?api=1&query=${s.lat},${s.lng}${s.id ? '&query_place_id='+encodeURIComponent(s.id) : ''}`;
      const meta = [s.title ? s.name : '', s.typeLabel || s.category].filter(Boolean).join(' · ');
      el.querySelector('.idea-top').innerHTML = `
        ${s.image ? `<img src="${esc(s.image)}" alt="" title="${esc(s.imageAuthor||'Wikimedia Commons')}">` : ''}
        <h4>${esc(s.title || s.name)}</h4>
        <div class="meta">${esc(meta)}</div>
        ${bits.length ? `<div class="row">${bits.join(' · ')}</div>` : (s.id && s.details === undefined ? `<div class="row meta">${esc(t('nearby.loading'))}</div>` : '')}
        ${d.editorialSummary && d.editorialSummary.text ? `<div class="sum">${esc(d.editorialSummary.text)}</div>` : ''}
        ${addr ? `<div class="row meta">${esc(addr)}</div>` : ''}
        ${hours.length ? `<details class="hours"><summary>${esc(t('nearby.hours'))}</summary>${hours.map(h=>`<div>${esc(h)}</div>`).join('')}</details>` : ''}
        <div class="links">${web ? `<a href="${esc(web)}" target="_blank" rel="noopener">${esc(t('nearby.website'))}</a>` : ''}<a href="${esc(s.tripId && places[s.tripId] ? transitUrlForPlace(s.tripId) : transitUrl(s.lat, s.lng, s.id, null))}" target="_blank" rel="noopener">🚌 ${esc(t('nearby.transit'))}</a><a href="${esc(gmaps)}" target="_blank" rel="noopener">${esc(t('nearby.gmaps'))}</a></div>`;
      const im = el.querySelector('.idea-top img');
      if(im){ im.onload = ()=>growIdea(s); im.onerror = ()=>{ im.style.display = 'none' } }
    }
    function ideaCard(s){
      const el = document.createElement('div');
      el.className = 'idea-card'; el.dir = lang==='he' ? 'rtl' : 'ltr';
      el.innerHTML = `<div class="idea-top"></div>
        <div class="idea-edit">
          <input type="text" data-f="title" maxlength="80" placeholder="${esc(t('idea.titlePh'))}">
          <textarea data-f="note" rows="3" maxlength="600" placeholder="${esc(t('idea.notePh'))}"></textarea>
        </div>
        <div class="add-row idea-actions"></div>`;
      const ti = el.querySelector('[data-f="title"]'), no = el.querySelector('[data-f="note"]');
      ti.value = s.title || ''; no.value = s.note || '';
      const sync = ()=>{ s.title = ti.value.trim(); s.note = no.value.trim() };
      ti.oninput = sync; no.oninput = sync;
      const act = el.querySelector('.idea-actions');
      if(s.tripId){
        act.innerHTML = `<button class="add-idea-btn save-btn">${esc(t('idea.save'))}</button><button class="add-idea-btn ghost near-btn">${esc(t('nearby.find'))}</button>`;
        const save = quiet=>{
          sync(); const p = places[s.tripId]; if(!p) return;
          p.title = s.title; p.notes = s.note; persist(); updateStopName(s.tripId); fillIdeaTop(s);
          if(!quiet) toast(t('idea.saved'));
        };
        ti.onchange = ()=>save(true); no.onchange = ()=>save(true);
        el.querySelector('.save-btn').onclick = ()=>save(false);
        el.querySelector('.near-btn').onclick = ()=>{ closeIdea(); nearbyAt(s.lat, s.lng) };
      } else {
        act.innerHTML = `<select></select><button class="add-idea-btn">${esc(t('map.addThisPlace'))}</button>`;
        const sel = act.querySelector('select');
        sel.innerHTML = schedule.map((_,i)=>`<option value="${i}">${esc(t('day',{n:i+1}))}${dayDate(i) ? ' · '+esc(dayDate(i)) : ''}</option>`).join('');
        sel.value = String(Math.min(s.day||0, schedule.length-1));
        sel.onchange = ()=>{ s.day = +sel.value };
        act.querySelector('.add-idea-btn').onclick = ()=>{ sync(); addIdea(s) };
      }
      s._el = el; fillIdeaTop(s);
      return el;
    }
    // Shared details window: suggestion pins, trip pins and clicks on any place of the base map.
    function openIdea(s, marker){
      ideaCurrent = s; s._anchor = marker || null;
      if(infoWindow) infoWindow.close();
      if(!ideaWindow){ ideaWindow = new google.maps.InfoWindow({ maxWidth:640 }); ideaWindow.addListener('closeclick', ()=>{ ideaCurrent = null }) }
      if(s.id && s.details === undefined && ideaDetailsCache[s.id]) s.details = ideaDetailsCache[s.id];
      ideaWindow.setContent(ideaCard(s));
      sizeIdeaCard();
      if(marker) ideaWindow.open({map:freeMap, anchor:marker});
      else { ideaWindow.setPosition({lat:s.lat,lng:s.lng}); ideaWindow.open({map:freeMap}) }
      loadIdeaExtras(s);
    }
    async function loadIdeaExtras(s){
      const refresh = ()=>{ if(ideaCurrent === s){ fillIdeaTop(s); growIdea(s) } };
      if(!s.imageTried){
        s.imageTried = true;
        if(!s.image){
          const tr = currentTrip(), cityHint = (tr && (tr.cityNameEn || tr.cityLabel || tr.name)) || '';
          queueImageLookup(()=>wikimediaImage([s.nameEn||s.name, cityHint].filter(Boolean).join(' '), s.lat, s.lng, {city:false}), true)
            .then(img=>{ if(img && img.url){ Object.assign(s,{ image:img.url, imagePage:img.pageUrl||'', imageAuthor:img.author||'', imageLicense:img.license||'', imageLicenseUrl:img.licenseUrl||'' }); refresh() } })
            .catch(()=>{});
        }
      }
      // older trip places were saved without a Google place id — find it once and remember it
      if(!s.id && s.tripId && !s.lookupTried){
        s.lookupTried = true;
        try{
          const r = await googleTextSearch(s.nameEn || s.name, [s.lat, s.lng]);
          const hit = r.find(x=>x.location && distM(x.location.latitude, x.location.longitude, s.lat, s.lng) < 200);
          if(hit){ s.id = hit.id; if(places[s.tripId]){ places[s.tripId].gid = hit.id; persist() } }
        }catch(e){}
      }
      if(s.id && !s.detailsTried){
        s.detailsTried = true;
        if(ideaDetailsCache[s.id]) s.details = ideaDetailsCache[s.id];
        else { try{ s.details = ideaDetailsCache[s.id] = await googlePlaceDetails(s.id) }catch(e){ s.details = null } }
        refresh();
      } else if(s.details === undefined) { s.details = null; refresh() }
    }
    function addIdea(s){
      const di = Math.min(s.day||0, schedule.length-1);
      addPlace({ gid:s.id, title:s.title||'', name:s.name, image:s.image, imagePage:s.imagePage, imageAuthor:s.imageAuthor, imageLicense:s.imageLicense, imageLicenseUrl:s.imageLicenseUrl, lat:s.lat, lng:s.lng, category:s.category }, di, s.note || t('place.addedNearby'));
      closeIdea();
      ideas = ideas.filter(x=>x!==s); drawIdeas();
    }

    async function nearbyAt(lat,lng,radius=1500){
      try {
        let list;
        try {
          const found = await googleNearby(lat,lng,radius);
          if(!found.length) throw new Error('none');
          list = found.map(x=>({ id:x.id||'', name:x.displayName?.text||'—', typeLabel:x.primaryTypeDisplayName?.text||'', address:x.formattedAddress||'', lat:x.location.latitude, lng:x.location.longitude, category:(x.primaryType||'place').replace(/_/g,' ') }));
        } catch(e){
          const query = `[out:json][timeout:15];(node(around:${radius},${lat},${lng})[tourism];node(around:${radius},${lat},${lng})[amenity~"restaurant|cafe|bar"];node(around:${radius},${lat},${lng})[leisure~"park|garden"];);out 40;`;
          const data = await fetch('https://overpass-api.de/api/interpreter?data=' + encodeURIComponent(query)).then(r=>r.json());
          list = data.elements.filter(x=>x.tags?.name).slice(0,20).map(x=>({ id:'', name:x.tags.name, lat:x.lat, lng:x.lon, category:x.tags.amenity||x.tags.tourism||x.tags.leisure||'place' }));
        }
        // skip places that are already in this trip
        list = list.filter(x=>!Object.keys(places).some(id=>{ const c = coords(id); return c && distM(c[0],c[1],x.lat,x.lng) < 50 }));
        if(!list.length){ toast(t('nearby.none')); return }
        clearIdeas(); ideas = list; drawIdeas();
        document.getElementById('clearIdeasBtn').style.display = '';
        const vb = freeMap.getBounds();
        if(!vb || ideas.some(x=>!vb.contains({lat:x.lat,lng:x.lng}))){
          const b = new google.maps.LatLngBounds(); ideas.forEach(x=>b.extend({lat:x.lat,lng:x.lng})); freeMap.fitBounds(b, 70);
        }
      } catch(e){ toast(t('nearby.error')) }
    }

    document.getElementById('fabBtn').onclick = openImporter;
    document.getElementById('searchBtn').onclick = searchPlaces;
    document.getElementById('placeSearch').addEventListener('keydown', e=>{ if(e.key==='Enter') searchPlaces() });
    document.getElementById('closeBtn').onclick = ()=>{ modal.classList.remove('open'); changePlaceId = null; };
    document.querySelectorAll('.modal').forEach(m=> m.addEventListener('click', e=>{ if(e.target===m) m.classList.remove('open') }));
    // Escape: unwind whatever's frontmost — ruler mode, the details bubble,
    // an open stop editor, a modal, the account menu, then the expanded map —
    // one press always backs out of something rather than doing nothing.
    // Capture phase: when focus is inside the Google Map div, Google's own
    // keydown handling can swallow the bubble-phase event before it reaches
    // document, which is why Escape previously seemed to do nothing there.
    document.addEventListener('keydown', e=>{
      if(e.key !== 'Escape') return;
      if(rulerActive){ toggleRuler(); return }
      if(ideaCurrent){ closeIdea(); return }
      if(editingStop){ closeStopEditor(); return }
      const openModal = document.querySelector('.modal.open');
      if(openModal){ openModal.classList.remove('open'); changePlaceId = null; return }
      const menu = document.querySelector('.user-menu.open');
      if(menu){ menu.classList.remove('open'); return }
      const wrap = tripMapWrap();
      if(wrap?.classList.contains('expanded')){ wrap.classList.remove('expanded'); document.getElementById('mapExpandBtn').textContent = t('map.expand'); setTimeout(afterMapResize, 50) }
    }, true);

    /* ---------- Backup, import, share ---------- */
    function b64encode(obj){ return btoa(String.fromCharCode(...new TextEncoder().encode(JSON.stringify(obj)))) }
    function b64decode(str){ return JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(str), c=>c.charCodeAt(0)))) }

    document.getElementById('exportBtn').onclick = ()=>{
      const blob = new Blob([JSON.stringify({ app:'roam', version:2, exported:new Date().toISOString(), trips }, null, 2)], {type:'application/json'});
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'roam-backup-' + new Date().toISOString().slice(0,10) + '.json';
      a.click(); URL.revokeObjectURL(a.href);
      toast(t('toast.exported'));
    };
    document.getElementById('importFileBtn').onclick = ()=>document.getElementById('importFile').click();
    document.getElementById('importFile').onchange = async e=>{
      const file = e.target.files[0]; if(!file) return;
      try {
        const data = JSON.parse(await file.text());
        const incoming = Array.isArray(data) ? data : data.trips;
        if(!Array.isArray(incoming)) throw new Error('bad');
        if(!confirm(t('confirm.importFile',{n:incoming.length}))) return;
        incoming.forEach(tr=>{ tr.id = 'trip' + Date.now() + Math.floor(Math.random()*1000); trips.push(normaliseTrip(tr)) });
        saveTrips(); renderHome(); toast(t('toast.imported'));
      } catch(err){ toast(t('toast.badFile')) }
      e.target.value = '';
    };
    document.getElementById('shareBtn').onclick = async ()=>{
      const trip=currentTrip(); if(!trip) return;
      if(!firebaseUser){ document.getElementById('authModal').classList.add('open'); document.getElementById('authStatus').style.display='block'; document.getElementById('authStatus').textContent=t('auth.need'); return; }
      document.getElementById('shareStatus').textContent = trip.sharedId ? t('share.existing') : t('share.ready');
      document.getElementById('shareModal').classList.add('open');
    };
    async function createOrCopySharedTrip(){
      const trip=currentTrip(); if(!trip || !firebaseUser || !firebaseReady) return;
      if(trip.sharedId){ return copySharedLink(trip.sharedId); }
      const id='trip_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,8);
      const role=document.getElementById('shareRole').value || 'editor';
      try{
        const ref=firestore.doc(firestore.db,'sharedTrips',id);
        await firestore.setDoc(ref,{name:trip.name,cityNameHe:trip.cityNameHe||'',cityNameEn:trip.cityNameEn||'',cityImage:trip.cityImage||'',startDate:trip.startDate||'',note:trip.note||'',places:trip.places||{},schedule:prepareScheduleForCloud(trip.schedule),center:trip.center||null,viewport:trip.viewport||null,cityLabel:trip.cityLabel||'',cities:trip.cities||[],packing:trip.packing||[],travelMode:trip.travelMode||'foot',owner:firebaseUser.uid,members:{[firebaseUser.uid]:'owner'},createdAt:firestore.serverTimestamp(),updatedAt:firestore.serverTimestamp(),updatedBy:firebaseUser.uid},{merge:false});
        trip.sharedId=id; trip.sharedRole='owner'; trip.sharedOwner=firebaseUser.uid; saveTrips();
        document.getElementById('shareModal').classList.remove('open');
        await copySharedLink(id); subscribeToSharedTrip(trip);
      }catch(e){ console.error(e); document.getElementById('shareStatus').textContent=t('share.loginFirst'); }
    }
    async function copySharedLink(id, role){
      const selectedRole = role || document.getElementById('shareRole')?.value || 'editor';
      const link=location.origin+location.pathname+'#shared='+encodeURIComponent(id)+'&role='+encodeURIComponent(selectedRole);
      try{ await navigator.clipboard.writeText(link); toast(t('share.created')); }
      catch(e){ location.hash='shared='+encodeURIComponent(id); toast(t('toast.copyFail')); }
    }
    async function subscribeToSharedTrip(trip){
      if(!firebaseReady || !firebaseUser || !trip?.sharedId) return;
      if(firebaseUnsub) firebaseUnsub();
      const ref=firestore.doc(firestore.db,'sharedTrips',trip.sharedId);
      firebaseUnsub=firestore.onSnapshot(ref,(snap)=>{
        if(!snap.exists()) return;
        const d=snap.data(); const local=currentTrip(); if(!local || local.sharedId!==trip.sharedId) return;
        suppressCloudSave=true;
        Object.assign(local,{name:d.name||local.name,cityNameHe:d.cityNameHe||local.cityNameHe||'',cityNameEn:d.cityNameEn||local.cityNameEn||'',cityImage:d.cityImage||local.cityImage||'',startDate:d.startDate||'',note:d.note||'',places:d.places||{},schedule:normaliseTrip({schedule:d.schedule}).schedule,center:d.center||null,viewport:d.viewport||null,cityLabel:d.cityLabel||'',cities:d.cities||local.cities||[],packing:d.packing||[],travelMode:d.travelMode||'foot',sharedOwner:d.owner||local.sharedOwner,sharedRole:d.members?.[firebaseUser.uid]||local.sharedRole||'viewer'});
        places=local.places; schedule=local.schedule; saveTrips(); suppressCloudSave=false;
        setSyncState(snap.metadata.hasPendingWrites?'pending':'synced'); renderHome(); renderOpenTripIfChanged(local);
      },(err)=>{console.error('shared trip sync',err); setSyncState(navigator.onLine?'pending':'offline');});
    }
    async function openSharedFromHash(id, requestedRole='editor'){
      if(!firebaseUser || !firebaseReady){ document.getElementById('authModal').classList.add('open'); document.getElementById('authStatus').style.display='block'; document.getElementById('authStatus').textContent=t('share.loginFirst'); return; }
      try{
        const ref=firestore.doc(firestore.db,'sharedTrips',id); const snap=await firestore.getDoc(ref);
        if(!snap.exists()){ toast('Shared trip not found'); return; }
        const d=snap.data();
        const role=d.members?.[firebaseUser.uid] || (requestedRole==='viewer' ? 'viewer' : 'editor');
        if(!d.members?.[firebaseUser.uid]){
          await firestore.setDoc(ref,{members:{[firebaseUser.uid]:role},updatedAt:firestore.serverTimestamp()},{merge:true});
        }
        const local={id:'trip_'+Date.now(),name:d.name||'Shared trip',cityNameHe:d.cityNameHe||'',cityNameEn:d.cityNameEn||'',cityImage:d.cityImage||'',startDate:d.startDate||'',note:d.note||'',places:d.places||{},schedule:d.schedule||[{date:'',stops:[]}],center:d.center||null,viewport:d.viewport||null,cityLabel:d.cityLabel||d.name||'',cities:d.cities||[],packing:d.packing||[],travelMode:d.travelMode||'foot',sharedId:id,sharedRole:role,sharedOwner:d.owner||null};
        trips.push(normaliseTrip(local)); saveTrips(); history.replaceState(null,'',location.pathname); renderHome(); openTrip(local.id); toast(t('share.opened'));
      }catch(e){console.error(e); toast(t('share.loginFirst'));}
    }
    function importFromHash(){
      const shared=location.hash.match(/#shared=([^&]+)(?:&role=([^&]+))?$/); if(shared){ openSharedFromHash(decodeURIComponent(shared[1]), decodeURIComponent(shared[2]||'editor')); return; }
      const m=location.hash.match(/#trip=(.+)$/); if(!m) return;
      try { const trip=b64decode(decodeURIComponent(m[1])); history.replaceState(null,'',location.pathname); trip.id='trip'+Date.now(); trips.push(normaliseTrip(trip)); saveTrips(); renderHome(); openTrip(trip.id); } catch(e){ console.info('bad share link', e) }
    }

    /* ---------- Language wiring ---------- */
    function applyLang(){
      document.documentElement.lang = lang;
      document.documentElement.dir = lang === 'he' ? 'rtl' : 'ltr';
      localStorage.setItem('roam-lang', lang);
      document.querySelectorAll('[data-i18n]').forEach(el=> el.textContent = t(el.dataset.i18n));
      document.querySelectorAll('[data-i18n-ph]').forEach(el=> el.placeholder = t(el.dataset.i18nPh));
      setDays(selectedTripDays);
      document.getElementById('langBtn').textContent = t('lang.switch');
      document.getElementById('exportBtn').textContent = t('export');
      document.getElementById('importFileBtn').textContent = t('import');
      updateAuthButton();
      updateOverlayBtn();
      renderHome();
      if(currentTripId){ renderTripHeader(); render(); renderPacking(); loadWeather() }
      if(worldMap) redrawWorldMap();
    }
    document.getElementById('langBtn').onclick = ()=>{ lang = lang === 'he' ? 'en' : 'he'; applyLang() };

    /* ---------- Night mode toggle ---------- */
    let theme = localStorage.getItem('roam-theme') || ((window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light');
    function applyTheme(){
      document.documentElement.dataset.theme = theme;
      const btn = document.getElementById('themeBtn'); if(btn) btn.textContent = theme === 'dark' ? '☀️' : '🌙';
      applyMapTheme();
    }
    document.getElementById('themeBtn').onclick = ()=>{ theme = theme === 'dark' ? 'light' : 'dark'; localStorage.setItem('roam-theme', theme); applyTheme() };
    applyTheme();

    /* ---------- Maps loader (key from CONFIG) ---------- */
    window.googleMapsReady = new Promise(resolve=>{ window._resolveGoogleMaps = resolve });
    window.initGoogleMaps = function(){ mapsOk = true; window._resolveGoogleMaps() };
    window.gm_authFailure = function(){ mapsOk = false; window.mapLoadFailed('auth') };
    (function loadMaps(){
      const key = CONFIG.mapsScriptKey || CONFIG.googleKey;
      if(!key){ mapsOk = false; window._resolveGoogleMaps(); setTimeout(()=>window.mapLoadFailed('nokey'),0); return }
      const s = document.createElement('script');
      s.src = 'https://maps.googleapis.com/maps/api/js?key=' + encodeURIComponent(key) + '&libraries=places,geometry&loading=async&callback=initGoogleMaps';
      s.async = true; s.defer = true;
      s.onerror = ()=>{ mapsOk = false; window._resolveGoogleMaps(); window.mapLoadFailed() };
      document.head.appendChild(s);
    })();

    /* ---------- Firebase collaboration ---------- */
    async function initFirebase(){
      try{
        const appMod=await import('https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js');
        const authMod=await import('https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js');
        const fireMod=await import('https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js');
        firebaseApp=appMod.initializeApp(FIREBASE_CONFIG);
        firebaseAuth=authMod.getAuth(firebaseApp);
        let db;
        try{ db=fireMod.getFirestore(firebaseApp); await fireMod.enableMultiTabIndexedDbPersistence(db).catch(()=>{}); }
        catch(e){ db=fireMod.getFirestore(firebaseApp); }
        firestore={db,doc:fireMod.doc,getDoc:fireMod.getDoc,setDoc:fireMod.setDoc,updateDoc:fireMod.updateDoc,deleteDoc:fireMod.deleteDoc,runTransaction:fireMod.runTransaction,onSnapshot:fireMod.onSnapshot,serverTimestamp:fireMod.serverTimestamp};
        firebaseReady=true;
        authMod.onAuthStateChanged(firebaseAuth, async u=>{
          firebaseUser=u; updateAuthButton();
          if(u){
            await syncAccountTrips();
            if(location.hash.startsWith('#shared=')) importFromHash();
            const trip=currentTrip(); if(trip?.sharedId) subscribeToSharedTrip(trip);
          } else {
            unsubscribeAccountTrips();
          }
        });
      }catch(e){ console.info('Firebase unavailable; local mode',e); firebaseReady=false; updateAuthButton(); }
    }
    function updateAuthButton(){
      const b=document.getElementById('authBtn'); if(!b) return;
      const name=document.getElementById('userMenuName'), email=document.getElementById('userMenuEmail'), status=document.getElementById('userMenuStatus'), action=document.getElementById('userMenuAction');
      b.innerHTML='';
      if(firebaseUser){
        if(firebaseUser.photoURL){ const img=document.createElement('img'); img.src=firebaseUser.photoURL; img.alt=''; b.appendChild(img); }
        else b.textContent=(firebaseUser.displayName||firebaseUser.email||'U').trim().charAt(0).toUpperCase() || 'U';
        name.textContent=firebaseUser.displayName || t('auth.profile');
        email.textContent=firebaseUser.email || '';
        action.textContent=t('auth.logout');
      }else{
        b.textContent='♙'; name.textContent=t('auth.profile'); email.textContent=''; action.textContent=t('auth.open');
      }
      setSyncState(firebaseUser ? 'synced' : 'offline');
    }
    async function authAction(mode){
      if(!firebaseReady){ document.getElementById('authStatus').style.display='block'; document.getElementById('authStatus').textContent=t('auth.offline'); return; }
      const email=document.getElementById('authEmail').value.trim(), password=document.getElementById('authPassword').value;
      try{
        if(mode==='login') await authModSignIn(email,password);
        else if(mode==='register') await authModRegister(email,password);
        document.getElementById('authModal').classList.remove('open');
      }catch(e){ document.getElementById('authStatus').style.display='block'; document.getElementById('authStatus').textContent=e?.message||t('auth.bad'); }
    }
    let authModSignIn,authModRegister,authModGoogle,authModSignOut;
    async function loadAuthFns(){
      if(!firebaseReady) return;
      const m=await import('https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js');
      authModSignIn=(e,p)=>m.signInWithEmailAndPassword(firebaseAuth,e,p);
      authModRegister=(e,p)=>m.createUserWithEmailAndPassword(firebaseAuth,e,p);
      authModGoogle=()=>m.signInWithPopup(firebaseAuth,new m.GoogleAuthProvider());
      authModSignOut=()=>m.signOut(firebaseAuth);
    }
    const userMenu=document.getElementById('userMenu'), userMenuWrap=document.getElementById('userMenuWrap');
    function toggleUserMenu(){ const open=userMenu.classList.toggle('open'); document.getElementById('authBtn').setAttribute('aria-expanded',String(open)); }
    document.getElementById('authBtn').onclick=(e)=>{ e.stopPropagation(); toggleUserMenu(); };
    document.getElementById('userMenuAction').onclick=async()=>{ if(firebaseUser){ await authModSignOut?.(); userMenu.classList.remove('open'); } else { userMenu.classList.remove('open'); document.getElementById('authModal').classList.add('open'); } };
    document.addEventListener('click',e=>{ if(!userMenuWrap.contains(e.target)) userMenu.classList.remove('open') });
    document.getElementById('authLoginBtn').onclick=()=>authAction('login');
    document.getElementById('authRegisterBtn').onclick=()=>authAction('register');
    document.getElementById('authGoogleBtn').onclick=async()=>{ try{ await authModGoogle?.(); document.getElementById('authModal').classList.remove('open'); }catch(e){ document.getElementById('authStatus').style.display='block'; document.getElementById('authStatus').textContent=e?.message||t('auth.bad'); } };
    document.getElementById('authCloseBtn').onclick=()=>document.getElementById('authModal').classList.remove('open');
    document.getElementById('shareCloseBtn').onclick=()=>document.getElementById('shareModal').classList.remove('open');
    document.getElementById('shareCreateBtn').onclick=createOrCopySharedTrip;
    window.addEventListener('online',()=>{ setSyncState(firebaseUser?'pending':'offline'); queueCloudTripSave(); queueUserTripsSave(); });
    window.addEventListener('offline',()=>setSyncState('offline'));

    /* ---------- Boot ---------- */
    loadDeletedTripIds();
    loadTrips();
    trips = filterDeletedTrips(trips, deletedTripIds);
    applyLang();
    initFirebase().then(loadAuthFns).then(()=>importFromHash());
  </script>
</body>
</html>
