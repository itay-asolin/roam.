<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#1f3b34" />
  <title>Roam — trip planner</title>
  <link rel="icon" id="favicon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2216%22%20fill%3D%22%231f3b34%22%2F%3E%3Ctext%20x%3D%2213%22%20y%3D%2247%22%20font-family%3D%22Georgia%2Cserif%22%20font-size%3D%2244%22%20font-weight%3D%22700%22%20fill%3D%22%23f6f4ef%22%3Er%3C%2Ftext%3E%3Ccircle%20cx%3D%2244%22%20cy%3D%2243%22%20r%3D%226%22%20fill%3D%22%23e2673f%22%2F%3E%3C%2Fsvg%3E" />
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2216%22%20fill%3D%22%231f3b34%22%2F%3E%3Ctext%20x%3D%2213%22%20y%3D%2247%22%20font-family%3D%22Georgia%2Cserif%22%20font-size%3D%2244%22%20font-weight%3D%22700%22%20fill%3D%22%23f6f4ef%22%3Er%3C%2Ftext%3E%3Ccircle%20cx%3D%2244%22%20cy%3D%2243%22%20r%3D%226%22%20fill%3D%22%23e2673f%22%2F%3E%3C%2Fsvg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..700;1,400..600&family=Suez+One&display=swap" rel="stylesheet">
  <style>
    :root{
      --ink:#15231f; --muted:#6a746e; --paper:#f6f4ef; --cream:#ebe8df; --line:#dcdcd2;
      --moss:#1f3b34; --orange:#e2673f; --sun:#f0c04b; --radius:20px;
      --display:'Suez One',Georgia,serif; --ui:'Rubik',system-ui,sans-serif;
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--ui);font-weight:400;-webkit-text-size-adjust:100%}
    button,input,select,textarea{font:inherit;color:inherit}
    input[type="date"]{cursor:pointer}
    input[type="date"]::-webkit-calendar-picker-indicator{cursor:pointer;opacity:.55;padding:4px;border-radius:7px;transition:opacity .15s,background .15s}
    input[type="date"]::-webkit-calendar-picker-indicator:hover{opacity:1;background:var(--cream)}
    button{cursor:pointer}
    h1,h2,h3,.brand,.stat b{font-family:var(--display);font-weight:400;letter-spacing:-.01em}
    :focus-visible{outline:2px solid var(--moss);outline-offset:2px}
    .shell{max-width:1400px;margin:auto;padding:0 40px 48px}
    header{height:84px;display:flex;align-items:center;justify-content:space-between;gap:12px}
    .brand{font-size:27px;direction:ltr}.brand span{color:var(--orange)}
    .head-tools{display:flex;gap:8px;flex-wrap:wrap}
    .trip-hero{background-size:cover;background-position:center;background-repeat:no-repeat}
    .hero{min-height:260px;background:linear-gradient(90deg,rgba(15,30,25,.62),rgba(15,30,25,.08)),url('https://images.unsplash.com/photo-1500835556837-99ac94a94552?auto=format&fit=crop&w=1800&q=85') center/cover;border-radius:var(--radius);padding:36px 40px;color:#fff;position:relative;overflow:hidden}
    html[dir="rtl"] .hero{background:linear-gradient(270deg,rgba(15,30,25,.62),rgba(15,30,25,.08)),url('https://images.unsplash.com/photo-1500835556837-99ac94a94552?auto=format&fit=crop&w=1800&q=85') center/cover}
    .eyebrow{font-size:12px;opacity:.85;letter-spacing:.04em;text-shadow:0 1px 8px rgba(0,0,0,.45)}
    .hero h1{font-size:44px;line-height:1.08;margin:14px 0 10px;text-shadow:0 2px 14px rgba(0,0,0,.5)}
    .hero p{margin:0;opacity:.88;font-size:15px;max-width:52ch;line-height:1.5;text-shadow:0 1px 8px rgba(0,0,0,.45)}
    .hero-side{position:absolute;inset-inline-end:40px;bottom:34px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
    .datefield{display:flex;align-items:center;gap:8px;padding:10px 14px;background:rgba(255,255,255,.14);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.28);border-radius:99px;font-size:13px}
    .datefield input{background:none;border:0;color:#fff;font-size:13px;width:140px}
    .datefield input::-webkit-calendar-picker-indicator{filter:invert(1);opacity:.8}
    .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin:22px 0 32px}
    .stat{background:var(--paper);padding:16px 18px}.stat b{display:block;font-size:22px}.stat span{color:var(--muted);font-size:12px}
    .section-head{display:flex;align-items:end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin:0 0 16px}
    .section-head h2{font-size:26px;margin:0}.section-head p{margin:0;color:var(--muted);font-size:13px}
    .btn{border:0;border-radius:10px;padding:11px 15px;font-weight:500;font-size:13px;background:var(--ink);color:#fff}
    .btn.light{background:#fff;color:var(--ink);border:1px solid var(--line)}.btn.light:hover{background:var(--cream)}
    .btn.orange{background:var(--orange);color:#fff}.btn.danger{color:#b23b2f}
    .destinations{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px;margin:0 0 40px}
    .dest-card{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;cursor:pointer;min-width:0}
    .dest-card-media{height:145px;background:linear-gradient(135deg,#d9e0d6,#bfc9c0) center/cover no-repeat;position:relative}
    .dest-card-media.no-image::after{content:'🌍';position:absolute;inset:0;display:grid;place-items:center;font-size:42px;opacity:.35}
    .dest-card-body{padding:16px;display:flex;flex-direction:column;gap:7px;min-height:155px}
    .dest-card h3{margin:0;font-size:20px}.dest-card small{color:var(--muted)}
    .en-name{color:var(--muted);font-weight:400;font-size:.62em;white-space:nowrap;font-family:var(--ui);letter-spacing:0}
    .city-alt-name{margin-top:6px;font-size:12.5px;color:var(--muted)}
    .hero .en-name{color:rgba(255,255,255,.75)}
    .dest-meta{display:flex;gap:14px;color:var(--muted);font-size:12px}.dest-actions{display:flex;gap:8px;margin-top:auto;flex-wrap:wrap}
    .days-stepper{display:flex;align-items:center;justify-content:center;gap:18px;background:var(--cream);border:1px solid var(--line);border-radius:14px;padding:10px 14px}
    .days-step-btn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:19px;font-weight:600;color:var(--ink);display:grid;place-items:center;line-height:1}
    .days-step-btn:hover{background:var(--moss);border-color:var(--moss);color:#fff}
    .days-step-btn:active{transform:scale(.94)}
    .days-step-btn:disabled{opacity:.35;pointer-events:none}
    .days-value{min-width:88px;text-align:center;font-size:18px;font-weight:600;white-space:nowrap}
    .empty-state{border:1px dashed var(--line);border-radius:16px;padding:40px;text-align:center;color:var(--muted)}
    .mapwrap{border-radius:var(--radius);overflow:hidden;border:1px solid var(--line);background:#d9e0d6;height:410px;position:relative;z-index:0;transition:height .2s,position .2s}.mapwrap.expanded{position:fixed;inset:14px;z-index:50;height:auto;border-radius:18px;box-shadow:0 20px 60px #15231f55}.mapwrap.expanded .map{height:100%}
    .map{width:100%;height:100%}
    .map-label{position:absolute;bottom:16px;inset-inline-start:18px;background:#fffdf9ee;padding:10px 13px;border-radius:9px;font-size:12px;box-shadow:0 5px 20px #17201c15;z-index:1;max-width:70%;line-height:1.45}
    .map-toolbar{position:absolute;z-index:7;top:13px;inset-inline-start:13px;display:flex;gap:6px;flex-wrap:wrap;max-width:calc(100% - 26px)}
    .map-toolbar button{border:0;background:#fff;border-radius:9px;padding:9px 11px;font-size:12px;font-weight:500;box-shadow:0 2px 8px #17201c1f}.map-expand{margin-inline-start:auto}
    .layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:26px;margin-top:38px}
    .days{display:grid;gap:15px}.day{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff}
    .daytop{display:flex;align-items:center;gap:10px;padding:13px 15px;border-bottom:1px solid var(--line);flex-wrap:wrap}
    .daynum{display:grid;place-items:center;width:30px;height:30px;border-radius:9px;font-size:12px;font-weight:600}
    .daytop strong{font-size:14px;font-weight:600}.daytop .dd{color:var(--muted);font-size:12px}
    .day-tools{margin-inline-start:auto;display:flex;gap:6px;flex-wrap:wrap}
    .icon-btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 10px;font-size:12px;color:var(--muted)}.icon-btn:hover{background:var(--cream);color:var(--ink)}
    .stops{padding:10px;min-height:52px}
    .stop{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;border-radius:11px;padding:10px;cursor:grab}
    .stop:hover{background:var(--cream)}.handle{color:#b3b9b3;font-size:17px}
    .stop-main{display:flex;align-items:center;gap:12px;min-width:0}.stop-thumb{width:72px;height:72px;object-fit:cover;border-radius:11px;flex:0 0 72px}.stop-thumb-empty{display:grid;place-items:center;background:#f1efe8;color:#8a938b;font-size:24px}.stop-copy{min-width:0}.stop b{font-size:13.5px;font-weight:500;display:block}.stop small{color:var(--muted);font-size:11.5px}
    .thumb-wrap{position:relative}
    .thumb-swap{position:absolute;top:3px;inset-inline-end:3px;width:20px;height:20px;border-radius:50%;border:0;background:rgba(21,35,31,.65);color:#fff;font-size:11px;display:grid;place-items:center;padding:0;line-height:1;opacity:0;transition:opacity .15s;z-index:2}
    .stop:hover .thumb-swap,.thumb-swap:focus-visible{opacity:1}
    .hero-swap{border:0;background:rgba(255,255,255,.16);backdrop-filter:blur(6px);color:#fff;border-radius:99px;padding:8px 13px;font-size:12.5px;cursor:pointer}
    .hero-swap:hover{background:rgba(255,255,255,.28)}
    .stop-tools{display:flex;gap:6px;align-items:center}
    .stop-tools select{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 7px;font-size:11.5px;color:var(--muted)}
    .tag{font-size:10.5px;padding:5px 8px;border-radius:99px;background:#f1efe8;color:#626b64}
    .travel{margin:0 0 0 38px;color:var(--muted);font-size:11.5px;padding-inline-start:12px;border-inline-start:1px dashed #bcc3bc;min-height:18px;line-height:18px}
    html[dir="rtl"] .travel{margin:0 38px 0 0}
    .day-empty{color:var(--muted);font-size:12px;padding:12px 10px}
    .sidebar{display:grid;gap:16px;align-content:start}
    .card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px}.card h3{font-size:17px;margin:0 0 12px}
    .wx-row{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--cream);font-size:12.5px}
    .wx-row:last-child{border-bottom:0}.wx-row .ic{font-size:20px}.wx-row .d{color:var(--muted);flex:1}.wx-row b{font-weight:600}
    .wx-note{color:var(--muted);font-size:11.5px;margin-top:8px;line-height:1.45}
    .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
    .chip{border:1px dashed #c3ccbf;background:#f1f5ee;color:#33513f;border-radius:99px;padding:6px 10px;font-size:11.5px}
    .chip:hover{background:#e6eee2}
    .check{display:grid;gap:8px}
    .check label{display:flex;gap:9px;align-items:center;color:var(--muted);font-size:12.5px}
    .check input[type=checkbox]{accent-color:var(--moss);width:16px;height:16px}
    .check .del{margin-inline-start:auto;border:0;background:none;color:#b0b6b0;font-size:13px}.check .del:hover{color:#b23b2f}
    .add{width:100%;background:none;border:1px dashed #bfc4ba;padding:10px;border-radius:9px;color:var(--moss);font-size:12px;margin-top:12px}
    #tripNote{width:100%;min-height:104px;resize:vertical;border:1px solid var(--line);border-radius:10px;padding:11px;font-size:13px;line-height:1.5;background:var(--paper)}
    .filters{display:flex;gap:7px;flex-wrap:wrap}
    .filter{border:1px solid var(--line);background:#fff;border-radius:99px;padding:7px 12px;color:var(--muted);font-size:12px}
    .filter.active{color:#fff;background:var(--moss);border-color:var(--moss)}
    .fab{position:fixed;inset-inline-end:22px;bottom:22px;width:56px;height:56px;border:0;background:var(--orange);color:#fff;border-radius:50%;font-size:26px;box-shadow:0 8px 22px #c2523560;z-index:6}
    .modal{position:fixed;inset:0;background:#15231fb0;display:none;z-index:10;align-items:center;justify-content:center;padding:18px}
    .modal.open{display:flex}
    .modal-box{background:var(--paper);width:min(620px,100%);border-radius:18px;padding:24px;max-height:90vh;overflow:auto}
    .modal h2{font-size:25px;margin:0 0 6px}.modal p{color:var(--muted);font-size:13px;line-height:1.5}
    .modal input,.modal select{width:100%;border:1px solid var(--line);background:#fff;border-radius:10px;padding:11px 12px}
    .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px;flex-wrap:wrap}
    .field{display:grid;gap:6px;margin-bottom:14px;position:relative}.field label{font-size:12px;color:var(--muted)}
    .wheel-wrap{display:flex;align-items:center;gap:10px}
    .wheel-step{width:38px;height:38px;border:1px solid var(--line);background:#fff;border-radius:11px;font-size:18px;line-height:1;color:var(--muted);flex:none}
    .wheel-step:hover{background:var(--cream);color:var(--ink)}
    .wheel{position:relative;flex:1;height:132px;border:1px solid var(--line);background:#fff;border-radius:13px;overflow:hidden}
    .wheel-band{position:absolute;inset-inline:6px;top:44px;height:44px;border-radius:9px;background:#eaf0e6;border:1px solid #c5d2bd;pointer-events:none}
    .wheel-fade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(#fff 0%,#fff0 34%,#fff0 66%,#fff 100%)}
    .wheel-scroll{position:relative;height:100%;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none;padding:44px 0;text-align:center}
    .wheel-scroll::-webkit-scrollbar{display:none}
    .wheel-opt{height:44px;line-height:44px;scroll-snap-align:start;font-size:14px;color:var(--muted);cursor:pointer;transition:color .15s,font-weight .15s}
    .wheel-opt.on{color:var(--moss);font-weight:600;font-size:15px}
    .suggest{position:absolute;top:100%;inset-inline-start:0;width:100%;background:#fff;border:1px solid var(--line);border-radius:12px;margin-top:4px;z-index:3;overflow:hidden;box-shadow:0 10px 30px #15231f22}
    .suggest button{display:block;width:100%;text-align:start;border:0;background:none;padding:10px 12px;font-size:13px}
    .suggest button:hover{background:var(--cream)}.suggest small{color:var(--muted);display:block;font-size:11.5px}
    .mini-form{display:grid;grid-template-columns:1fr auto;gap:8px;margin:12px 0}.mini-form input{min-width:0}
    .hint{background:#eef3ea;color:#3d5a45;padding:10px 12px;border-radius:9px;font-size:12px;line-height:1.45;margin-top:11px}
    .warn{background:#fdf0e9;color:#94432a;padding:10px 12px;border-radius:9px;font-size:12px;line-height:1.45;margin:12px 0}
        .search-place-result{display:flex;align-items:center;gap:10px;width:100%}.search-place-result img{width:42px;height:42px;border-radius:8px;object-fit:cover;flex:0 0 auto}
.nearby-list{max-height:180px;overflow:auto;margin-top:10px;padding-top:8px;border-top:1px solid var(--line)}
    .nearby-list button{display:block;width:100%;text-align:start;border:0;background:none;padding:6px 0;color:var(--moss);font-size:12px}
    .day-legend{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
    .day-chip{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border:1px solid var(--line);background:#fff;border-radius:99px;font-size:11.5px;color:var(--muted)}
    .day-chip i{width:9px;height:9px;border-radius:50%;display:block}
    .toast{position:fixed;inset-inline:0;bottom:26px;margin:auto;width:max-content;max-width:90vw;background:var(--ink);color:#fff;padding:11px 16px;border-radius:99px;font-size:13px;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none}
    .toast.show{opacity:1}
    .sync-pill{display:inline-flex;align-items:center;gap:6px;padding:8px 11px;border:1px solid var(--line);background:#fff;border-radius:99px;color:var(--muted);font-size:11.5px}
    .sync-dot{width:7px;height:7px;border-radius:50%;background:#b7beb8}.sync-dot.online{background:#4f8b62}.sync-dot.pending{background:var(--orange)}
    .member-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--cream);font-size:12px}.member-row:last-child{border-bottom:0}
    .user-menu-wrap{position:relative;display:inline-flex;align-items:center}.user-avatar{width:38px;height:38px;border:1px solid var(--line);border-radius:50%;background:#fff;display:grid;place-items:center;padding:0;overflow:hidden;color:var(--moss);font-size:17px;font-weight:600}.user-avatar img{width:100%;height:100%;object-fit:cover;display:block}.user-menu{position:absolute;top:calc(100% + 8px);inset-inline-end:0;width:240px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:0 12px 35px #15231f22;z-index:15;display:none;text-align:start}.user-menu.open{display:block}.user-menu-name{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.user-menu-email{font-size:11px;color:var(--muted);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.user-menu-status{margin:12px 0;padding:9px 10px;border-radius:9px;background:var(--cream);font-size:11.5px;color:var(--muted)}.user-menu .btn{width:100%;margin-top:7px}

    @media(max-width:750px){
      .shell{padding:0 15px 34px}header{height:66px}.hero{padding:26px 22px}.hero h1{font-size:32px}
      .hero-side{position:static;margin-top:16px}.stats{grid-template-columns:repeat(3,1fr)}.stat{padding:12px}.stat b{font-size:18px}
      .mapwrap{height:340px}.layout{grid-template-columns:1fr;gap:22px}.sidebar{grid-template-columns:1fr}
      .section-head p{display:none}.stop{cursor:default}.handle{display:none}
      .stop{grid-template-columns:1fr auto}.travel{margin-inline-start:12px}
      .btn,.icon-btn{padding:11px 13px}
      html[dir="rtl"] body{direction:rtl} html[dir="rtl"] .head-tools{direction:rtl} html[dir="rtl"] .section-head,html[dir="rtl"] .daytop,html[dir="rtl"] .wx-row,html[dir="rtl"] .dest-meta,html[dir="rtl"] .dest-actions{direction:rtl} html[dir="rtl"] .modal-box,html[dir="rtl"] input,html[dir="rtl"] textarea,html[dir="rtl"] select{direction:rtl} html[dir="rtl"] .modal-actions{justify-content:flex-start}
    }
    @media(max-width:420px){.hero h1{font-size:28px}}
    @media print{.map-toolbar,.fab,.filters,.day-tools,.stop-tools,.head-tools,.section-head .btn,#backHomeBtn,.add,.chips{display:none!important}.mapwrap{height:280px}.layout{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div class="brand">roam<span>.</span></div>
      <div class="head-tools">
        <button class="btn light" id="exportBtn"></button>
        <button class="btn light" id="importFileBtn"></button>
        <button class="btn light" id="langBtn">עברית</button>
        <div class="user-menu-wrap" id="userMenuWrap">
          <button class="user-avatar" id="authBtn" type="button" aria-label="Account" aria-expanded="false">♙</button>
          <div class="user-menu" id="userMenu">
            <div class="user-menu-name" id="userMenuName"></div>
            <div class="user-menu-email" id="userMenuEmail"></div>
            <div class="user-menu-status" id="userMenuStatus"></div>
            <button class="btn light" id="userMenuAction" type="button"></button>
          </div>
        </div>
      </div>
    </header>

    <section id="homeView">
      <section class="hero">
        <div class="eyebrow" data-i18n="home.eyebrow"></div>
        <h1 data-i18n="home.title"></h1>
        <p data-i18n="home.sub"></p>
        <div class="hero-side"><button class="btn orange" id="newTripHeroBtn" data-i18n="home.new"></button></div>
      </section>
      <div class="section-head" style="margin-top:32px"><div><h2 data-i18n="home.listTitle"></h2><p data-i18n="home.listSub"></p></div></div>
      <div class="destinations" id="destinations"></div>
    </section>

    <section id="tripView" style="display:none">
      <button class="btn light" id="backHomeBtn" style="margin-bottom:18px" data-i18n="trip.back"></button>

    async function wikipediaFallbackImage(query, exclude){

    async function wikimediaImage(query, lat, lng, options={}){
      const cityMode=!!options.city;
      const exclude=options.exclude||null;
      const imgWidth = cityMode ? 1800 : 1000;
      const badWords=/\b(flag|flags|drapeau|fahne|bandiera|coat of arms|arms of|heraldry|heraldic|logo|logos|map|maps|locator map|symbol|emblem|seal)\b/i;
      const skylineWords=/\b(skyline|cityscape|panorama|panoramic|aerial view|city view|night view)\b/i;
      const placeWords=/\b(exterior|facade|building|landmark|monument|entrance|front)\b/i;
      const clean=v=>{ const x=v?.value; return typeof x==='string' ? x.replace(/<[^>]*>/g,' ').replace(/&[^;]+;/g,' ').replace(/\s+/g,' ').trim() : ''; };
      const seen=new Set(), candidates=[];
      const api='https://commons.wikimedia.org/w/api.php';

      // Each sub-request gets its own try/catch: one flaky query (rate limit,
      // network blip, odd response) must not take down the whole search or
      // skip the Wikipedia fallback below it — previously a single failure
      // anywhere in this function aborted everything with no fallback at all.
      async function addSearch(q){
        try{
          const base={action:'query',format:'json',origin:'*',generator:'search',gsrsearch:q,gsrnamespace:6,gsrlimit:12,prop:'imageinfo',iiprop:'url|extmetadata',iiurlwidth:imgWidth};
          const data=await fetch(api+'?'+new URLSearchParams(base).toString()).then(r=>r.json());
          for(const page of Object.values(data.query?.pages||{})){
            if(seen.has(page.pageid)) continue;
            seen.add(page.pageid); const info=page.imageinfo?.[0]; if(!info) continue;
            const meta=info.extmetadata||{};
            const title=String(page.title||'').replace(/^File:/,'');
            const text=[title,clean(meta.ImageDescription),clean(meta.ObjectName),clean(meta.Categories)].join(' ');
            if(!info.thumburl && !info.url) continue;
            let score=0;
            if(badWords.test(text)) score-=1000;
            if(cityMode && skylineWords.test(text)) score+=45;
            if(!cityMode && placeWords.test(text)) score+=18;
            if(/\bphoto(graph)?|photograph|view\b/i.test(text)) score+=4;
            if(info.width && info.height){
              const ratio=info.width/info.height;
              if(ratio>=1.35) score+=5;
              if(ratio<0.8) score-=8;

            candidates.push({page,info,meta,text,score});
          }

      }

        // One targeted query up front — a city wants a skyline/cityscape shot,
        // a place wants its own name. Extra query variations (a second city
        // phrasing, a "landmark" suffix) used to always run too, doubling or
        // tripling the request count for little gain; now they only run if
        // this first query didn't turn up anything usable, and a manual
        // "try another photo" click covers the rest far more cheaply than an
        // exhaustive automatic search ever could.
        await addSearch(cityMode ? `"${query}" skyline` : `"${query}"`);

        if(!haveViable){

          haveViable = candidates.some(c=>c.score>-500 && !(exclude&&exclude.has(c.info.descriptionurl)));
        }

        // Geosearch (nearby-photos-by-coordinate) is a heavier, noisier
        // fallback — only worth the extra request if the name search above
        // came up empty.
        if(!haveViable && Number.isFinite(+lat) && Number.isFinite(+lng)){
          try{
            const geo={action:'query',format:'json',origin:'*',generator:'geosearch',ggsprimary:'all',ggsnamespace:6,ggsradius:7000,ggslimit:15,ggscoord:`${lat}|${lng}`,prop:'imageinfo',iiprop:'url|extmetadata',iiurlwidth:imgWidth};
            const data=await fetch(api+'?'+new URLSearchParams(geo).toString()).then(r=>r.json());
            for(const page of Object.values(data.query?.pages||{})){
              if(seen.has(page.pageid)) continue;
              seen.add(page.pageid); const info=page.imageinfo?.[0]; if(!info) continue;
              const meta=info.extmetadata||{};
              const title=String(page.title||'').replace(/^File:/,'');
              const text=[title,clean(meta.ImageDescription),clean(meta.ObjectName),clean(meta.Categories)].join(' ');
              let score=-3;
              if(badWords.test(text)) score-=1000;
              if(cityMode && skylineWords.test(text)) score+=35;
              if(!cityMode && placeWords.test(text)) score+=18;
              if(info.width && info.height && info.width/info.height>=1.35) score+=4;

        for(const cand of viable.slice(0,6)){

          if(!(await imageLoads(url))) continue;
          return {
            url,
            pageUrl:info.descriptionurl||('https://commons.wikimedia.org/wiki/'+encodeURIComponent(cand.page.title||'')),
            author:clean(meta.Artist)||clean(meta.Credit)||'',
            license:clean(meta.LicenseShortName)||'',
            licenseUrl:meta.LicenseUrl?.value||''
          };
        }
      }catch(e){ /* fall through to the Wikipedia fallback below regardless */ }

      // Commons search found nothing usable (or failed outright) — Wikipedia's
      // own lead image is a solid, almost-always-available last resort, and it
      // now always gets a chance to run instead of being skipped on any error.
      return await wikipediaFallbackImage(query, exclude);
    }

    function stopThumbHtml(id, p){
      const swapBtn = `<button type="button" class="thumb-swap" data-place="${esc(id)}" title="${esc(t('image.swap'))}" aria-label="${esc(t('image.swap'))}" onclick="event.stopPropagation(); swapPlaceImage('${esc(id)}')">🔄</button>`;
      return p.image
        ? `<div class="thumb-wrap">${swapBtn}<img class="stop-thumb" src="${esc(p.image)}" alt="" loading="lazy" title="${esc(p.imageAuthor||'Wikimedia Commons')}" onerror="this.onerror=null; this.style.display='none'; retryPlaceImage('${esc(id)}')">${p.imagePage?`<a class="image-credit" href="${esc(p.imagePage)}" target="_blank" rel="noopener">Wikimedia Commons${p.imageAuthor?' · '+esc(p.imageAuthor):''}</a>`:''}</div>`
        : `<div class="thumb-wrap stop-thumb stop-thumb-empty">${swapBtn}⌖</div>`;
    }
    // Updates a single stop's thumbnail in place, without rebuilding the whole
    // itinerary or the map markers/routes — avoids the flicker that a full
    // render()/redrawMap() would cause every time one place's image arrives.
    function updateStopThumb(id){
      const p = places[id]; if(!p) return;
      document.querySelectorAll(`.stop[data-place="${id}"] .stop-main`).forEach(el=>{
        el.querySelector(':scope > div:first-child, :scope > .stop-thumb-empty')?.remove();
        el.insertAdjacentHTML('afterbegin', stopThumbHtml(id, p));
      });
    }
    async function enrichPlaceImage(id, place, force=false, excludePages=null){
      if(!place || place.imageLoading || (!force && place.image)) return;
      if(!force && place.imageFailedAt && Date.now()-place.imageFailedAt < IMAGE_RETRY_COOLDOWN) return;
      place.imageLoading=true;
      const tr=currentTrip();
      const cityHint=tr?.cityNameEn||tr?.cityLabel||tr?.name||'';
      const imageQuery=[place.nameEn||place.name,cityHint].filter(Boolean).join(' ');
      const image=await queueImageLookup(()=>wikimediaImage(imageQuery, place.lat, place.lng, {city:false, exclude:excludePages}));
      place.imageLoading=false;
      if(image?.url){
        place.image=image.url;
        place.imagePage=image.pageUrl||'';
        place.imageAuthor=image.author||'';
        place.imageLicense=image.license||'';
        place.imageLicenseUrl=image.licenseUrl||'';
        delete place.imageFailedAt;
        if(image.pageUrl){
          place.imageTriedPages=place.imageTriedPages||[];
          if(!place.imageTriedPages.includes(image.pageUrl)) place.imageTriedPages.push(image.pageUrl);
        }
        persist();
        if(currentTrip()) updateStopThumb(id);
      } else {
        place.imageFailedAt=Date.now();
        if(currentTrip()) updateStopThumb(id);
      }
    }

    // Manual "try another photo" button: remembers every photo already shown
    // for this place so it never repeats one, and only searches on request —
    // the automatic side stays cheap (one query) and this covers the rest.
    async function swapPlaceImage(id){
      const p=places[id]; if(!p || p.imageLoading) return;
      p.imageTriedPages=p.imageTriedPages||[];
      if(p.imagePage && !p.imageTriedPages.includes(p.imagePage)) p.imageTriedPages.push(p.imagePage);
      p.image=''; p.imagePage=''; p.imageAuthor=''; p.imageLicense=''; p.imageLicenseUrl=''; delete p.imageFailedAt;
      updateStopThumb(id);
      await enrichPlaceImage(id, p, true, new Set(p.imageTriedPages));
    }

    async function enrichCityImage(trip, force=false, excludePages=null){
      if(!trip || trip.cityImageLoading || (!force && trip.cityImage)) return;
      if(!force && trip.cityImageFailedAt && Date.now()-trip.cityImageFailedAt < IMAGE_RETRY_COOLDOWN) return;
      trip.cityImageLoading=true;
      const image=await queueImageLookup(()=>wikimediaImage(trip.cityNameEn||trip.name, trip.center?.[0], trip.center?.[1], {city:true, exclude:excludePages}));
      trip.cityImageLoading=false;
      if(image?.url){
        trip.cityImage=image.url;
        trip.cityImagePage=image.pageUrl||'';
        trip.cityImageAuthor=image.author||'';
        trip.cityImageLicense=image.license||'';
        trip.cityImageLicenseUrl=image.licenseUrl||'';
        delete trip.cityImageFailedAt;
        if(image.pageUrl){
          trip.cityImageTriedPages=trip.cityImageTriedPages||[];
          if(!trip.cityImageTriedPages.includes(image.pageUrl)) trip.cityImageTriedPages.push(image.pageUrl);
        }
        saveTrips();
        if(currentTripId===trip.id) renderTripHeader();
        renderHome();
      } else {
        trip.cityImageFailedAt=Date.now();
      }
    }

    async function swapCityImage(){
      const trip=currentTrip(); if(!trip || trip.cityImageLoading) return;
      trip.cityImageTriedPages=trip.cityImageTriedPages||[];
      if(trip.cityImagePage && !trip.cityImageTriedPages.includes(trip.cityImagePage)) trip.cityImageTriedPages.push(trip.cityImagePage);
      trip.cityImage=''; trip.cityImagePage=''; trip.cityImageAuthor=''; trip.cityImageLicense=''; trip.cityImageLicenseUrl=''; delete trip.cityImageFailedAt;
      renderTripHeader();
      await enrichCityImage(trip, true, new Set(trip.cityImageTriedPages));
    }
    async function bilingualNames(name, bias){
      const result={he:'',en:''};
      try{ const a=await googleTextSearchLang(name,'he',bias); result.he=a[0]?.displayName?.text||''; result.hePhoto=photoUrl(a[0]?.photos?.[0]); }catch(e){}
      try{ const a=await googleTextSearchLang(name,'en',bias); result.en=a[0]?.displayName?.text||''; result.enPhoto=photoUrl(a[0]?.photos?.[0]); }catch(e){}
      return result;
    }
    async function googleCitySearch(query){
      if(!googleAvailable()) throw new Error('no key');
      const res = await fetch(placesUrl(':searchText'), { method:'POST', headers:placesHeaders('places.id,places.displayName,places.formattedAddress,places.location,places.viewport'), body:JSON.stringify({ textQuery:query, languageCode:langCode(), includedType:'locality', maxResultCount:5 }) });
      if(!res.ok) throw new Error('city ' + res.status);
      return (await res.json()).places || [];
    }
    async function googleNearby(lat,lng){
      if(!googleAvailable()) throw new Error('no key');
      const res = await fetch(placesUrl(':searchNearby'), { method:'POST', headers:placesHeaders('places.id,places.displayName,places.location,places.primaryType'), body:JSON.stringify({ includedTypes:['tourist_attraction','restaurant','cafe','bar','park','museum'], maxResultCount:12, languageCode:langCode(), locationRestriction:{ circle:{ center:{ latitude:lat, longitude:lng }, radius:1500 } } }) });
      if(!res.ok) throw new Error('nearby ' + res.status);
      return (await res.json()).places || [];
    }

    /* ---------- City lookup (Google first, OSM fallback) ---------- */
    async function findCities(query){
      try {
        const found = await googleCitySearch(query);
        if(found.length) return found.map(p=>({
          name:p.displayName?.text || query,
          detail:p.formattedAddress || '',
          lat:p.location.latitude, lng:p.location.longitude,
          viewport: p.viewport ? { north:p.viewport.high.latitude, south:p.viewport.low.latitude, east:p.viewport.high.longitude, west:p.viewport.low.longitude } : null,
          image:photoUrl(p.photos?.[0])
        }));
      } catch(e){ /* fall through */ }
      try {
        const r = await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=5&featuretype=city&accept-language=' + langCode() + '&q=' + encodeURIComponent(query)).then(r=>r.json());
        return r.map(x=>({
          name:(x.display_name||'').split(',')[0],
          detail:(x.display_name||'').split(',').slice(1,3).join(',').trim(),
          lat:+x.lat, lng:+x.lon,
          viewport: x.boundingbox ? { south:+x.boundingbox[0], north:+x.boundingbox[1], west:+x.boundingbox[2], east:+x.boundingbox[3] } : null,
          image:''
        }));
      } catch(e){ return [] }
    }

    async function enrichTripCity(trip){
      if(!trip) return;
      if(!trip.cityEnriched){
        try{
          const q = trip.cityLabel || trip.name;
          if(googleAvailable()){
            const [he,en] = await Promise.all([googleTextSearchLang(q,'he',trip.center), googleTextSearchLang(q,'en',trip.center)]);
            const gotHe = he[0]?.displayName?.text || '', gotEn = en[0]?.displayName?.text || '';
            trip.cityNameHe = gotHe || trip.cityNameHe || (lang==='he'?trip.name:'');
            trip.cityNameEn = gotEn || trip.cityNameEn || (lang==='en'?trip.name:'');
            // Only lock this in once we actually got real data back — a network
            // hiccup or empty result should not permanently block retrying.
            if(gotHe || gotEn) trip.cityEnriched = true;
          } else {
            trip.cityEnriched = true; // nothing more to fetch without a key
          }
          saveTrips();
        }catch(e){ /* leave cityEnriched unset so this retries next time */ }
      }
      enrichCityImage(trip);
    }

    /* ---------- Home ---------- */

    async function deleteTrip(id){
      if(!confirm(t('confirm.deleteTrip'))) return;
      const trip=trips.find(x=>x.id===id);
      markTripDeleted(id);
      trips=trips.filter(x=>x.id!==id);
      if(currentTripId===id){
        currentTripId=null;
        document.getElementById('homeView').style.display='block';
        document.getElementById('tripView').style.display='none';
        document.getElementById('fabBtn').style.display='none';
        if(firebaseUnsub){ firebaseUnsub(); firebaseUnsub=null; }
      }
      renderHome();
      if(firebaseReady && firebaseUser && firestore){
        try{
          const ref=firestore.doc(firestore.db,'users',firebaseUser.uid);
          await firestore.runTransaction(firestore.db,async tx=>{
            const snap=await tx.get(ref);
            const data=snap.exists()?snap.data():{};
            const deleted={...(data.deletedTripIds||{}),[id]:Date.now()};
            const cloudTrips=(data.trips||[]).map(normaliseTrip).filter(x=>x.id!==id&&!deleted[x.id]);
            tx.set(ref,{trips:cloudTrips.map(x=>({...x,schedule:prepareScheduleForCloud(x.schedule)})),deletedTripIds:deleted,updatedAt:firestore.serverTimestamp()},{merge:true});
          });
          if(trip?.sharedId && trip.sharedRole==='owner'){
            try{await firestore.deleteDoc(firestore.doc(firestore.db,'sharedTrips',trip.sharedId));}catch(e){console.info('shared delete failed',e)}
          }
          setSyncState('synced');
        }catch(e){
          console.info('trip delete sync failed',e);
          setSyncState(navigator.onLine?'pending':'offline');
          queueUserTripsSave();
        }
      }else{ saveTrips(); }
    }

    /* ---------- Trip view ---------- */

    function persist(){ const trip = currentTrip(); if(trip){ trip.places = places; trip.schedule = schedule } saveTrips() }

    async function locateTripCity(id, name){
      const trip = trips.find(x=>x.id===id); if(!trip) return;
      const hits = await findCities(name);
      if(!hits.length) return;
      trip.center = [hits[0].lat, hits[0].lng];
      trip.viewport = hits[0].viewport;
      trip.cityLabel = hits[0].name;
      saveTrips();
      if(currentTripId === id){ centerOnCity(); loadWeather() }
    }

    /* ---------- Map ---------- */
    function coords(id){ const p = places[id]; return p && Number.isFinite(+p.lat) ? [+p.lat, +p.lng] : null }
    function dayForPlace(id){ return schedule.findIndex(d=>d.stops.some(s=>s[0]===id)) }
    function bucketOf(p){
      const c = (p.category||'').toLowerCase();
      if(/restaurant|cafe|coffee|bar|bakery|food|meal|pub|ice_cream|dessert|winery/.test(c)) return 'food';
      if(/museum|tourist|attraction|church|synagogue|mosque|temple|monument|historic|landmark|gallery|castle|viewpoint|square|memorial/.test(c)) return 'sight';
      return 'activity';
    }
    function passesFilter(p){ return activeFilter === 'all' || bucketOf(p) === activeFilter }

    window.mapLoadFailed = function(kind){
      const label = document.getElementById('mapLabel');
      if(label) label.textContent = t(kind === 'auth' ? 'map.authFailed' : kind === 'nokey' ? 'map.noKey' : 'map.failed');
    };

    function centerOnCity(){
      const trip = currentTrip();
      if(!freeMap || !trip || !trip.center) return;
      if(trip.viewport){
        freeMap.fitBounds(new google.maps.LatLngBounds({lat:trip.viewport.south,lng:trip.viewport.west},{lat:trip.viewport.north,lng:trip.viewport.east}), 40);
      } else { freeMap.setCenter({lat:trip.center[0],lng:trip.center[1]}); freeMap.setZoom(12) }
    }
    function fitAllPlaces(){
      if(!freeMap) return;
      const b = new google.maps.LatLngBounds(); let n = 0;
      Object.keys(places).forEach(id=>{ const c = coords(id); if(c && passesFilter(places[id])){ b.extend({lat:c[0],lng:c[1]}); n++ } });
      if(!n) return centerOnCity();
      if(n===1){ freeMap.setCenter(b.getCenter()); freeMap.setZoom(15) } else freeMap.fitBounds(b, 70);
    }

    function popupHtml(id){
      const p = places[id];
      return `<div style="font-family:Rubik,sans-serif;line-height:1.45;min-width:180px;direction:${lang==='he'?'rtl':'ltr'};text-align:start">
        <b style="font-size:14px">${esc(lang==='he' ? (p.nameHe||p.name) : (p.nameEn||p.name))}</b>${(lang==='he' ? p.nameEn : p.nameHe)?`<br><small style="color:#6a746e">${esc(lang==='he'?p.nameEn:p.nameHe)}</small>`:''}<br>
        <small style="color:#6a746e">${esc(t('filter.'+bucketOf(p)))}</small><br>
        <span style="font-size:12px">${esc(p.notes || t('place.noNotes'))}</span>

      });

    function renderDayLegend(){
      document.getElementById('dayLegend').innerHTML = schedule.map((d,i)=>`<span class="day-chip"><i style="background:${DAY_COLORS[i%DAY_COLORS.length]}"></i>${esc(t('day',{n:i+1}))}${dayDate(i)?' · '+esc(dayDate(i)):''}</span>`).join('');
    }

    function redrawMap(){
      if(!freeMap) return;
      liveMarkers.forEach(m=>m.setMap(null)); liveMarkers = [];
      const placeNumbers = new Map();
      let number = 1;
      schedule.forEach(d=>d.stops.forEach(s=>{ if(places[s[0]]) placeNumbers.set(s[0], number++); }));
      Object.entries(places).forEach(([id,p])=>{
        if(!passesFilter(p)) return;
        const c = coords(id); if(!c) return;
        const di = dayForPlace(id);
        const color = di>=0 ? DAY_COLORS[di%DAY_COLORS.length] : '#6a746e';
        const m = new google.maps.Marker({
          position:{lat:c[0],lng:c[1]}, map:freeMap, title:p.name,
          label:{ text:String(placeNumbers.get(id)||'•'), color:'#15231f', fontSize:'11px', fontWeight:'700' },
          icon:{ path:google.maps.SymbolPath.CIRCLE, scale:13, fillColor:color, fillOpacity:.95, strokeColor:'#fff', strokeWeight:2 }
        });
        m.addListener('click', ()=>{ infoWindow.setContent(popupHtml(id)); infoWindow.open({map:freeMap, anchor:m}) });
        liveMarkers.push(m);
      });
      renderDayLegend();
      computeRoutes();
    }

    /* ---------- Routes + real travel times ---------- */
    function fmtDuration(sec){
      const m = Math.round(sec/60);
      if(m < 60) return lang === 'he' ? m + ' דק׳' : m + ' min';
      const h = Math.floor(m/60), r = m%60;
      return lang === 'he' ? (h + ' ש׳' + (r? ' ' + r + ' דק׳':'')) : (h + ' h' + (r? ' ' + r + ' min':''));
    }
    function fmtDistance(m){
      if(m < 1000) return Math.round(m) + (lang==='he'?' מ׳':' m');
      return (m/1000).toFixed(1) + (lang==='he'?' ק״מ':' km');
    }

    async function fetchDayRoute(di, profile){
      const stops = schedule[di].stops;
      const usable = stops.map(s=>coords(s[0])).filter(Boolean);
      if(usable.length < 2) return { di, usable, data:null };

      let data = null;
      for(const p of [profile, 'driving']){
        try {
          const url = `https://router.project-osrm.org/route/v1/${p}/` + usable.map(c=>c[1]+','+c[0]).join(';') + '?overview=full&geometries=geojson';
          const json = await fetch(url).then(r=>r.json());
          if(json.code === 'Ok' && json.routes?.[0]){ data = { route:json.routes[0], profile:p }; break }
        } catch(e){ /* try next */ }
      }
      return { di, usable, data };
    }

    async function computeRoutes(){
      routeLines.forEach(l=>l.setMap(null)); routeLines = [];
      const trip = currentTrip();
      const profile = trip && trip.travelMode === 'driving' ? 'driving' : 'foot';
      let totalSeconds = 0;

      // All days are independent, so fetch every day's route in parallel
      // instead of waiting for each one to finish before starting the next —
      // this was previously the slowest part of opening a multi-day trip.
      const results = await Promise.all(schedule.map((_,di)=>fetchDayRoute(di, profile)));

      results.forEach(({di, usable, data})=>{
        if(usable.length < 2){ setTravelTexts(di, null); return }
        const color = DAY_COLORS[di%DAY_COLORS.length];
        if(data){
          const path = data.route.geometry.coordinates.map(([lng,lat])=>({lat,lng}));
          if(freeMap) routeLines.push(new google.maps.Polyline({ path, geodesic:true, strokeColor:color, strokeWeight:4, strokeOpacity:.8, map:freeMap }));
          const legs = data.route.legs.map(l=>({ sec:l.duration, m:l.distance, profile:data.profile }));
          legs.forEach(l=> totalSeconds += l.sec);
          setTravelTexts(di, legs);
        } else {
          if(freeMap) routeLines.push(new google.maps.Polyline({ path:usable.map(c=>({lat:c[0],lng:c[1]})), geodesic:true, strokeColor:color, strokeWeight:3, strokeOpacity:.5, map:freeMap }));
          setTravelTexts(di, null);
        }
      });
      document.getElementById('statTime').textContent = totalSeconds ? fmtDuration(totalSeconds) : '—';
    }

    function setTravelTexts(di, legs){
      document.querySelectorAll(`.travel[data-day="${di}"]`).forEach((el,i)=>{
        if(!legs || !legs[i]){ el.textContent = ''; return }
        const leg = legs[i];
        el.textContent = t(leg.profile === 'foot' ? 'travel.walk' : 'travel.drive', { time:fmtDuration(leg.sec), dist:fmtDistance(leg.m) });
      });
    }

    /* ---------- Itinerary ---------- */
    const daysBox = document.getElementById('days');
    function render(){
      daysBox.innerHTML = schedule.map((d,di)=>{
        const color = DAY_COLORS[di%DAY_COLORS.length];
        const stopsHtml = d.stops.length ? d.stops.map((s,i)=>{
          const p = places[s[0]]; if(!p) return '';
          const daySel = schedule.length > 1 ? `<select class="move-day" data-place="${s[0]}">${schedule.map((_,j)=>`<option value="${j}" ${j===di?'selected':''}>${esc(t('day.moveTo',{n:j+1}))}</option>`).join('')}</select>` : '';
          return `<div class="stop" draggable="true" data-place="${s[0]}">
            <span class="handle">⠿</span>
            <div class="stop-main">${stopThumbHtml(s[0], p)}<div class="stop-copy">${stopCopyHtml(p)}</div></div>
            <span class="stop-tools">${daySel}<button class="icon-btn del-stop" data-place="${s[0]}" title="${esc(t('day.removeStop'))}">✕</button></span>
          </div>${i < d.stops.length-1 ? `<div class="travel" data-day="${di}">${esc(t('travel.pending'))}</div>` : ''}`;
        }).join('') : `<div class="day-empty">${esc(t('day.empty'))}</div>`;

        return `<article class="day">
          <div class="daytop">
            <span class="daynum" style="background:${color}22;border:1px solid ${color};color:${color}">${String(di+1).padStart(2,'0')}</span>
            <strong>${esc(t('day',{n:di+1}))}</strong>
            <span class="dd">${esc(dayDate(di))}</span>
            <span class="day-tools">${d.stops.length>2?`<button class="icon-btn opt-day" data-day="${di}">${esc(t('day.optimize'))}</button>`:''}</span>
          </div>
          <div class="stops" data-day="${di}">${stopsHtml}</div>
        </article>`;
      }).join('');

      Object.entries(places).forEach(([id,p])=>{ if(!p.image && !p.imageLoading) enrichPlaceImage(id,p); });
      document.getElementById('statPlaces').textContent = Object.keys(places).length;
      document.getElementById('statDays').textContent = schedule.length;

      daysBox.querySelectorAll('.del-stop').forEach(b=> b.onclick = e=>{ e.stopPropagation(); removePlace(b.dataset.place) });
      daysBox.querySelectorAll('.opt-day').forEach(b=> b.onclick = ()=> optimiseDay(+b.dataset.day));
      daysBox.querySelectorAll('.move-day').forEach(sel=>{
        sel.onclick = e=>e.stopPropagation();
        sel.onchange = ()=> moveStop(sel.dataset.place, +sel.value);
      });
      bindDrag();
      persist();
      renderDayLegend();
      if(freeMap) redrawMap(); else computeRoutes();
      fillDaySelect();
    }

    function moveStop(id, toDay){
      const from = schedule.findIndex(d=>d.stops.some(s=>s[0]===id));
      if(from < 0 || from === toDay) return;
      const stop = schedule[from].stops.find(s=>s[0]===id);
      schedule[from].stops = schedule[from].stops.filter(s=>s[0]!==id);
      schedule[toDay].stops.push(stop);
      render();
    }
    function removePlace(id){
      schedule.forEach(d=> d.stops = d.stops.filter(s=>s[0]!==id));
      delete places[id];
      render();
    }
    function bindDrag(){
      let dragged;
      document.querySelectorAll('.stop').forEach(el=>{
        el.addEventListener('dragstart',()=>{ dragged = el; el.style.opacity='.4' });
        el.addEventListener('dragend',()=>{ el.style.opacity='1' });
      });
      document.querySelectorAll('.stops').forEach(box=>{
        box.addEventListener('dragover', e=>e.preventDefault());
        box.addEventListener('drop', ()=>{ if(dragged) moveStop(dragged.dataset.place, +box.dataset.day) });
      });
    }
    function optimiseDay(di){
      const day = schedule[di];
      if(!day || day.stops.length < 3) return;
      const rest = [...day.stops], ordered = [rest.shift()];
      let last = coords(ordered[0][0]);
      while(rest.length){
        let best = 0, bestD = Infinity;
        rest.forEach((s,i)=>{ const p = coords(s[0]); if(!p||!last) return; const d = (p[0]-last[0])**2+(p[1]-last[1])**2; if(d<bestD){bestD=d;best=i} });
        const next = rest.splice(best,1)[0];
        ordered.push(next); last = coords(next[0]) || last;
      }
      day.stops = ordered; render();
    }

    document.getElementById('nearbyBtn').onclick = ()=>{ if(!freeMap) return; const c = freeMap.getCenter(); nearbyAt(c.lat(), c.lng()) };

    /* ---------- Weather + weather-aware packing ---------- */
    const WX = {
      0:['☀️','Clear','שמיים בהירים'],1:['🌤️','Mostly clear','בהיר בעיקר'],2:['⛅','Partly cloudy','מעונן חלקית'],3:['☁️','Cloudy','מעונן'],
      45:['🌫️','Fog','ערפל'],48:['🌫️','Fog','ערפל'],
      51:['🌦️','Light drizzle','טפטוף קל'],53:['🌦️','Drizzle','טפטוף'],55:['🌦️','Drizzle','טפטוף'],
      61:['🌧️','Light rain','גשם קל'],63:['🌧️','Rain','גשם'],65:['🌧️','Heavy rain','גשם חזק'],
      71:['🌨️','Light snow','שלג קל'],73:['🌨️','Snow','שלג'],75:['❄️','Heavy snow','שלג כבד'],
      80:['🌦️','Showers','ממטרים'],81:['🌦️','Showers','ממטרים'],82:['⛈️','Heavy showers','ממטרים עזים'],
      95:['⛈️','Thunderstorm','סופת רעמים'],96:['⛈️','Thunderstorm','סופת רעמים'],99:['⛈️','Thunderstorm','סופת רעמים']
    };
    function wxInfo(code){ const e = WX[code] || ['🌡️','—','—']; return { icon:e[0], text: lang==='he'?e[2]:e[1] } }
    let wxSuggestions = [];

    async function loadWeather(){
      const trip = currentTrip();
      const body = document.getElementById('wxBody');
      document.getElementById('packSuggest').innerHTML = '';
      if(!trip) return;
      if(!trip.startDate || !trip.center){ body.innerHTML = `<p style="color:var(--muted);font-size:12.5px;margin:0">${esc(t('wx.needDate'))}</p>`; return }
      body.innerHTML = `<p style="color:var(--muted);font-size:12.5px;margin:0">${esc(t('wx.loading'))}</p>`;

      const start = isoForDay(0, trip.startDate), end = isoForDay(schedule.length-1, trip.startDate);
      const daysAhead = (new Date(start+'T00:00:00') - new Date(new Date().toDateString())) / 86400000;
      const useForecast = daysAhead <= 15;
      const [lat,lng] = trip.center;

      try {
        let url, typical = false;
        if(useForecast){
          url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lng}&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,wind_speed_10m_max&timezone=auto&start_date=${start}&end_date=${end}`;
        } else {
          typical = true;
          const shift = iso=> (new Date(iso+'T00:00:00').getFullYear()-1) + iso.slice(4);
          url = `https://archive-api.open-meteo.com/v1/archive?latitude=${lat}&longitude=${lng}&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum,wind_speed_10m_max&timezone=auto&start_date=${shift(start)}&end_date=${shift(end)}`;
        }
        const data = await fetch(url).then(r=>r.json());
        const d = data.daily;
        if(!d || !d.time?.length) throw new Error('no data');

        body.innerHTML = d.time.map((_,i)=>{
          const info = wxInfo(d.weather_code[i]);
          const rain = useForecast ? (d.precipitation_probability_max?.[i] ?? null) : null;
          return `<div class="wx-row"><span class="ic">${info.icon}</span>
            <span class="d">${esc(t('day',{n:i+1}))} · ${esc(dayDate(i))}</span>
            <b>${Math.round(d.temperature_2m_max[i])}° / ${Math.round(d.temperature_2m_min[i])}°</b>
            ${rain!==null?`<span style="color:var(--muted)">${rain}%</span>`:''}</div>`;
        }).join('') + `<div class="wx-note">${esc(t(typical ? 'wx.typical' : 'wx.forecast'))}</div>`;

        buildPackingSuggestions(d, useForecast);
      } catch(e){
        body.innerHTML = `<p style="color:var(--muted);font-size:12.5px;margin:0">${esc(t('wx.error'))}</p>`;
      }
    }

    function buildPackingSuggestions(d, isForecast){
      const maxT = Math.max(...d.temperature_2m_max), minT = Math.min(...d.temperature_2m_min);
      const spread = Math.max(...d.temperature_2m_max.map((v,i)=>v - d.temperature_2m_min[i]));
      const wetDay = isForecast
        ? Math.max(...(d.precipitation_probability_max||[0])) >= 40
        : Math.max(...(d.precipitation_sum||[0])) >= 2;
      const heavyRain = (d.weather_code||[]).some(c=>[63,65,80,81,82,95,96,99].includes(c));
      const wind = Math.max(...(d.wind_speed_10m_max||[0]));

      const keys = [];
      if(wetDay) keys.push('pack.rain');
      if(heavyRain) keys.push('pack.rainCoat');
      if(maxT >= 26){ keys.push('pack.sun','pack.hat','pack.water') }
      if(maxT >= 30) keys.push('pack.sandals');
      if(minT <= 8) keys.push('pack.warm');
      if(minT <= 2) keys.push('pack.beanie');
      if(spread >= 11) keys.push('pack.layers');
      if(wind >= 35) keys.push('pack.wind');

      const trip = currentTrip();
      const have = new Set((trip?.packing||[]).map(x=>x.text));
      wxSuggestions = [...new Set(keys)].map(k=>t(k)).filter(x=>!have.has(x));
      renderSuggestions();
    }

    function renderSuggestions(){
      const box = document.getElementById('packSuggest');
      if(!wxSuggestions.length){ box.innerHTML = ''; return }
      box.innerHTML = `<div style="width:100%;color:var(--muted);font-size:11.5px">${esc(t('pack.suggested'))}</div>` +
        wxSuggestions.map((s,i)=>`<button class="chip" data-i="${i}">+ ${esc(s)}</button>`).join('');
      box.querySelectorAll('.chip').forEach(b=> b.onclick = ()=>{
        const trip = currentTrip(); if(!trip) return;
        trip.packing.push({ text:wxSuggestions[+b.dataset.i], done:false });
        wxSuggestions.splice(+b.dataset.i,1);
        saveTrips(); renderPacking(); renderSuggestions();
      });
    }

    /* ---------- Packing + note ---------- */
    function renderPacking(){
      const trip = currentTrip(); if(!trip) return;
      const box = document.getElementById('packList');
      box.innerHTML = trip.packing.map((item,i)=>`<label><input type="checkbox" data-i="${i}" ${item.done?'checked':''}><span>${esc(item.text)}</span><button class="del" data-i="${i}" aria-label="remove">✕</button></label>`).join('');
      box.querySelectorAll('input').forEach(inp=> inp.onchange = ()=>{ trip.packing[+inp.dataset.i].done = inp.checked; saveTrips() });
      box.querySelectorAll('.del').forEach(b=> b.onclick = ()=>{ trip.packing.splice(+b.dataset.i,1); saveTrips(); renderPacking() });
    }
    document.getElementById('addPackBtn').onclick = ()=>{
      const trip = currentTrip(); if(!trip) return;

    };
    document.getElementById('tripNote').addEventListener('input', e=>{ const trip = currentTrip(); if(trip){ trip.note = e.target.value; saveTrips() } });

    /* ---------- New destination with city suggestions ---------- */
    const newTripModal = document.getElementById('newTripModal');
    let selectedTripDays = 3, chosenCity = null, suggestTimer;

    /* Trip length stepper: 1–30 days */
    const MAX_DAYS = 30;
    const daysDecBtn = document.getElementById('daysDecBtn');
    const daysIncBtn = document.getElementById('daysIncBtn');
    const daysValue = document.getElementById('daysValue');
    function setDays(n){

      daysIncBtn.disabled = selectedTripDays >= MAX_DAYS;

    daysDecBtn.addEventListener('click',()=>setDays(selectedTripDays-1));
    daysIncBtn.addEventListener('click',()=>setDays(selectedTripDays+1));

    document.getElementById('newTripHeroBtn').onclick = ()=>{
      document.getElementById('newTripName').value = '';
      document.getElementById('newTripDate').value = '';
      document.getElementById('citySuggest').style.display = 'none';
      document.getElementById('cityAltName').style.display = 'none';

    const cityInput = document.getElementById('newTripName'), citySuggest = document.getElementById('citySuggest'), cityAltName = document.getElementById('cityAltName');
    async function showCityAltName(city){
      if(!city){ cityAltName.style.display='none'; return }
      cityAltName.style.display='none'; cityAltName.textContent='';
      if(!googleAvailable()) return;
      try{
        const names = await bilingualNames(city.name, [city.lat, city.lng]);

    cityInput.addEventListener('input', ()=>{

        citySuggest.style.display = 'block';

        citySuggest.querySelectorAll('button[data-i]').forEach(b=> b.onclick = ()=>{

          cityInput.value = chosenCity.name;

    document.addEventListener('click', e=>{ if(!citySuggest.contains(e.target) && e.target !== cityInput) citySuggest.style.display = 'none' });

    document.getElementById('newTripCancelBtn').onclick = ()=>newTripModal.classList.remove('open');
    document.getElementById('newTripCreateBtn').onclick = async ()=>{
      const typed = cityInput.value.trim();

        places:{}, schedule: Array.from({length:selectedTripDays}, ()=>({date:'',stops:[]})),

    /* ---------- Add places ---------- */
    const modal = document.getElementById('modal');
    function openImporter(){

    function fillDaySelect(){

    function targetDayIndex(){ const v = +document.getElementById('targetDay').value; return Number.isFinite(v) && schedule[v] ? v : 0 }

    async function searchPlaces(){
      const q = document.getElementById('placeSearch').value.trim(), box = document.getElementById('searchResults');
      if(!q) return;
      box.textContent = t('add.searching');
      const trip = currentTrip();
      try {
        let found;
        try {
          const g = await googleTextSearch(q, trip && trip.center);
          if(!g.length) throw new Error('none');
          found = g.map(x=>({ name:x.displayName?.text||q, nameEn:'', nameHe:'', image:photoUrl(x.photos?.[0]), lat:x.location.latitude, lng:x.location.longitude, category:(x.primaryType||'place').replace(/_/g,' ') }));
        } catch(e){
          const near = trip?.center ? `&viewbox=${trip.center[1]-0.35},${trip.center[0]+0.35},${trip.center[1]+0.35},${trip.center[0]-0.35}&bounded=1` : '';
          const osm = await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=6&accept-language=' + langCode() + near + '&q=' + encodeURIComponent(q)).then(r=>r.json());
          found = osm.map(x=>({ name:(x.display_name||'').split(',')[0], nameEn:'', nameHe:'', image:'', lat:+x.lat, lng:+x.lon, category:x.type||'place' }));
        }
        if(!found.length){ box.textContent = t('add.none'); return }
        box.innerHTML = found.map((x,i)=>`<button class="add search-place-result" style="margin-top:6px;text-align:start" data-i="${i}">${x.image?`<img src="${esc(x.image)}" alt="" loading="lazy">`:''}<span>+ ${esc(x.name)} <small>(${esc(x.category)})</small></span></button>`).join('');
        box.querySelectorAll('[data-i]').forEach(b=> b.onclick = ()=>{ addPlace(found[+b.dataset.i], targetDayIndex(), t('place.added')); modal.classList.remove('open') });
      } catch(e){ box.textContent = t('add.error') }
    }

    async function retryPlaceImage(id){
      const p=places[id]; if(!p || p.imageLoading) return;
      p.imageTriedPages=p.imageTriedPages||[];
      if(p.imagePage && !p.imageTriedPages.includes(p.imagePage)) p.imageTriedPages.push(p.imagePage);
      p.image=''; p.imagePage=''; p.imageAuthor=''; p.imageLicense=''; p.imageLicenseUrl='';
      await enrichPlaceImage(id,p,true,new Set(p.imageTriedPages));
    }

    async function enrichMissingPlaceImages(){
      const list=Object.entries(places).filter(([id,p])=>p && !p.image && !p.imageLoading).slice(0,8);
      for(const [id,p] of list) await enrichPlaceImage(id,p);
    }
    async function refreshAllImages(){
      const tr=currentTrip(); if(!tr) return;
      // Existing images in older versions may be wrong. Refresh them once, then keep the selected Commons image.
      const placesList=Object.entries(places).filter(([,p])=>p && !p.imageRefreshDone && !p.imageLoading);
      for(const [id,p] of placesList.slice(0,8)){
        p.imageRefreshDone=true;
        await enrichPlaceImage(id,p,true);
      }
      if(tr.cityImage){
        if(!tr.cityImageRefreshDone){
          tr.cityImageRefreshDone=true;
          await enrichCityImage(tr,true);
        }
      } else {
        await enrichCityImage(tr);
      }
      persist();
    }

    function stopCopyHtml(p){
      return `<b>${esc(lang==='he' ? (p.nameHe||p.name) : (p.nameEn||p.name))}</b>${(lang==='he' ? p.nameEn : p.nameHe)?`<small>${esc(lang==='he'?p.nameEn:p.nameHe)}</small>`:''}<small>${esc(t('filter.'+bucketOf(p)))}</small>`;

    function updateStopName(id){

    async function enrichPlaceNames(id, place){
      if(!place || place.namesLoading || (place.nameHe && place.nameEn)) return;
      place.namesLoading=true;
      try{
        const n=await bilingualNames(place.name,[place.lat,place.lng]);
        if(n.he) place.nameHe=n.he;
        if(n.en) place.nameEn=n.en;
        if(!place.nameHe && lang==='he') place.nameHe=place.name;
        if(!place.nameEn && lang==='en') place.nameEn=place.name;
        persist();
        if(currentTrip()) updateStopName(id);
      }catch(e){}
      place.namesLoading=false;
    }
    async function enrichMissingPlaceNames(){
      const list=Object.entries(places).filter(([,p])=>p && !(p.nameHe&&p.nameEn) && !p.namesLoading).slice(0,5);
      for(const [id,p] of list) await enrichPlaceNames(id,p);
    }

    function addPlace(x, dayIndex, note){
      const id='p'+Date.now()+Math.floor(Math.random()*1000);
      places[id]={name:x.name,nameHe:x.nameHe||'',nameEn:x.nameEn||'',image:x.image||'',lat:x.lat,lng:x.lng,category:x.category,notes:note||''};
      schedule[dayIndex].stops.push([id,'']);
      render();
      if(freeMap) freeMap.panTo({lat:x.lat,lng:x.lng});
      enrichPlaceNames(id, places[id]);
      enrichPlaceImage(id, places[id]);
    }

    async function nearbyAt(lat,lng){
      try {
        let list;
        try {
          const found = await googleNearby(lat,lng);
          if(!found.length) throw new Error('none');
          list = found.map(x=>({ name:x.displayName?.text||'—', nameEn:'', nameHe:'', image:photoUrl(x.photos?.[0]), lat:x.location.latitude, lng:x.location.longitude, category:(x.primaryType||'place').replace(/_/g,' ') }));
        } catch(e){
          const query = `[out:json][timeout:15];(node(around:1200,${lat},${lng})[tourism];node(around:1200,${lat},${lng})[amenity~"restaurant|cafe|bar"];node(around:1200,${lat},${lng})[leisure~"park|garden"];);out 12;`;
          const data = await fetch('https://overpass-api.de/api/interpreter?data=' + encodeURIComponent(query)).then(r=>r.json());
          list = data.elements.filter(x=>x.tags?.name).slice(0,8).map(x=>({ name:x.tags.name, lat:x.lat, lng:x.lon, category:x.tags.amenity||x.tags.tourism||x.tags.leisure||'place' }));
        }
        const win = new google.maps.InfoWindow({
          position:{lat,lng},
          content:`<div style="font-family:Rubik,sans-serif;direction:${lang==='he'?'rtl':'ltr'};text-align:start"><b style="font-size:14px">${esc(t('nearby.title'))}</b><div class="nearby-list">${list.map((x,i)=>`<button class="add-idea" data-i="${i}">+ ${esc(x.name)} <small>(${esc(x.category)})</small></button>`).join('') || esc(t('nearby.none'))}</div></div>`
        });
        win.addListener('domready', ()=>{
          document.querySelectorAll('.gm-style-iw .add-idea').forEach(b=> b.onclick = ()=>{ addPlace(list[+b.dataset.i], 0, t('place.addedNearby')); win.close() });
        });
        win.open(freeMap);
      } catch(e){ alert(t('nearby.error')) }
    }

    document.getElementById('fabBtn').onclick = openImporter;
    document.getElementById('addPlaceBtn').onclick = openImporter;
    document.getElementById('searchBtn').onclick = searchPlaces;
    document.getElementById('placeSearch').addEventListener('keydown', e=>{ if(e.key==='Enter') searchPlaces() });
    document.getElementById('closeBtn').onclick = ()=>modal.classList.remove('open');
    document.querySelectorAll('.modal').forEach(m=> m.addEventListener('click', e=>{ if(e.target===m) m.classList.remove('open') }));
    document.addEventListener('keydown', e=>{ if(e.key==='Escape') document.querySelectorAll('.modal.open').forEach(m=>m.classList.remove('open')) });

    /* ---------- Backup, import, share ---------- */
    function b64encode(obj){ return btoa(String.fromCharCode(...new TextEncoder().encode(JSON.stringify(obj)))) }
    function b64decode(str){ return JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(str), c=>c.charCodeAt(0)))) }

    document.getElementById('exportBtn').onclick = ()=>{
      const blob = new Blob([JSON.stringify({ app:'roam', version:2, exported:new Date().toISOString(), trips }, null, 2)], {type:'application/json'});
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'roam-backup-' + new Date().toISOString().slice(0,10) + '.json';
      a.click(); URL.revokeObjectURL(a.href);
      toast(t('toast.exported'));
    };
    document.getElementById('importFileBtn').onclick = ()=>document.getElementById('importFile').click();
    document.getElementById('importFile').onchange = async e=>{
      const file = e.target.files[0]; if(!file) return;
      try {
        const data = JSON.parse(await file.text());
        const incoming = Array.isArray(data) ? data : data.trips;
        if(!Array.isArray(incoming)) throw new Error('bad');
        if(!confirm(t('confirm.importFile',{n:incoming.length}))) return;
        incoming.forEach(tr=>{ tr.id = 'trip' + Date.now() + Math.floor(Math.random()*1000); trips.push(normaliseTrip(tr)) });
        saveTrips(); renderHome(); toast(t('toast.imported'));
      } catch(err){ toast(t('toast.badFile')) }
      e.target.value = '';
    };
    document.getElementById('shareBtn').onclick = async ()=>{
      const trip=currentTrip(); if(!trip) return;
      if(!firebaseUser){ document.getElementById('authModal').classList.add('open'); document.getElementById('authStatus').style.display='block'; document.getElementById('authStatus').textContent=t('auth.need'); return; }
      document.getElementById('shareStatus').textContent = trip.sharedId ? t('share.existing') : t('share.ready');
      document.getElementById('shareModal').classList.add('open');
    };
    async function createOrCopySharedTrip(){
      const trip=currentTrip(); if(!trip || !firebaseUser || !firebaseReady) return;
      if(trip.sharedId){ return copySharedLink(trip.sharedId); }
      const id='trip_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,8);
      const role=document.getElementById('shareRole').value || 'editor';
      try{
        const ref=firestore.doc(firestore.db,'sharedTrips',id);
        await firestore.setDoc(ref,{name:trip.name,cityNameHe:trip.cityNameHe||'',cityNameEn:trip.cityNameEn||'',cityImage:trip.cityImage||'',startDate:trip.startDate||'',note:trip.note||'',places:trip.places||{},schedule:prepareScheduleForCloud(trip.schedule),center:trip.center||null,viewport:trip.viewport||null,cityLabel:trip.cityLabel||'',packing:trip.packing||[],travelMode:trip.travelMode||'foot',owner:firebaseUser.uid,members:{[firebaseUser.uid]:'owner'},createdAt:firestore.serverTimestamp(),updatedAt:firestore.serverTimestamp(),updatedBy:firebaseUser.uid},{merge:false});
        trip.sharedId=id; trip.sharedRole='owner'; trip.sharedOwner=firebaseUser.uid; saveTrips();
        document.getElementById('shareModal').classList.remove('open');
        await copySharedLink(id); subscribeToSharedTrip(trip);
      }catch(e){ console.error(e); document.getElementById('shareStatus').textContent=t('share.loginFirst'); }
    }
    async function copySharedLink(id, role){
      const selectedRole = role || document.getElementById('shareRole')?.value || 'editor';
      const link=location.origin+location.pathname+'#shared='+encodeURIComponent(id)+'&role='+encodeURIComponent(selectedRole);
      try{ await navigator.clipboard.writeText(link); toast(t('share.created')); }
      catch(e){ location.hash='shared='+encodeURIComponent(id); toast(t('toast.copyFail')); }
    }
    async function subscribeToSharedTrip(trip){
      if(!firebaseReady || !firebaseUser || !trip?.sharedId) return;
      if(firebaseUnsub) firebaseUnsub();
      const ref=firestore.doc(firestore.db,'sharedTrips',trip.sharedId);
      firebaseUnsub=firestore.onSnapshot(ref,(snap)=>{
        if(!snap.exists()) return;
        const d=snap.data(); const local=currentTrip(); if(!local || local.sharedId!==trip.sharedId) return;
        suppressCloudSave=true;
        Object.assign(local,{name:d.name||local.name,cityNameHe:d.cityNameHe||local.cityNameHe||'',cityNameEn:d.cityNameEn||local.cityNameEn||'',cityImage:d.cityImage||local.cityImage||'',startDate:d.startDate||'',note:d.note||'',places:d.places||{},schedule:normaliseTrip({schedule:d.schedule}).schedule,center:d.center||null,viewport:d.viewport||null,cityLabel:d.cityLabel||'',packing:d.packing||[],travelMode:d.travelMode||'foot',sharedOwner:d.owner||local.sharedOwner,sharedRole:d.members?.[firebaseUser.uid]||local.sharedRole||'viewer'});
        places=local.places; schedule=local.schedule; saveTrips(); suppressCloudSave=false;
        setSyncState(snap.metadata.hasPendingWrites?'pending':'synced'); renderHome(); renderTripHeader(); render(); renderPacking();
      },(err)=>{console.error('shared trip sync',err); setSyncState(navigator.onLine?'pending':'offline');});
    }
    async function openSharedFromHash(id, requestedRole='editor'){
      if(!firebaseUser || !firebaseReady){ document.getElementById('authModal').classList.add('open'); document.getElementById('authStatus').style.display='block'; document.getElementById('authStatus').textContent=t('share.loginFirst'); return; }
      try{
        const ref=firestore.doc(firestore.db,'sharedTrips',id); const snap=await firestore.getDoc(ref);
        if(!snap.exists()){ toast('Shared trip not found'); return; }
        const d=snap.data();
        const role=d.members?.[firebaseUser.uid] || (requestedRole==='viewer' ? 'viewer' : 'editor');
        if(!d.members?.[firebaseUser.uid]){
          await firestore.setDoc(ref,{members:{[firebaseUser.uid]:role},updatedAt:firestore.serverTimestamp()},{merge:true});
        }
        const local={id:'trip_'+Date.now(),name:d.name||'Shared trip',cityNameHe:d.cityNameHe||'',cityNameEn:d.cityNameEn||'',cityImage:d.cityImage||'',startDate:d.startDate||'',note:d.note||'',places:d.places||{},schedule:d.schedule||[{date:'',stops:[]}],center:d.center||null,viewport:d.viewport||null,cityLabel:d.cityLabel||d.name||'',packing:d.packing||[],travelMode:d.travelMode||'foot',sharedId:id,sharedRole:role,sharedOwner:d.owner||null};
        trips.push(normaliseTrip(local)); saveTrips(); history.replaceState(null,'',location.pathname); renderHome(); openTrip(local.id); toast(t('share.opened'));
      }catch(e){console.error(e); toast(t('share.loginFirst'));}
    }
    function importFromHash(){
      const shared=location.hash.match(/#shared=([^&]+)(?:&role=([^&]+))?$/); if(shared){ openSharedFromHash(decodeURIComponent(shared[1]), decodeURIComponent(shared[2]||'editor')); return; }
      const m=location.hash.match(/#trip=(.+)$/); if(!m) return;
      try { const trip=b64decode(decodeURIComponent(m[1])); history.replaceState(null,'',location.pathname); trip.id='trip'+Date.now(); trips.push(normaliseTrip(trip)); saveTrips(); renderHome(); openTrip(trip.id); } catch(e){ console.info('bad share link', e) }
    }

    /* ---------- Language wiring ---------- */
    function applyLang(){
      document.documentElement.lang = lang;
      document.documentElement.dir = lang === 'he' ? 'rtl' : 'ltr';
      localStorage.setItem('roam-lang', lang);
      document.querySelectorAll('[data-i18n]').forEach(el=> el.textContent = t(el.dataset.i18n));
      document.querySelectorAll('[data-i18n-ph]').forEach(el=> el.placeholder = t(el.dataset.i18nPh));
      setDays(selectedTripDays);
      document.getElementById('langBtn').textContent = t('lang.switch');
      document.getElementById('exportBtn').textContent = t('export');
      document.getElementById('importFileBtn').textContent = t('import');
      updateAuthButton();
      renderHome();
      if(currentTripId){ renderTripHeader(); render(); renderPacking(); loadWeather() }
    }
    document.getElementById('langBtn').onclick = ()=>{ lang = lang === 'he' ? 'en' : 'he'; applyLang() };

    /* ---------- Maps loader (key from CONFIG) ---------- */
    window.googleMapsReady = new Promise(resolve=>{ window._resolveGoogleMaps = resolve });
    window.initGoogleMaps = function(){ mapsOk = true; window._resolveGoogleMaps() };
    window.gm_authFailure = function(){ mapsOk = false; window.mapLoadFailed('auth') };
    (function loadMaps(){
      const key = CONFIG.mapsScriptKey || CONFIG.googleKey;
      if(!key){ mapsOk = false; window._resolveGoogleMaps(); setTimeout(()=>window.mapLoadFailed('nokey'),0); return }
      const s = document.createElement('script');
      s.src = 'https://maps.googleapis.com/maps/api/js?key=' + encodeURIComponent(key) + '&libraries=places,geometry&loading=async&callback=initGoogleMaps';
      s.async = true; s.defer = true;
      s.onerror = ()=>{ mapsOk = false; window._resolveGoogleMaps(); window.mapLoadFailed() };
      document.head.appendChild(s);
    })();

    /* ---------- Firebase collaboration ---------- */
    async function initFirebase(){
      try{
        const appMod=await import('https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js');
        const authMod=await import('https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js');
        const fireMod=await import('https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js');
        firebaseApp=appMod.initializeApp(FIREBASE_CONFIG);
        firebaseAuth=authMod.getAuth(firebaseApp);
        let db;
        try{ db=fireMod.getFirestore(firebaseApp); await fireMod.enableMultiTabIndexedDbPersistence(db).catch(()=>{}); }
        catch(e){ db=fireMod.getFirestore(firebaseApp); }
        firestore={db,doc:fireMod.doc,getDoc:fireMod.getDoc,setDoc:fireMod.setDoc,updateDoc:fireMod.updateDoc,deleteDoc:fireMod.deleteDoc,runTransaction:fireMod.runTransaction,onSnapshot:fireMod.onSnapshot,serverTimestamp:fireMod.serverTimestamp};
        firebaseReady=true;
        authMod.onAuthStateChanged(firebaseAuth, async u=>{
          firebaseUser=u; updateAuthButton();
          if(u){
            await syncAccountTrips();
            if(location.hash.startsWith('#shared=')) importFromHash();
            const trip=currentTrip(); if(trip?.sharedId) subscribeToSharedTrip(trip);
          } else {
            unsubscribeAccountTrips();
          }
        });
      }catch(e){ console.info('Firebase unavailable; local mode',e); firebaseReady=false; updateAuthButton(); }
    }
    function updateAuthButton(){
      const b=document.getElementById('authBtn'); if(!b) return;
      const name=document.getElementById('userMenuName'), email=document.getElementById('userMenuEmail'), status=document.getElementById('userMenuStatus'), action=document.getElementById('userMenuAction');
      b.innerHTML='';
      if(firebaseUser){
        if(firebaseUser.photoURL){ const img=document.createElement('img'); img.src=firebaseUser.photoURL; img.alt=''; b.appendChild(img); }
        else b.textContent=(firebaseUser.displayName||firebaseUser.email||'U').trim().charAt(0).toUpperCase() || 'U';
        name.textContent=firebaseUser.displayName || t('auth.profile');
        email.textContent=firebaseUser.email || '';
        action.textContent=t('auth.logout');
      }else{
        b.textContent='♙'; name.textContent=t('auth.profile'); email.textContent=''; action.textContent=t('auth.open');
      }
      setSyncState(firebaseUser ? 'synced' : 'offline');
    }
    async function authAction(mode){
      if(!firebaseReady){ document.getElementById('authStatus').style.display='block'; document.getElementById('authStatus').textContent=t('auth.offline'); return; }
      const email=document.getElementById('authEmail').value.trim(), password=document.getElementById('authPassword').value;
      try{
        if(mode==='login') await authModSignIn(email,password);
        else if(mode==='register') await authModRegister(email,password);
        document.getElementById('authModal').classList.remove('open');
      }catch(e){ document.getElementById('authStatus').style.display='block'; document.getElementById('authStatus').textContent=e?.message||t('auth.bad'); }
    }
    let authModSignIn,authModRegister,authModGoogle,authModSignOut;
    async function loadAuthFns(){
      if(!firebaseReady) return;
      const m=await import('https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js');
      authModSignIn=(e,p)=>m.signInWithEmailAndPassword(firebaseAuth,e,p);
      authModRegister=(e,p)=>m.createUserWithEmailAndPassword(firebaseAuth,e,p);
      authModGoogle=()=>m.signInWithPopup(firebaseAuth,new m.GoogleAuthProvider());
      authModSignOut=()=>m.signOut(firebaseAuth);
    }
    const userMenu=document.getElementById('userMenu'), userMenuWrap=document.getElementById('userMenuWrap');
    function toggleUserMenu(){ const open=userMenu.classList.toggle('open'); document.getElementById('authBtn').setAttribute('aria-expanded',String(open)); }
    document.getElementById('authBtn').onclick=(e)=>{ e.stopPropagation(); toggleUserMenu(); };
    document.getElementById('userMenuAction').onclick=async()=>{ if(firebaseUser){ await authModSignOut?.(); userMenu.classList.remove('open'); } else { userMenu.classList.remove('open'); document.getElementById('authModal').classList.add('open'); } };
    document.addEventListener('click',e=>{ if(!userMenuWrap.contains(e.target)) userMenu.classList.remove('open') });
    document.getElementById('authLoginBtn').onclick=()=>authAction('login');
    document.getElementById('authRegisterBtn').onclick=()=>authAction('register');
    document.getElementById('authGoogleBtn').onclick=async()=>{ try{ await authModGoogle?.(); document.getElementById('authModal').classList.remove('open'); }catch(e){ document.getElementById('authStatus').style.display='block'; document.getElementById('authStatus').textContent=e?.message||t('auth.bad'); } };
    document.getElementById('authCloseBtn').onclick=()=>document.getElementById('authModal').classList.remove('open');
    document.getElementById('shareCloseBtn').onclick=()=>document.getElementById('shareModal').classList.remove('open');
    document.getElementById('shareCreateBtn').onclick=createOrCopySharedTrip;
    window.addEventListener('online',()=>{ setSyncState(firebaseUser?'pending':'offline'); queueCloudTripSave(); queueUserTripsSave(); });
    window.addEventListener('offline',()=>setSyncState('offline'));

    /* ---------- Boot ---------- */
    loadDeletedTripIds();
    loadTrips();
    trips = filterDeletedTrips(trips, deletedTripIds);
    applyLang();
    initFirebase().then(loadAuthFns).then(()=>importFromHash());
  </script>
</body>
</html>
